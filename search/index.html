<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Construct Search</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/managed-preview.css">
  <link rel="stylesheet" href="/css/site-typography.css">
  <link rel="stylesheet" href="/css/hero.css">
</head>
<body>
  <header class="site-hero site-hero--supporting">
    <div>
      <span class="eyebrow">The Six.Well Construct</span>
      <h1 class="hero-title">Search</h1>
    </div>
    <nav class="preview-nav"><a href="/home/">Home</a><a href="/archive/">Archive</a></nav>
  </header>
  <main>
    <form class="search-form" data-search-form role="search">
      <input name="q" aria-label="Search the Construct" placeholder="Search works, symbols, flash, and archive">
      <button class="action">Search</button>
    </form>
    <section class="catalog" data-managed-catalog="search" aria-live="polite"></section>
  </main>
  <dialog id="managed-detail" aria-labelledby="managed-dialog-title">
    <div class="dialog-head"><span class="eyebrow">Search result</span><button class="close" data-close aria-label="Close detail">Close</button></div>
    <div data-dialog-content></div>
  </dialog>
  <script src="/js/managed-preview.js"></script>
</body>
</html>
