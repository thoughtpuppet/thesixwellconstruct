      return;
    }

    if (event.target.id === "copyBookingBtn") {
      const value = document.getElementById("bookingUrl")?.value || "";
      if (value) await navigator.clipboard?.writeText(new URL(value, window.location.origin).toString()).catch(() => {});
      setStatus(value ? "Copied" : "No booking URL");
      return;
    }

    if (event.target.id === "revokeBookingBtn" && activeId) {
      setStatus("Revoking links");
      await api("/api/admin/booking/tokens/revoke-submission", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ submissionId: activeId }),
      });
      document.getElementById("bookingUrl").value = "";
      await api(`/api/admin/submissions/${encodeURIComponent(activeId)}`, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          status: document.getElementById("detailStatus").value,
          bookingUrl: "",
          internalNotes: document.getElementById("internalNotes").value,
        }),
      });
      await loadAndRender();
      setStatus("Links revoked");
      return;
    }

    if (event.target.id === "archiveSubmissionBtn" && activeId) {
      const submission = submissions.find((item) => item.id === activeId);
      const label = submission?.contactName || submission?.contactEmail || "this entry";
      if (!window.confirm(`Archive ${label}? The record will be preserved but hidden from active views.`)) return;
      setStatus("Archiving entry");
      const saved = await api(`/api/admin/submissions/${encodeURIComponent(activeId)}`, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          status: "archived",
          tattooStage: TATTOO_PROJECT_TYPES.has(submission?.type) ? "closed" : undefined,
          bookingUrl: submission?.bookingUrl || "",
          internalNotes: document.getElementById("internalNotes")?.value || submission?.internalNotes || "",
        }),
      });
      const index = submissions.findIndex((s) => s.id === activeId);
      if (index >= 0) submissions[index] = saved.submission;
      renderList();
      renderDetail(saved.submission);
      setStatus("Entry archived");
      return;
    }

    if (event.target.id === "deleteSubmissionBtn" && activeId) {
      const submission = submissions.find((item) => item.id === activeId);
      if (submission?.status === "booked" || submission?.status === "paid") {
        setStatus("Cannot delete — archive instead");
        return;
      }
      const label = submission?.contactName || submission?.contactEmail || "this entry";
      if (!window.confirm(`Delete ${label}? This permanently removes the submission record and any booking tokens. This cannot be undone.`)) return;
      setStatus("Deleting entry");
      await api(`/api/admin/submissions/${encodeURIComponent(activeId)}`, { method: "DELETE" });
      submissions = submissions.filter((item) => item.id !== activeId);
      activeId = "";
      renderList();
      detailEl.innerHTML = '<p class="empty">Select a submission to review details.</p>';
      setStatus("Entry deleted");
      return;
    }

    const downloadBtn = event.target.closest("[data-download-file]");
    if (downloadBtn) {
      const fileId = downloadBtn.dataset.downloadFile;
      const fileName = downloadBtn.dataset.downloadName || "file";
      const submissionId = downloadBtn.dataset.submissionId;
      if (!fileId || !submissionId) return;
      setStatus("Downloading…");
      try {
        const res = await fetch(
          `/api/admin/submissions/${encodeURIComponent(submissionId)}/files/${encodeURIComponent(fileId)}`,
          { headers: { authorization: `Bearer ${token}` } }
        );
        if (!res.ok) { setStatus(`Download failed (${res.status})`); return; }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        setStatus("Downloaded");
      } catch (err) {
        setStatus(`Download error: ${err.message}`);
      }
      return;
    }

    const detailSectionToggle = event.target.closest("[data-section-toggle]");
    if (detailSectionToggle) {
      detailSectionToggle.closest(".detail-section")?.classList.toggle("is-open");
      return;
    }

    const toggle = event.target.closest("[data-toggle-window]");
    if (toggle) {
      setStatus("Updating window");
      await api(`/api/admin/booking/availability/${encodeURIComponent(toggle.dataset.toggleWindow)}`, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ active: toggle.dataset.active === "1" }),
      });
      await loadAvailability();
      await loadAvailabilityPreview();
      setStatus("Availability updated");
      return;
    }

    const walkInToggle = event.target.closest("[data-toggle-walk-in]");
    if (walkInToggle) {
      setStatus("Updating walk-in");
      await api(`/api/admin/booking/walk-ins/${encodeURIComponent(walkInToggle.dataset.toggleWalkIn)}`, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ active: walkInToggle.dataset.active === "1" }),
      });
      await loadWalkIns();
      setStatus("Walk-in updated");
      return;
    }

    const walkInDelete = event.target.closest("[data-delete-walk-in]");
    if (walkInDelete) {
      if (!window.confirm("Delete this walk-in window?")) return;
      setStatus("Deleting walk-in");
      await api(`/api/admin/booking/walk-ins/${encodeURIComponent(walkInDelete.dataset.deleteWalkIn)}`, { method: "DELETE" });
      await loadWalkIns();
      setStatus("Walk-in deleted");
      return;
    }

    const dayBtn = event.target.closest("[data-day]");
    if (dayBtn && document.getElementById("bookedCalendar")?.contains(dayBtn)) {
      const clicked = dayBtn.dataset.day;
      selectedCalendarDay = selectedCalendarDay === clicked ? "" : clicked;
      const bookedCells = document.querySelectorAll("#bookedCalendar [data-day]");
      bookedCells.forEach((btn) => btn.classList.toggle("selected", btn.dataset.day === selectedCalendarDay));
      renderDayAppointments(selectedCalendarDay);
      return;
    }

    if (event.target.id === "previewPrevMonth" || event.target.id === "previewNextMonth") {
      const select = document.getElementById("previewMonthSelect");
      const options = Array.from(select?.options || []).map((option) => option.value);
      const current = options.indexOf(availabilityPreviewMonth);
      const next = event.target.id === "previewPrevMonth" ? current - 1 : current + 1;
      if (options[next]) {
        availabilityPreviewMonth = options[next];
        selectedCalendarDay = "";
        await loadAvailabilityPreview();
      }
      return;
    }

    if (event.target.id !== "saveBtn" || !activeId) return;
    setStatus("Saving");
    const payload = await api(`/api/admin/submissions/${encodeURIComponent(activeId)}`, {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        status: document.getElementById("detailStatus").value,
        bookingUrl: document.getElementById("bookingUrl").value,
        internalNotes: document.getElementById("internalNotes").value,
      }),
    });
    const index = submissions.findIndex((submission) => submission.id === activeId);
    if (index >= 0) submissions[index] = payload.submission;
    renderList();
    renderDetail(payload.submission);
    setStatus("Saved");
  });

  detailEl.addEventListener("submit", async (event) => {
    const tattooSettingsForm = event.target.closest("[data-tattoo-settings-form]");
    if (tattooSettingsForm) {
      event.preventDefault();
      const values = Object.fromEntries(new FormData(tattooSettingsForm));
      const rateCards = [...tattooSettingsForm.querySelectorAll("[data-rate-card]")].map((row, index) => ({
        id: row.dataset.id || row.dataset.serviceKey,
        serviceKey: row.dataset.serviceKey,
        label: row.querySelector("[data-rate-label]")?.value.trim() || "",
        rateText: row.querySelector("[data-rate-text]")?.value.trim() || "",
        active: row.querySelector("[data-rate-active]")?.checked !== false,
        sortOrder: index,
      }));
      const specialProjects = [...tattooSettingsForm.querySelectorAll("[data-special-project]")].map((row, index) => ({
        id: row.dataset.id,
        slug: row.dataset.slug,
        title: row.querySelector("[data-special-title]")?.value.trim() || "",
        status: row.querySelector("[data-special-status]")?.value || "closed",
        rateText: row.querySelector("[data-special-rate]")?.value.trim() || "",
        summary: row.querySelector("[data-special-summary]")?.value.trim() || "",
        sortOrder: index,
      }));
      setStatus("Saving tattoo settings");
      await api("/api/admin/tattoo/settings", {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          settings: {
            reviewTimeMessage: String(values.reviewTimeMessage || "").trim(),
            leadTimeDays: Number(values.leadTimeDays || 0),
            supportEmail: String(values.supportEmail || "").trim(),
            walkInGuidance: String(values.walkInGuidance || "").trim(),
          },
          rateCards,
          specialProjects,
        }),
      });
      await renderTattooSettings();
      setStatus("Tattoo settings saved");
      return;
    }

    const bookingTypeForm = event.target.closest("[data-booking-type-form]");
    if (bookingTypeForm) {
      event.preventDefault();
      const id = bookingTypeForm.dataset.bookingTypeForm;
      const input = bookingTypeForm.querySelector('[data-booking-type-field="depositDollars"]');
      const dollars = Number(input?.value || 0);
      if (!Number.isFinite(dollars) || dollars < 0) {
        setStatus("Enter a valid price");
        return;
      }
      const depositCents = Math.round(dollars * 100);
      setStatus("Saving price");
      const payload = await api(`/api/admin/booking/types/${encodeURIComponent(id)}`, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ depositCents }),
      });
      const index = bookingTypes.findIndex((type) => type.id === id);
      if (index >= 0) bookingTypes[index] = payload.bookingType;
      else bookingTypes.push(payload.bookingType);
      renderBookingTypePrices();
      await loadBookingReadiness();
      setStatus("Price saved");
      return;
    }

    const openMicForm = event.target.closest("[data-open-mic-form]");
    if (openMicForm) {
      event.preventDefault();
      const slug = openMicForm.dataset.eventSlug || selectedEventSlug || "cultandshift";
      const id = openMicForm.dataset.openMicForm;
      const fieldValue = (name) => openMicForm.querySelector(`[data-open-mic-field="${name}"]`)?.value ?? "";
      const sendEmail = event.submitter?.dataset.sendOpenMicEmail === "1";
      setStatus(sendEmail ? "Saving and emailing performer" : "Saving open mic slot");
      try {
        await api(`/api/admin/events/${encodeURIComponent(slug)}/open-mic/${encodeURIComponent(id)}`, {
          method: "PATCH",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            status: fieldValue("status"),
            assignedSlot: fieldValue("assignedSlot") ? localDateTimeToIso(fieldValue("assignedSlot")) : "",
            slotDurationMinutes: Number(fieldValue("slotDurationMinutes")) || 5,
            notes: fieldValue("notes"),
            sendEmail,
          }),
        });
        await renderCultAndShiftOpenMic(slug);
        setStatus(sendEmail ? "Performer emailed" : "Open mic slot saved");
      } catch (error) {
        setStatus(error.message || "Could not save open mic slot");
      }
      return;
    }

    const eventCreateForm = event.target.closest("[data-event-create-form]");
    if (eventCreateForm) {
      event.preventDefault();
      const fieldValue = (name) => eventCreateForm.querySelector(`[data-field="${name}"]`)?.value ?? "";
      const title = fieldValue("title").trim();
      if (!title) { setStatus("Title is required"); return; }
      const startsLocal = fieldValue("startsAt");
      const endsLocal = fieldValue("endsAt");
      setStatus("Creating event");
      try {
        await api("/api/admin/events", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            title,
            slug: fieldValue("slug"),
            status: fieldValue("status"),
            location: fieldValue("location"),
            description: fieldValue("description"),
            imageUrl: fieldValue("imageUrl"),
            details: fieldValue("details"),
            included: fieldValue("included"),
            arrivalNotes: fieldValue("arrivalNotes"),
            accessibilityNotes: fieldValue("accessibilityNotes"),
            cancellationPolicy: fieldValue("cancellationPolicy"),
            contactNote: fieldValue("contactNote"),
            waitlistEnabled: fieldValue("waitlistEnabled") !== "0",
            startsAt: startsLocal ? localDateTimeToIso(startsLocal) : "",
            endsAt: endsLocal ? localDateTimeToIso(endsLocal) : "",
            priceCents: Math.round((Number(fieldValue("price")) || 0) * 100),
            currency: (fieldValue("currency") || "USD").toUpperCase(),
            capacity: Number(fieldValue("capacity")) || 0,
            maxSeatsPerOrder: Number(fieldValue("maxSeatsPerOrder")) || 4,
          }),
        });
        await renderEventsManager();
        setStatus("Event created");
      } catch (error) {
        setStatus(error.message || "Could not create event");
      }
      return;
    }

    const eventForm = event.target.closest("[data-event-form]");
    if (eventForm) {
      event.preventDefault();
      const slug = eventForm.dataset.eventForm;
      const fieldValue = (name) => eventForm.querySelector(`[data-field="${name}"]`)?.value ?? "";
      const startsLocal = fieldValue("startsAt");
      const endsLocal = fieldValue("endsAt");
      setStatus("Saving event");
      await api(`/api/admin/events/${encodeURIComponent(slug)}`, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          status: fieldValue("status"),
          title: fieldValue("title"),
          location: fieldValue("location"),
          description: fieldValue("description"),
          imageUrl: fieldValue("imageUrl"),
          details: fieldValue("details"),
          included: fieldValue("included"),
          arrivalNotes: fieldValue("arrivalNotes"),
          accessibilityNotes: fieldValue("accessibilityNotes"),
          cancellationPolicy: fieldValue("cancellationPolicy"),
          contactNote: fieldValue("contactNote"),
          waitlistEnabled: fieldValue("waitlistEnabled") !== "0",
          startsAt: startsLocal ? localDateTimeToIso(startsLocal) : "",
          endsAt: endsLocal ? localDateTimeToIso(endsLocal) : "",
          priceCents: Math.round((Number(fieldValue("price")) || 0) * 100),
          currency: (fieldValue("currency") || "USD").toUpperCase(),
          capacity: Number(fieldValue("capacity")) || 0,
          maxSeatsPerOrder: Number(fieldValue("maxSeatsPerOrder")) || 1,
        }),
      });
      await renderEventsManager();
      setStatus("Event saved");
      return;
    }

    const editForm = event.target.closest("[data-edit-form]");
    if (editForm) {
      event.preventDefault();
      const id = editForm.dataset.editForm;
      setStatus("Saving exception");
      await api(`/api/admin/booking/availability/${encodeURIComponent(id)}`, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(editAvailabilityPayload(editForm)),
      });
      await loadAvailability();
      await loadAvailabilityPreview();
      setStatus("Exception saved");
      return;
    }

    const editWalkInForm = event.target.closest("[data-edit-walk-in-form]");
    if (editWalkInForm) {
      event.preventDefault();
      const id = editWalkInForm.dataset.editWalkInForm;
      setStatus("Saving walk-in");
      await api(`/api/admin/booking/walk-ins/${encodeURIComponent(id)}`, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(editWalkInPayload(editWalkInForm)),
      });
      await loadWalkIns();
      setStatus("Walk-in saved");
      return;
    }

    if (event.target.id === "scheduleForm") {
      event.preventDefault();
      setStatus("Saving schedule");
      const rules = [...document.querySelectorAll("[data-rule-id]")].map((row) => {
        const fields = Object.fromEntries([...row.querySelectorAll("[data-rule-field]")].map((field) => [field.dataset.ruleField, field.value]));
        return {
          id: row.dataset.ruleId,
          active: fields.active === "1",
          startTime: fields.startTime,
          endTime: fields.endTime,
          capacity: fields.capacity,
          bufferBeforeMinutes: fields.bufferBeforeMinutes,
          bufferAfterMinutes: fields.bufferAfterMinutes,
          note: fields.note,
        };
      });
      await api("/api/admin/booking/schedule", {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          settings: {
            timezone: document.getElementById("settingTimezone").value,
            bookingHorizonDays: document.getElementById("settingHorizon").value,
            minimumNoticeHours: document.getElementById("settingNotice").value,
            slotIntervalMinutes: document.getElementById("settingInterval").value,
            maxBookingsPerDay: document.getElementById("settingMaxDay").value,
            defaultCapacity: document.getElementById("settingCapacity").value,
            defaultBufferBeforeMinutes: document.getElementById("settingBufferBefore").value,
            defaultBufferAfterMinutes: document.getElementById("settingBufferAfter").value,
          },
          rules,
        }),
      });
      await loadSchedule();
      await loadAvailabilityPreview();
      setStatus("Schedule saved");
      return;
    }

    if (event.target.id === "walkInForm") {
      event.preventDefault();
      setStatus("Adding walk-in");
      await api("/api/admin/booking/walk-ins", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          startsAt: localDateTimeToIso(document.getElementById("walkInStart").value),
          endsAt: localDateTimeToIso(document.getElementById("walkInEnd").value),
          title: document.getElementById("walkInTitle").value,
          note: document.getElementById("walkInNote").value,
          active: true,
        }),
      });
      event.target.reset();
      document.getElementById("walkInTitle").value = "Walk-in Window";
      await loadWalkIns();
      setStatus("Walk-in added");
      return;
    }

    if (event.target.id !== "availabilityForm") return;
    event.preventDefault();
    const config = availabilityConfig();
    const bookingTypeId = document.getElementById("availabilityType").value;
    if (config.allowUnscopedExceptions === false && !bookingTypeId) {
      setStatus("Choose a studio booking type for studio exceptions");
      return;
    }
    setStatus("Adding exception");
    await api("/api/admin/booking/availability", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        venture: "tattooing",
        startAt: localDateTimeToIso(document.getElementById("availabilityStart").value),
        endAt: localDateTimeToIso(document.getElementById("availabilityEnd").value),
        bookingTypeId,
        capacity: document.getElementById("availabilityCapacity").value,
        bufferBeforeMinutes: document.getElementById("bufferBefore").value,
        bufferAfterMinutes: document.getElementById("bufferAfter").value,
        note: document.getElementById("availabilityNote").value,
        isBlackout: document.getElementById("availabilityBlackout").value === "1",
      }),
    });
    event.target.reset();
    document.getElementById("availabilityCapacity").value = "1";
    document.getElementById("bufferBefore").value = "0";
    document.getElementById("bufferAfter").value = "0";
    await loadAvailability();
    await loadAvailabilityPreview();
    setStatus("Exception added");
  });

  refreshBtn.addEventListener("click", () => loadAndRender().catch((error) => setStatus(error.message)));
  testEmailBtn.addEventListener("click", async () => {
    testEmailBtn.disabled = true;
    setStatus("Sending test email…");
    try {
      await api("/api/admin/notifications/resend", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ templateKey: "admin_test" }),
      });
      setStatus("Test email sent");
    } catch (error) {
      setStatus(error.message);
    } finally {
      testEmailBtn.disabled = false;
    }
  });
  tabsEl.addEventListener("click", (event) => {
    const tabBtn = event.target.closest("[data-tab]");
    if (tabBtn) setActiveTab(tabBtn.dataset.tab);
  });
  toolbarEl.addEventListener("change", (event) => {
    if (event.target.id === "statusFilter") {
      statusValue = event.target.value;
      if (activeTab === "studio" && subView === "bookings") {
        renderStudioBookingList();
        refreshStudioBookingViews();
        return;
      }
      renderList();
      if (activeId) { const s = submissions.find((item) => item.id === activeId); if (s) renderDetail(s); }
    } else if (event.target.id === "typeFilter") {
      typeValue = event.target.value;
      if (activeTab === "studio" && subView === "bookings") {
        renderStudioBookingList();
        refreshStudioBookingViews();
        return;
      }
      renderList();
      if (activeId) { const s = submissions.find((item) => item.id === activeId); if (s) renderDetail(s); }
    }
  });
  subnavEl.addEventListener("click", (event) => {
    const subviewBtn = event.target.closest("[data-subview]");
    if (subviewBtn) { setSubView(subviewBtn.dataset.subview); return; }
    if (event.target.closest("[data-events-home]")) {
      selectedEventSlug = "";
      activeId = "";
      activeAppointmentId = "";
      buildSubnav();
      renderEventsList();
      renderEventsManager().catch((error) => setStatus(error.message));
      return;
    }
    if (event.target.closest("[data-event-setup]")) {
      selectedEventSlug = "";
      activeId = "";
      activeAppointmentId = "";
      buildSubnav();
      renderEventsList();
      renderEventsManager().catch((error) => setStatus(error.message));
    }
  });
  // Home hub + event-detail navigation (separate listener; uses unique attrs).
  detailEl.addEventListener("click", (event) => {
    const homeDay = event.target.closest("[data-home-day]");
    if (homeDay) {
      const clicked = homeDay.dataset.homeDay;
      selectedHomeDay = selectedHomeDay === clicked ? "" : clicked;
      const byDay = homeEntriesByDay();
      document.querySelectorAll("#homeCalendar [data-home-day]").forEach((b) => b.classList.toggle("selected", b.dataset.homeDay === selectedHomeDay));
      renderHomeDay(byDay);
      return;
    }
    if (event.target.id === "homePrevMonth" || event.target.id === "homeNextMonth") {
      const select = document.getElementById("homeMonthSelect");
      const options = Array.from(select?.options || []).map((o) => o.value);
      const current = options.indexOf(homeMonth);
      const next = event.target.id === "homePrevMonth" ? current - 1 : current + 1;
      if (options[next]) { homeMonth = options[next]; selectedHomeDay = ""; renderHome(); }
      return;
    }
    const homeAppointment = event.target.closest("[data-home-appointment]");
    if (homeAppointment) {
      const appointment = appointments.find((item) => item.id === homeAppointment.dataset.homeAppointment);
      if (appointment && isStudioAppointment(appointment)) {
        openStudioAppointment(appointment.id);
        return;
      }
    }
    const apptEntry = event.target.closest("[data-appt-submission]");
    if (apptEntry) {
      const id = apptEntry.dataset.apptSubmission;
      if (id) goToSubmission(id);
      return;
    }
    const homeEvent = event.target.closest("[data-home-event]");
    if (homeEvent) {
      activeTab = "events";
      subView = "requests";
      selectedEventSlug = homeEvent.dataset.homeEvent;
      activeId = "";
      activeAppointmentId = "";
      renderActiveTab();
      return;
    }
    const rsvpEntry = event.target.closest("[data-id]");
    if (rsvpEntry && activeTab === "events") {
      const id = rsvpEntry.dataset.id;
      const submission = submissions.find((s) => s.id === id);
      if (submission) { activeId = id; activeAppointmentId = ""; renderDetail(submission); }
    }
  });
  detailEl.addEventListener("change", (event) => {
    if (event.target.id === "homeMonthSelect") {
      homeMonth = event.target.value;
      selectedHomeDay = "";
      renderHome();
      return;
    }
    if (event.target.id !== "previewMonthSelect") return;
    availabilityPreviewMonth = event.target.value;
    selectedCalendarDay = "";
    loadAvailabilityPreview().catch((error) => setStatus(error.message));
  });
  lockBtn.addEventListener("click", () => {
    token = "";
    localStorage.removeItem(tokenKey);
    tokenInput.value = "";
    tokenModal.classList.remove("hidden");
    setStatus("Locked");
  });

  if (directInvitePreview) {
    tokenModal.classList.add("hidden");
    activeTab = "tattoo";
    subView = "direct-invite";
    renderActiveTab();
    setStatus("Direct invite preview");
  } else if (token) {
    tokenModal.classList.add("hidden");
    loadAndRender().catch((error) => {
      setStatus(error.message);
      tokenModal.classList.remove("hidden");
    });
  }
})();
</script>
<script src="/studio/connections-manager.js?v=1"></script>
<script src="/studio/construct-manager.js?v=multi-styles-legend-variants"></script>
<script src="/studio/people-manager.js?v=1"></script>
</body>
