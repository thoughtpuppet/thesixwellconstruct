<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Submissions - The Six Well Construct</title>
<style>
  :root {
    --bg:#0e0e0e; --panel:#161616; --line:rgba(255,231,202,0.16);
    --line-strong:rgba(255,231,202,0.32); --text:#FFE7CA;
    --muted:rgba(255,231,202,0.62); --dim:rgba(255,231,202,0.38);
    --accent:#FCB867; --signal:#7A1010;
    --sans:Inter,"Helvetica Neue",Arial,sans-serif; --serif:Georgia,"Times New Roman",Times,serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--serif); }
  button,input,textarea,select { font:inherit; }
  button { cursor:pointer; }
  .shell { min-height:100vh; display:grid; grid-template-rows:auto 1fr; }
  header { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px 28px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-family:var(--sans); font-size:18px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); }
  .header-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .status { color:var(--dim); font-family:var(--sans); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; }
  .layout { display:grid; grid-template-columns:minmax(320px,440px) minmax(0,1fr); min-height:0; }
  .list-pane { border-right:1px solid var(--line); min-height:0; overflow:auto; }
  .detail-pane { min-height:0; overflow:auto; padding:28px; }
  .toolbar { display:flex; gap:10px; padding:16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(14,14,14,0.96); z-index:2; }
  select,input,textarea { width:100%; background:#101010; color:var(--text); border:1px solid var(--line-strong); padding:10px 12px; border-radius:0; }
  textarea { min-height:160px; resize:vertical; line-height:1.5; }
  .button { border:1px solid var(--line-strong); background:transparent; color:var(--text); min-height:38px; padding:0 14px; font-family:var(--sans); font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; }
  .button:hover { border-color:var(--accent); color:var(--accent); }
  .submission { width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--text); padding:16px; display:grid; gap:8px; }
  .submission:hover,.submission.active { background:rgba(252,184,103,0.045); }
  .submission-top { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  .name { font-family:var(--sans); font-size:13px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; }
  .date,.meta,.empty { color:var(--dim); font-family:var(--sans); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; }
  .pill { color:var(--accent); border:1px solid rgba(252,184,103,0.34); padding:3px 7px; font-family:var(--sans); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; white-space:nowrap; }
  .detail-head { display:grid; gap:12px; padding-bottom:22px; border-bottom:1px solid var(--line); margin-bottom:22px; }
  h2 { margin:0; font-family:var(--sans); font-size:34px; line-height:1; color:var(--accent); }
  .contact { color:var(--muted); line-height:1.7; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-bottom:22px; }
  .field { display:grid; gap:6px; }
  label { color:var(--dim); font-family:var(--sans); font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; }
  .value { min-height:42px; padding:12px; border:1px solid var(--line); color:var(--muted); white-space:pre-wrap; overflow-wrap:anywhere; }
  .value.full { min-height:96px; }
  .actions { display:grid; grid-template-columns:180px minmax(0,1fr) auto; gap:12px; align-items:start; margin-top:22px; }
  .booking-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .availability-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-bottom:22px; }
  .availability-list { display:grid; gap:10px; }
  .availability-item { border:1px solid var(--line); padding:12px; display:grid; gap:8px; }
  .schedule-section { border-top:1px solid var(--line); padding-top:18px; margin-top:18px; }
  .schedule-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin:14px 0 22px; }
  .day-row { display:grid; grid-template-columns:110px repeat(3,minmax(0,1fr)); gap:10px; align-items:end; border-bottom:1px solid var(--line); padding:12px 0; }
  .day-name { color:var(--accent); font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; padding-bottom:12px; }
  .token-modal { position:fixed; inset:0; display:grid; place-items:center; padding:24px; background:rgba(14,14,14,0.92); z-index:10; }
  .token-card { width:min(520px,100%); border:1px solid var(--line-strong); padding:24px; background:var(--panel); display:grid; gap:14px; }
  .token-card h2 { font-size:22px; }
  .hidden { display:none; }
  @media (max-width:900px) {
    .layout { grid-template-columns:1fr; }
    .list-pane { border-right:0; border-bottom:1px solid var(--line); max-height:42vh; }
    .grid,.actions { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Studio Submissions</h1>
    <div class="header-actions">
      <span class="status" id="status">Locked</span>
      <button class="button" id="availabilityBtn" type="button">Availability</button>
      <button class="button" id="refreshBtn" type="button">Refresh</button>
      <button class="button" id="lockBtn" type="button">Lock</button>
    </div>
  </header>
  <main class="layout">
    <section class="list-pane">
      <div class="toolbar">
        <select id="statusFilter" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="new">New</option>
          <option value="reviewing">Reviewing</option>
          <option value="approved">Approved</option>
          <option value="declined">Declined</option>
          <option value="booked">Booked</option>
          <option value="archived">Archived</option>
        </select>
      </div>
      <div id="submissionList" class="empty" style="padding:16px;">Unlock to load submissions.</div>
    </section>
    <section class="detail-pane" id="detailPane">
      <p class="empty">Select a submission to review details.</p>
    </section>
  </main>
</div>

<div class="token-modal" id="tokenModal">
  <form class="token-card" id="tokenForm">
    <h2>Admin Access</h2>
    <p class="contact">Enter the submissions admin token. It is saved only in this browser's local storage.</p>
    <input id="tokenInput" type="password" autocomplete="current-password" placeholder="Admin token" required>
    <button class="button" type="submit">Unlock</button>
  </form>
</div>

<script>
(function(){
  const tokenKey = "swc_submissions_admin_token";
  const tokenModal = document.getElementById("tokenModal");
  const tokenForm = document.getElementById("tokenForm");
  const tokenInput = document.getElementById("tokenInput");
  const statusEl = document.getElementById("status");
  const listEl = document.getElementById("submissionList");
  const detailEl = document.getElementById("detailPane");
  const refreshBtn = document.getElementById("refreshBtn");
  const lockBtn = document.getElementById("lockBtn");
  const availabilityBtn = document.getElementById("availabilityBtn");
  const statusFilter = document.getElementById("statusFilter");
  let token = localStorage.getItem(tokenKey) || "";
  let submissions = [];
  let activeId = "";

  function api(path, options = {}) {
    return fetch(path, {
      ...options,
      headers: {
        "authorization": `Bearer ${token}`,
        ...(options.headers || {}),
      },
    }).then(async (response) => {
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || "Request failed.");
      return payload;
    });
  }

  function formatDate(value) {
    if (!value) return "";
    return new Date(value).toLocaleString([], { dateStyle:"medium", timeStyle:"short" });
  }

  function titleize(value) {
    return String(value || "").replace(/_/g, " ");
  }

  function setStatus(message) {
    statusEl.textContent = message;
  }

  function renderList() {
    if (!submissions.length) {
      listEl.innerHTML = '<p class="empty" style="padding:16px;">No submissions found.</p>';
      return;
    }

    listEl.innerHTML = submissions.map((submission) => `
      <button class="submission ${submission.id === activeId ? "active" : ""}" type="button" data-id="${submission.id}">
        <span class="submission-top">
          <span class="name">${escapeHtml(submission.contactName || "Unnamed")}</span>
          <span class="pill">${escapeHtml(submission.status)}</span>
        </span>
        <span class="meta">${escapeHtml(titleize(submission.type))} / ${escapeHtml(submission.contactEmail || "")}</span>
        <span class="date">${escapeHtml(formatDate(submission.createdAt))}</span>
      </button>
    `).join("");
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;",
    }[char]));
  }

  function payloadValue(submission, key) {
    const value = submission.payload?.[key];
    if (Array.isArray(value)) return value.join(", ");
    return value || "";
  }

  function renderDetail(submission) {
    const files = submission.files || [];
    detailEl.innerHTML = `
      <div class="detail-head">
        <span class="pill">${escapeHtml(titleize(submission.type))} / ${escapeHtml(submission.status)}</span>
        <h2>${escapeHtml(submission.contactName || "Unnamed")}</h2>
        <p class="contact">
          ${escapeHtml(submission.contactEmail || "")}<br>
          ${escapeHtml(submission.contactPhone || "")}<br>
          ${escapeHtml(formatDate(submission.createdAt))}
        </p>
      </div>
      <div class="grid">
        ${detailField("Placement", payloadValue(submission, "placement"))}
        ${detailField("Size", payloadValue(submission, "size"))}
        ${detailField("Budget", payloadValue(submission, "budget_range"))}
        ${detailField("Timeline", payloadValue(submission, "timeline"))}
        ${detailField("Instagram", payloadValue(submission, "instagram"))}
        ${detailField("Source", submission.sourcePath || "")}
      </div>
      <div class="field">
        <label>Project or Flash Title</label>
        <div class="value">${escapeHtml(payloadValue(submission, "project_title"))}</div>
      </div>
      <div class="field" style="margin-top:16px;">
        <label>Reference Links</label>
        <div class="value full">${escapeHtml(payloadValue(submission, "reference_links"))}</div>
      </div>
      <div class="field" style="margin-top:16px;">
        <label>Project Notes</label>
        <div class="value full">${escapeHtml(payloadValue(submission, "message"))}</div>
      </div>
      <div class="field" style="margin-top:16px;">
        <label>Files</label>
        <div class="value">${escapeHtml(files.length ? files.map((file) => `${file.fileName} (${file.stored ? "stored" : "received only"})`).join("\\n") : "None")}</div>
      </div>
      <div class="actions">
        <div class="field">
          <label for="detailStatus">Status</label>
          <select id="detailStatus">
            ${["new","reviewing","approved","declined","booked","archived"].map((status) => `<option value="${status}" ${status === submission.status ? "selected" : ""}>${status}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label for="bookingUrl">Booking URL</label>
          <input id="bookingUrl" value="${escapeHtml(submission.bookingUrl || "")}">
          <div class="booking-actions">
            <button class="button" id="generateBookingBtn" type="button">${submission.bookingUrl ? "Regenerate Link" : "Generate Link"}</button>
            <button class="button" id="copyBookingBtn" type="button">Copy</button>
            <button class="button" id="revokeBookingBtn" type="button">Revoke</button>
          </div>
        </div>
        <button class="button" id="saveBtn" type="button">Save</button>
      </div>
      <div class="field" style="margin-top:16px;">
        <label for="internalNotes">Internal Notes</label>
        <textarea id="internalNotes">${escapeHtml(submission.internalNotes || "")}</textarea>
      </div>
    `;
  }

  function localDateTimeToIso(value) {
    if (!value) return "";
    const date = new Date(value);
    return date.toString() === "Invalid Date" ? "" : date.toISOString();
  }

  function formatDateTimeLocal(value) {
    if (!value) return "";
    const date = new Date(value);
    return date.toLocaleString([], { dateStyle:"medium", timeStyle:"short" });
  }

  async function renderAvailabilityManager() {
    detailEl.innerHTML = `
      <div class="detail-head">
        <span class="pill">Booking / Availability</span>
        <h2>Availability Windows</h2>
        <p class="contact">Set recurring weekly hours once. Use exceptions only for extra days, closed days, or unusual blocks.</p>
      </div>
      <form id="scheduleForm">
        <div class="schedule-section">
          <span class="pill">Booking Rules</span>
          <div class="schedule-grid">
            <div class="field">
              <label for="settingTimezone">Timezone</label>
              <input id="settingTimezone" value="America/New_York">
            </div>
            <div class="field">
              <label for="settingHorizon">Booking Horizon Days</label>
              <input id="settingHorizon" type="number" min="1" max="180" value="60">
            </div>
            <div class="field">
              <label for="settingNotice">Minimum Notice Hours</label>
              <input id="settingNotice" type="number" min="0" step="1" value="48">
            </div>
            <div class="field">
              <label for="settingInterval">Slot Interval Minutes</label>
              <input id="settingInterval" type="number" min="15" step="15" value="30">
            </div>
            <div class="field">
              <label for="settingMaxDay">Max Bookings Per Day</label>
              <input id="settingMaxDay" type="number" min="1" step="1" value="1">
            </div>
            <div class="field">
              <label for="settingCapacity">Default Capacity</label>
              <input id="settingCapacity" type="number" min="1" step="1" value="1">
            </div>
            <div class="field">
              <label for="settingBufferBefore">Default Buffer Before</label>
              <input id="settingBufferBefore" type="number" min="0" step="5" value="30">
            </div>
            <div class="field">
              <label for="settingBufferAfter">Default Buffer After</label>
              <input id="settingBufferAfter" type="number" min="0" step="5" value="30">
            </div>
          </div>
        </div>
        <div class="schedule-section">
          <span class="pill">Weekly Schedule</span>
          <div id="weeklyRules"></div>
        </div>
        <button class="button" type="submit">Save Schedule</button>
      </form>
      <div class="schedule-section">
        <span class="pill">Exceptions</span>
        <form id="availabilityForm" class="availability-form" style="margin-top:14px;">
        <div class="field">
          <label for="availabilityStart">Exception Start</label>
          <input id="availabilityStart" type="datetime-local" required>
        </div>
        <div class="field">
          <label for="availabilityEnd">Exception End</label>
          <input id="availabilityEnd" type="datetime-local" required>
        </div>
        <div class="field">
          <label for="availabilityType">Session Type</label>
          <select id="availabilityType">
            <option value="">Any tattoo session</option>
            <option value="tattoo_quarter">Quarter Session</option>
            <option value="tattoo_half">Half Session</option>
            <option value="tattoo_full">Full Session</option>
          </select>
        </div>
        <div class="field">
          <label for="availabilityCapacity">Capacity</label>
          <input id="availabilityCapacity" type="number" min="1" step="1" value="1">
        </div>
        <div class="field">
          <label for="bufferBefore">Buffer Before</label>
          <input id="bufferBefore" type="number" min="0" step="5" value="0">
        </div>
        <div class="field">
          <label for="bufferAfter">Buffer After</label>
          <input id="bufferAfter" type="number" min="0" step="5" value="0">
        </div>
        <div class="field">
          <label for="availabilityNote">Note</label>
          <input id="availabilityNote" placeholder="Optional studio note">
        </div>
        <div class="field">
          <label for="availabilityBlackout">Mode</label>
          <select id="availabilityBlackout">
            <option value="1">Closed / Blackout</option>
            <option value="0">Extra Bookable Block</option>
          </select>
        </div>
        <button class="button" type="submit">Add Exception</button>
      </form>
      </div>
      <div id="availabilityList" class="availability-list"><p class="empty">Loading availability.</p></div>
    `;
    await loadSchedule();
    await loadAvailability();
  }

  async function loadSchedule() {
    const payload = await api("/api/admin/booking/schedule");
    const settings = payload.settings || {};
    const rules = payload.rules || [];
    document.getElementById("settingTimezone").value = settings.timezone || "America/New_York";
    document.getElementById("settingHorizon").value = settings.bookingHorizonDays || 60;
    document.getElementById("settingNotice").value = settings.minimumNoticeHours || 48;
    document.getElementById("settingInterval").value = settings.slotIntervalMinutes || 30;
    document.getElementById("settingMaxDay").value = settings.maxBookingsPerDay || 1;
    document.getElementById("settingCapacity").value = settings.defaultCapacity || 1;
    document.getElementById("settingBufferBefore").value = settings.defaultBufferBeforeMinutes || 30;
    document.getElementById("settingBufferAfter").value = settings.defaultBufferAfterMinutes || 30;
    const names = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    document.getElementById("weeklyRules").innerHTML = rules.map((rule) => `
      <div class="day-row" data-rule-id="${escapeHtml(rule.id)}">
        <div class="day-name">${escapeHtml(names[rule.dayOfWeek] || "Day")}</div>
        <div class="field">
          <label>Open</label>
          <select data-rule-field="active">
            <option value="0" ${rule.active ? "" : "selected"}>Closed</option>
            <option value="1" ${rule.active ? "selected" : ""}>Open</option>
          </select>
        </div>
        <div class="field">
          <label>Start</label>
          <input data-rule-field="startTime" type="time" value="${escapeHtml(rule.startTime || "12:00")}">
        </div>
        <div class="field">
          <label>End</label>
          <input data-rule-field="endTime" type="time" value="${escapeHtml(rule.endTime || "18:00")}">
        </div>
        <div class="field">
          <label>Capacity</label>
          <input data-rule-field="capacity" type="number" min="1" step="1" value="${escapeHtml(rule.capacity || 1)}">
        </div>
        <div class="field">
          <label>Buffer Before</label>
          <input data-rule-field="bufferBeforeMinutes" type="number" min="0" step="5" value="${escapeHtml(rule.bufferBeforeMinutes || 0)}">
        </div>
        <div class="field">
          <label>Buffer After</label>
          <input data-rule-field="bufferAfterMinutes" type="number" min="0" step="5" value="${escapeHtml(rule.bufferAfterMinutes || 0)}">
        </div>
        <div class="field">
          <label>Note</label>
          <input data-rule-field="note" value="${escapeHtml(rule.note || "")}">
        </div>
      </div>
    `).join("");
  }

  async function loadAvailability() {
    const list = document.getElementById("availabilityList");
    if (!list) return;
    const payload = await api("/api/admin/booking/availability");
    const windows = payload.availabilityWindows || [];
    list.innerHTML = windows.length ? windows.map((windowItem) => `
      <div class="availability-item">
        <span class="pill">${windowItem.isBlackout ? "exception blackout" : "extra bookable block"} / ${windowItem.active ? "active" : "inactive"}</span>
        <div class="contact">${escapeHtml(formatDateTimeLocal(windowItem.startAt))} - ${escapeHtml(formatDateTimeLocal(windowItem.endAt))}</div>
        <div class="meta">${escapeHtml(windowItem.bookingTypeId || "any tattoo session")} / capacity ${escapeHtml(windowItem.capacity)} / buffer ${escapeHtml(windowItem.bufferBeforeMinutes)} before, ${escapeHtml(windowItem.bufferAfterMinutes)} after</div>
        <div class="meta">${escapeHtml(windowItem.note || "")}</div>
        <button class="button" type="button" data-toggle-window="${escapeHtml(windowItem.id)}" data-active="${windowItem.active ? "0" : "1"}">${windowItem.active ? "Disable" : "Enable"}</button>
      </div>
    `).join("") : '<p class="empty">No exceptions yet. Weekly schedule rules will generate booking times automatically.</p>';
  }

  function detailField(label, value) {
    return `<div class="field"><label>${escapeHtml(label)}</label><div class="value">${escapeHtml(value)}</div></div>`;
  }

  async function loadSubmissions() {
    if (!token) {
      tokenModal.classList.remove("hidden");
      setStatus("Locked");
      return;
    }

    setStatus("Loading");
    const query = statusFilter.value ? `?status=${encodeURIComponent(statusFilter.value)}` : "";
    const payload = await api(`/api/admin/submissions${query}`);
    submissions = payload.submissions || [];
    setStatus(`${submissions.length} loaded`);
    renderList();
    if (activeId) {
      const active = submissions.find((submission) => submission.id === activeId);
      if (active) renderDetail(active);
    }
  }

  tokenForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    token = tokenInput.value.trim();
    localStorage.setItem(tokenKey, token);
    tokenModal.classList.add("hidden");
    try {
      await loadSubmissions();
    } catch (error) {
      setStatus(error.message);
      tokenModal.classList.remove("hidden");
    }
  });

  listEl.addEventListener("click", (event) => {
    const button = event.target.closest("[data-id]");
    if (!button) return;
    activeId = button.dataset.id;
    const submission = submissions.find((item) => item.id === activeId);
    if (submission) {
      renderList();
      renderDetail(submission);
    }
  });

  detailEl.addEventListener("click", async (event) => {
    if (event.target.id === "generateBookingBtn" && activeId) {
      const submission = submissions.find((item) => item.id === activeId);
      if (submission?.status !== "approved") {
        setStatus("Approve first");
        return;
      }
      setStatus("Generating link");
      const payload = await api("/api/admin/booking/tokens", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ submissionId: activeId, revokeExisting: true }),
      });
      document.getElementById("bookingUrl").value = payload.token.path;
      await navigator.clipboard?.writeText(payload.token.bookingUrl).catch(() => {});
      await loadSubmissions();
      setStatus("Booking link copied");
      return;
    }

    if (event.target.id === "copyBookingBtn") {
      const value = document.getElementById("bookingUrl")?.value || "";
      if (value) await navigator.clipboard?.writeText(new URL(value, window.location.origin).toString()).catch(() => {});
      setStatus(value ? "Copied" : "No booking URL");
      return;
    }

    if (event.target.id === "revokeBookingBtn" && activeId) {
      setStatus("Revoking links");
      await api("/api/admin/booking/tokens/revoke-submission", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ submissionId: activeId }),
      });
      document.getElementById("bookingUrl").value = "";
      await api(`/api/admin/submissions/${encodeURIComponent(activeId)}`, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          status: document.getElementById("detailStatus").value,
          bookingUrl: "",
          internalNotes: document.getElementById("internalNotes").value,
        }),
      });
      await loadSubmissions();
      setStatus("Links revoked");
      return;
    }

    const toggle = event.target.closest("[data-toggle-window]");
    if (toggle) {
      setStatus("Updating window");
      await api(`/api/admin/booking/availability/${encodeURIComponent(toggle.dataset.toggleWindow)}`, {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ active: toggle.dataset.active === "1" }),
      });
      await loadAvailability();
      setStatus("Availability updated");
      return;
    }

    if (event.target.id !== "saveBtn" || !activeId) return;
    setStatus("Saving");
    const payload = await api(`/api/admin/submissions/${encodeURIComponent(activeId)}`, {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        status: document.getElementById("detailStatus").value,
        bookingUrl: document.getElementById("bookingUrl").value,
        internalNotes: document.getElementById("internalNotes").value,
      }),
    });
    const index = submissions.findIndex((submission) => submission.id === activeId);
    if (index >= 0) submissions[index] = payload.submission;
    renderList();
    renderDetail(payload.submission);
    setStatus("Saved");
  });

  detailEl.addEventListener("submit", async (event) => {
    if (event.target.id === "scheduleForm") {
      event.preventDefault();
      setStatus("Saving schedule");
      const rules = [...document.querySelectorAll("[data-rule-id]")].map((row) => {
        const fields = Object.fromEntries([...row.querySelectorAll("[data-rule-field]")].map((field) => [field.dataset.ruleField, field.value]));
        return {
          id: row.dataset.ruleId,
          active: fields.active === "1",
          startTime: fields.startTime,
          endTime: fields.endTime,
          capacity: fields.capacity,
          bufferBeforeMinutes: fields.bufferBeforeMinutes,
          bufferAfterMinutes: fields.bufferAfterMinutes,
          note: fields.note,
        };
      });
      await api("/api/admin/booking/schedule", {
        method: "PATCH",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          settings: {
            timezone: document.getElementById("settingTimezone").value,
            bookingHorizonDays: document.getElementById("settingHorizon").value,
            minimumNoticeHours: document.getElementById("settingNotice").value,
            slotIntervalMinutes: document.getElementById("settingInterval").value,
            maxBookingsPerDay: document.getElementById("settingMaxDay").value,
            defaultCapacity: document.getElementById("settingCapacity").value,
            defaultBufferBeforeMinutes: document.getElementById("settingBufferBefore").value,
            defaultBufferAfterMinutes: document.getElementById("settingBufferAfter").value,
          },
          rules,
        }),
      });
      await loadSchedule();
      setStatus("Schedule saved");
      return;
    }

    if (event.target.id !== "availabilityForm") return;
    event.preventDefault();
    setStatus("Adding exception");
    await api("/api/admin/booking/availability", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        venture: "tattooing",
        startAt: localDateTimeToIso(document.getElementById("availabilityStart").value),
        endAt: localDateTimeToIso(document.getElementById("availabilityEnd").value),
        bookingTypeId: document.getElementById("availabilityType").value,
        capacity: document.getElementById("availabilityCapacity").value,
        bufferBeforeMinutes: document.getElementById("bufferBefore").value,
        bufferAfterMinutes: document.getElementById("bufferAfter").value,
        note: document.getElementById("availabilityNote").value,
        isBlackout: document.getElementById("availabilityBlackout").value === "1",
      }),
    });
    event.target.reset();
    document.getElementById("availabilityCapacity").value = "1";
    document.getElementById("bufferBefore").value = "0";
    document.getElementById("bufferAfter").value = "0";
    await loadAvailability();
    setStatus("Exception added");
  });

  refreshBtn.addEventListener("click", () => loadSubmissions().catch((error) => setStatus(error.message)));
  availabilityBtn.addEventListener("click", () => renderAvailabilityManager().catch((error) => setStatus(error.message)));
  statusFilter.addEventListener("change", () => loadSubmissions().catch((error) => setStatus(error.message)));
  lockBtn.addEventListener("click", () => {
    token = "";
    localStorage.removeItem(tokenKey);
    tokenInput.value = "";
    tokenModal.classList.remove("hidden");
    setStatus("Locked");
  });

  if (token) {
    tokenModal.classList.add("hidden");
    loadSubmissions().catch((error) => {
      setStatus(error.message);
      tokenModal.classList.remove("hidden");
    });
  }
})();
</script>
</body>
</html>
