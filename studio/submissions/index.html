        toolbarEl.innerHTML = "";
        detailEl.innerHTML = '<p class="empty">People manager could not be loaded.</p>';
        setStatus("People unavailable");
        return;
      }
      listPane.classList.remove("hidden");
      window.PeopleManager.render(activeTab, subView).catch((error) => setStatus(error.message));
      return;
    }

    if (activeTab === "tattoo" && subView === "direct-invite") {
      renderDirectInviteManager();
      return;
    }

    if ((activeTab === "tattoo" || activeTab === "studio") && subView === "availability") {
      layoutEl.classList.add("single");
      listPane.classList.add("hidden");
      selectedCalendarDay = "";
      renderAvailabilityManager().catch((error) => setStatus(error.message));
      return;
    }

    layoutEl.classList.remove("single");
    listPane.classList.remove("hidden");

    if (activeTab === "studio" && subView === "bookings") {
      buildToolbar();
      renderStudioBookingList();
      const active = activeAppointmentId ? appointments.find((a) => a.id === activeAppointmentId) : null;
      renderStudioAppointmentDetail(active && isStudioAppointment(active) ? active : null);
      return;
    }

    const managedView = window.ConstructManager?.isManagedView(activeTab, subView);
    if (managedView) {
      layoutEl.classList.add("single");
      listPane.classList.add("hidden");
      toolbarEl.innerHTML = "";
      window.ConstructManager.render(activeTab, subView).catch((error) => setStatus(error.message));
      return;
    }

    if (activeTab === "tattoo" && subView === "portfolio") {
      renderPortfolioManager().catch((error) => setStatus(error.message));
      return;
    }

    if (activeTab === "tattoo" && subView === "portfolio-settings") {
      renderPortfolioSettings().catch((error) => setStatus(error.message));
      return;
    }

    if (activeTab === "tattoo" && subView === "tattoo-settings") {
      renderTattooSettings().catch((error) => setStatus(error.message));
      return;
    }

    if (activeTab === "events") {
      renderEventsTab();
      return;
    }

    buildToolbar();
    renderList();
    const active = activeId ? submissions.find((s) => s.id === activeId) : null;
    detailEl.innerHTML = emptyDetail();
    if (active) renderDetail(active);
  }

  function setActiveTab(tab) {
    if (tab === activeTab) return;
    activeTab = tab;
    activeId = "";
    activeAppointmentId = "";
    typeValue = "";
    subView = tab === "people" ? "directory" : tab === "legend" ? "symbols" : tab === "archive" ? "dossiers" : tab === "site" ? "pathways" : tab === "shared" ? "media" : tab === "merch" ? "products" : "requests";
    selectedCalendarDay = "";
    selectedEventSlug = "";
    renderActiveTab();
  }

  function setSubView(view) {
    if (subView === view) return;
    subView = view;
    activeId = "";
    activeAppointmentId = "";
    statusValue = "";
    typeValue = "";
    renderActiveTab();
  }

  /* ---- Events tab (events list -> RSVPs) ---- */

  function eventBySlug(slug) {
    return events.find((e) => e.slug === slug) || null;
  }

  function publicEventPath(slug) {
    return slug ? `/events/${encodeURIComponent(slug)}/` : "/events/";
  }

  function rsvpsForEvent(ev) {
    if (!ev) return [];
    return submissions.filter((s) => s.type === "event_rsvp" && (
      (s.payload?.event_slug && s.payload.event_slug === ev.slug) ||
      (s.payload?.event_title && s.payload.event_title === ev.title)
    ));
  }

  function isCultAndShift(ev) {
    return ev && ev.slug === "cultandshift";
  }

  function generatedOpenMicSlot(startsAt, index) {
    if (!startsAt) return "";
    const date = new Date(startsAt);
    if (date.toString() === "Invalid Date") return "";
    // Default open-mic lane begins after audience arrival and the first host beat.
    date.setMinutes(date.getMinutes() + 45 + (index * 7));
    return formatDateTimeInput(date.toISOString());
  }

  function renderOpenMicSignupCard(signup, ev, index) {
    const assignedInput = formatDateTimeInput(signup.assignedSlot);
    const generated = generatedOpenMicSlot(ev.startsAt, index);
    return `
      <form class="availability-item" data-open-mic-form="${escapeHtml(signup.id)}" data-event-slug="${escapeHtml(ev.slug)}" data-generated-slot="${escapeHtml(generated)}">
        <span class="pill">${escapeHtml((signup.status || "requested").toUpperCase())}</span>
        <div class="contact">
          <strong>${escapeHtml(signup.performerName || "Unnamed performer")}</strong><br>
          ${escapeHtml(signup.performerEmail || "")}${signup.performerPhone ? `<br>${escapeHtml(signup.performerPhone)}` : ""}
        </div>
        <div class="meta">
          ${escapeHtml(signup.actType || "open mic")} ${signup.pieceTitle ? ` / ${escapeHtml(signup.pieceTitle)}` : ""}<br>
          Requested: ${escapeHtml(signup.requestedSlot || "no preference")}<br>
          ${signup.slotEmailSentAt ? `Slot email sent: ${escapeHtml(formatDate(signup.slotEmailSentAt))}` : "Slot email not sent"}
        </div>
        ${signup.notes ? `<div class="value">${escapeHtml(signup.notes)}</div>` : ""}
        <div class="schedule-grid">
          <div class="field">
            <label>Status</label>
            <select data-open-mic-field="status">
              ${["requested","scheduled","cancelled"].map((status) => `<option value="${status}" ${status === signup.status ? "selected" : ""}>${status.toUpperCase()}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>Assigned Slot</label>
            <input data-open-mic-field="assignedSlot" type="datetime-local" value="${escapeHtml(assignedInput)}">
          </div>
          <div class="field">
            <label>Minutes</label>
            <input data-open-mic-field="slotDurationMinutes" type="number" min="1" step="1" value="${escapeHtml(String(signup.slotDurationMinutes || 5))}">
          </div>
          <div class="field wide-field">
            <label>Performer Notes</label>
            <textarea data-open-mic-field="notes" rows="3">${escapeHtml(signup.notes || "")}</textarea>
          </div>
        </div>
        <div class="booking-actions">
          <button class="button" type="button" data-generate-open-mic-slot>Generate Slot</button>
          <button class="button" type="submit">Save Slot</button>
          <button class="button" type="submit" data-send-open-mic-email="1">Save + Email Performer</button>
        </div>
      </form>
    `;
  }

  async function renderCultAndShiftOpenMic(slug) {
    const container = document.getElementById("openMicPanel");
    if (!container) return;
    container.innerHTML = '<p class="empty" style="font-family:var(--sans);font-size:11px;">Loading open mic requests.</p>';
    try {
      const payload = await api(`/api/admin/events/${encodeURIComponent(slug)}/open-mic`);
      const ev = eventBySlug(slug) || payload.event || { slug };
      const signups = payload.signups || [];
      container.innerHTML = signups.length
        ? signups.map((signup, index) => renderOpenMicSignupCard(signup, ev, index)).join("")
        : '<p class="empty" style="font-family:var(--sans);font-size:11px;">No open mic requests yet.</p>';
      enhanceControls(container);
    } catch (error) {
      container.innerHTML = `<p class="empty" style="font-family:var(--sans);font-size:11px;color:var(--signal);">${escapeHtml(error.message || "Could not load open mic requests.")}</p>`;
    }
  }

  function renderEventsTab() {
    toolbarEl.innerHTML = "";
    renderEventsList();
    if (selectedEventSlug) {
      const active = activeId ? submissions.find((s) => s.id === activeId) : null;
      if (active) renderDetail(active);
      else renderEventDetail(selectedEventSlug);
      return;
    }
    renderEventsManager().catch((error) => setStatus(error.message));
  }

  function renderEventsList() {
    if (!events.length) {
      listEl.innerHTML = '<p class="empty" style="padding:16px;">No events yet. Use “Manage / New Events”.</p>';
      return;
    }
    listEl.innerHTML = events.map((ev) => {
      const count = rsvpsForEvent(ev).length;
      return `
        <button class="submission ${ev.slug === selectedEventSlug ? "active" : ""}" type="button" data-event-slug="${escapeHtml(ev.slug)}">
          <span class="submission-top">
            <span class="name">${escapeHtml(ev.title)}</span>
            <span class="pill">${escapeHtml((ev.status || "").toUpperCase())}</span>
          </span>
          <span class="meta">${escapeHtml(formatDate(ev.startsAt))}</span>
          <span style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <span class="date">${count} RSVP${count !== 1 ? "s" : ""}</span>
            <span class="meta">${ev.paidSeats || 0}/${ev.capacity || 0} paid${ev.pendingSeats ? ` · ${ev.pendingSeats} held` : ""}</span>
          </span>
        </button>`;
    }).join("");
  }

  function renderEventDetail(slug) {
    const ev = eventBySlug(slug);
    if (!ev) { detailEl.innerHTML = emptyDetail(); return; }
    const rsvps = rsvpsForEvent(ev);
    const cards = rsvps.length ? rsvps.map((s) => {
      const seats = s.payload?.seats || "";
      const paid = s.status === "booked";
      return `
        <button class="hub-entry" type="button" data-id="${escapeHtml(s.id)}">
          <span class="he-top">
            <span class="name">${escapeHtml(s.contactName || "Unnamed")}</span>
            <span class="pill">${escapeHtml(s.status)}</span>
          </span>
          <span class="meta">${escapeHtml(s.contactEmail || "")}${seats ? ` · ${escapeHtml(String(seats))} seat${Number(seats) !== 1 ? "s" : ""}` : ""} · ${paid ? "Paid" : "Pending"}</span>
        </button>`;
    }).join("") : '<p class="empty" style="font-family:var(--sans);font-size:11px;">No RSVPs for this event yet.</p>';
    detailEl.innerHTML = `
      <div class="detail-head">
        <span class="pill">Event · ${escapeHtml((ev.status || "").toUpperCase())}</span>
        <h2>${escapeHtml(ev.title)}</h2>
        <p class="contact">
          ${escapeHtml(formatDate(ev.startsAt))}${ev.location ? `<br>${escapeHtml(ev.location)}` : ""}<br>
          ${ev.seatsRemaining || 0} seats available${ev.pendingSeats ? ` · ${ev.pendingSeats} held in checkout` : ""}${ev.waitlistCount ? ` · ${ev.waitlistCount} waitlist` : ""}<br>
          ${ev.paidSeats || 0} / ${ev.capacity || 0} seats sold · ${escapeHtml(money(ev.priceCents || 0, ev.currency || "USD"))} per seat
        </p>
        <div class="booking-actions">
          <a class="button" href="${escapeHtml(publicEventPath(ev.slug))}" target="_blank" rel="noopener noreferrer">Open Public Page</a>
          <button class="button" type="button" data-copy-public-link="${escapeHtml(publicEventPath(ev.slug))}">Copy Public Link</button>
        </div>
      </div>
      <div class="review-card">
        <div class="review-card-header">RSVPs (${rsvps.length})</div>
        <div style="display:grid;gap:8px;">${cards}</div>
      </div>
      <div class="review-card" id="eventWaitlistCard">
        <div class="review-card-header">Waitlist</div>
        <p class="empty" style="font-family:var(--sans);font-size:11px;">Loading waitlist.</p>
      </div>
      ${isCultAndShift(ev) ? `
        <div class="review-card">
          <div class="review-card-header">Open Mic Signups</div>
          <p class="contact" style="margin-top:0;">Separate performer lane for Cult & Shift. Generate an assigned time, save it, then email the performer once the run is set.</p>
          <div id="openMicPanel" class="availability-list"></div>
        </div>` : ""}`;
    renderEventWaitlist(ev.slug);
    if (isCultAndShift(ev)) renderCultAndShiftOpenMic(ev.slug);
  }

  async function renderEventWaitlist(slug) {
    const card = document.getElementById("eventWaitlistCard");
    if (!card) return;
    try {
      const payload = await api(`/api/admin/events/${encodeURIComponent(slug)}/waitlist`);
      const waitlist = payload.waitlist || [];
      const rows = waitlist.length ? waitlist.map((entry) => `
        <div class="hub-entry" style="cursor:default;">
          <span class="he-top">
            <span class="name">${escapeHtml(entry.contactName || "Unnamed")}</span>
            <span class="pill">${escapeHtml(entry.status || "new")}</span>
          </span>
          <span class="meta">${escapeHtml(entry.contactEmail || "")}${entry.contactPhone ? ` · ${escapeHtml(entry.contactPhone)}` : ""} · ${entry.seatsRequested || 1} seat${Number(entry.seatsRequested) === 1 ? "" : "s"}</span>
          ${entry.note ? `<span class="contact">${escapeHtml(entry.note)}</span>` : ""}
        </div>
      `).join("") : '<p class="empty" style="font-family:var(--sans);font-size:11px;">No waitlist entries yet.</p>';
      card.innerHTML = `<div class="review-card-header">Waitlist (${waitlist.length})</div><div style="display:grid;gap:8px;">${rows}</div>`;
    } catch (error) {
      card.innerHTML = `<div class="review-card-header">Waitlist</div><p class="empty" style="font-family:var(--sans);font-size:11px;color:var(--signal);">${escapeHtml(error.message)}</p>`;
    }
  }

  /* ---- Home hub calendar ---- */

  function scopedAppointments() {
    const config = AVAILABILITY_CONFIGS[activeTab];
    if (!config || !config.bookingTypeIds) return appointments;
    return appointments.filter((a) => config.bookingTypeIds.includes(a.bookingTypeId));
  }

  function liveAppointments() {
    return appointments.filter((a) => !["cancelled", "archived"].includes(a.status));
  }

  function isStudioAppointment(appointment) {
    return (AVAILABILITY_CONFIGS.studio.bookingTypeIds || []).includes(appointment?.bookingTypeId);
  }

  function appointmentRelatedSubmission(appointment) {
    return appointment?.submissionId
      ? submissions.find((submission) => submission.id === appointment.submissionId) || null
      : null;
  }

  function appointmentTypeLabel(appointment) {
    return appointment?.bookingTypeLabel || titleize(appointment?.bookingTypeId || "studio booking");
  }

  function studioBookingAppointments() {
    return appointments
      .filter(isStudioAppointment)
      .sort((a, b) => {
        const aTime = Date.parse(a.startAt || a.createdAt || "") || 0;
        const bTime = Date.parse(b.startAt || b.createdAt || "") || 0;
        return bTime - aTime;
      });
  }

  function filteredStudioBookingAppointments() {
    let visible = studioBookingAppointments();
    if (statusValue) visible = visible.filter((appointment) => appointment.status === statusValue);
    if (typeValue) visible = visible.filter((appointment) => appointment.bookingTypeId === typeValue);
    return visible;
  }

  function renderStudioBookingList() {
    const visible = filteredStudioBookingAppointments();
    if (!visible.length) {
      listEl.innerHTML = '<p class="empty" style="padding:16px;">No studio bookings found.</p>';
      return;
    }
    listEl.innerHTML = visible.map((appointment) => {
      const related = appointmentRelatedSubmission(appointment);
      const sourceLabel = related ? "Linked request" : "Private visit";
      return `
        <button class="submission ${appointment.id === activeAppointmentId ? "active" : ""}" type="button" data-studio-appointment-id="${escapeHtml(appointment.id)}">
          <span class="submission-top">
            <span class="name">${escapeHtml(appointment.clientName || related?.contactName || "Unnamed")}</span>
            <span class="pill">${escapeHtml(titleize(appointment.status || "unknown"))}</span>
          </span>
          <span class="meta">${escapeHtml(appointmentTypeLabel(appointment))} / ${escapeHtml(appointment.clientEmail || related?.contactEmail || "")}</span>
          <span style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <span class="date">${escapeHtml(formatDate(appointment.startAt))}</span>
            <span class="meta">${escapeHtml(sourceLabel)}</span>
          </span>
        </button>`;
    }).join("");
  }

  function renderStudioAppointmentDetail(appointment) {
    if (!appointment) {
      detailEl.innerHTML = '<p class="empty">Select a studio booking to manage details.</p>';
      return;
    }
    const related = appointmentRelatedSubmission(appointment);
    const currency = appointment.currency || "USD";
    const depositCents = Number(appointment.depositCents || 0);
    const tipCents = Number(appointment.tipCents || 0);
    const totalCents = Number(appointment.totalDueCents || depositCents + tipCents);
    const calendarHref = appointmentIsConfirmed(appointment) ? appointmentCalendarUrl(appointment) : "";
    const checkoutHref = appointment.squareCheckoutUrl || "";
    const sourceLabel = related ? "Linked studio booking request" : "Private studio visit / direct calendar booking";
    const contactName = appointment.clientName || related?.contactName || "Unnamed";
    const contactEmail = appointment.clientEmail || related?.contactEmail || "";
    const contactPhone = appointment.clientPhone || related?.contactPhone || "";
    detailEl.innerHTML = `
      <div class="detail-head">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <span class="pill">Studio Booking / ${escapeHtml(titleize(appointment.status || "unknown"))}</span>
          <span class="pill">${escapeHtml(appointmentTypeLabel(appointment))}</span>
        </div>
        <h2>${escapeHtml(contactName)}</h2>
        <p class="contact">
          ${escapeHtml(contactEmail || "No email on file")}${contactPhone ? `<br>${escapeHtml(contactPhone)}` : ""}<br>
          ${escapeHtml(formatDate(appointment.startAt))}${appointment.endAt ? ` - ${escapeHtml(formatDate(appointment.endAt))}` : ""}
        </p>
        <div class="booking-actions">
          ${calendarHref ? `<a class="button" href="${escapeHtml(calendarHref)}" target="_blank" rel="noopener noreferrer">Add to Calendar</a>` : ""}
          ${calendarHref ? `<button class="button" type="button" data-copy-calendar="${escapeHtml(calendarHref)}">Copy Calendar Link</button>` : ""}
          ${checkoutHref ? `<a class="button" href="${escapeHtml(checkoutHref)}" target="_blank" rel="noopener noreferrer">Open Square Checkout</a>` : ""}
          ${appointmentIsPending(appointment) ? `<button class="button danger-button" type="button" data-release-pending="${escapeHtml(appointment.id)}">Release Pending Checkout</button>` : ""}
          ${appointmentIsConfirmed(appointment) ? `<button class="button" type="button" data-resend-template="appointment_confirmed" data-appointment-id="${escapeHtml(appointment.id)}" data-submission-id="${escapeHtml(related?.id || appointment.submissionId || "")}">Resend Confirmation Email</button>` : ""}
          ${related ? `<button class="button" type="button" data-open-submission="${escapeHtml(related.id)}">View Request</button>` : ""}
        </div>
      </div>
      <div class="grid">
        ${detailField("Source", sourceLabel)}
        ${detailField("Booking Type", appointmentTypeLabel(appointment))}
        ${detailField("Status", titleize(appointment.status || ""))}
        ${detailField("When", `${formatDate(appointment.startAt)}${appointment.endAt ? `\nEnds: ${formatDate(appointment.endAt)}` : ""}`)}
        ${detailField("Client", `${contactName}\n${contactEmail}${contactPhone ? `\n${contactPhone}` : ""}`)}
        ${detailField("Payment", `Reservation/deposit: ${money(depositCents, currency)}\nOptional tip: ${money(tipCents, currency)}\nTotal paid today: ${money(totalCents, currency)}\nSquare order: ${appointment.squareOrderId || "pending"}`)}
        ${detailField("Appointment ID", appointment.id || "")}
        ${detailField("Submission ID", related?.id || appointment.submissionId || "No linked submission")}
      </div>
      ${related ? `
        <div class="review-card">
          <div class="review-card-header">Related Request Snapshot</div>
          <div class="contact">
            ${escapeHtml(titleize(related.type || "studio_booking"))} / ${escapeHtml(related.status || "")}<br>
            ${escapeHtml(related.sourcePath || "")}<br>
            ${escapeHtml(related.payload?.details || related.payload?.message || related.internalNotes || "No request notes.")}
          </div>
        </div>` : ""}
    `;
  }

  function refreshStudioBookingViews() {
    if (activeTab !== "studio" || subView !== "bookings") return;
    renderStudioBookingList();
    const active = activeAppointmentId ? appointments.find((appointment) => appointment.id === activeAppointmentId) : null;
    renderStudioAppointmentDetail(active && isStudioAppointment(active) ? active : null);
  }

  function homeAppointmentKind(appointment) {
    return isStudioAppointment(appointment) ? "art" : "tattoo";
  }

  function homeDayVisualItems(entry) {
    if (!entry) return [];
    return [
      ...entry.appts.map((appointment) => ({
        at: appointment.startAt,
        color: HOME_DAY_COLORS[homeAppointmentKind(appointment)],
      })),
      ...entry.events.map((event) => ({
        at: event.startsAt,
        color: HOME_DAY_COLORS.event,
      })),
    ].sort((a, b) => {
      const aTime = Date.parse(a.at || "") || 0;
      const bTime = Date.parse(b.at || "") || 0;
      return aTime - bTime;
    });
  }

  function homeDayFillColors(items) {
    if (items.length <= 2) return items.map((item) => item.color);
    if (items.length === 3) {
      return [items[0].color, items[1].color, items[2].color, items[2].color];
    }
    return items.slice(0, 4).map((item) => item.color);
  }

  function homeDayKinds(entry) {
    if (!entry) return [];
    const kinds = new Set();
    if (entry.appts.some((a) => homeAppointmentKind(a) === "tattoo")) kinds.add("tattoo");
    if (entry.appts.some((a) => homeAppointmentKind(a) === "art")) kinds.add("art");
    if (entry.events.length) kinds.add("event");
    return ["tattoo", "art", "event"].filter((kind) => kinds.has(kind));
  }

  function homeDayClass(entry, itemCount) {
    const kinds = homeDayKinds(entry);
    const split = itemCount > 2 ? "split-grid" : itemCount === 2 ? "split-2" : itemCount === 1 ? "split-1" : "";
    return kinds.length ? `has-entry ${split} ${kinds.map((kind) => `home-${kind}`).join(" ")}` : "";
  }

  function homeDayStyle(fillColors, itemCount) {
    if (!itemCount) return "";
    const fill = itemCount === 1 ? fillColors[0] : "transparent";
    return ` style="--hub-day-bg:${fill};"`;
  }

  function homeDayFillHtml(fillColors, itemCount) {
    if (itemCount <= 1) return "";
    return `<span class="day-fill" aria-hidden="true">${fillColors.map((color) => `<span style="--day-fill:${escapeHtml(color)};"></span>`).join("")}</span>`;
  }

  function homeDayCountLabel(dayLabel, entry) {
    const tattooCount = entry?.appts.filter((a) => homeAppointmentKind(a) === "tattoo").length || 0;
    const artCount = entry?.appts.filter((a) => homeAppointmentKind(a) === "art").length || 0;
    const eventCount = entry?.events.length || 0;
    const parts = [];
    if (tattooCount) parts.push(`${tattooCount} tattoo appointment${tattooCount !== 1 ? "s" : ""}`);
    if (artCount) parts.push(`${artCount} art studio booking${artCount !== 1 ? "s" : ""}`);
    if (eventCount) parts.push(`${eventCount} event${eventCount !== 1 ? "s" : ""}`);
    return `${dayLabel}: ${parts.length ? parts.join(", ") : "0 bookings, 0 events"}`;
  }

  function homeEntriesByDay() {
    const map = new Map();
    const ensure = (key) => { if (!map.has(key)) map.set(key, { appts: [], events: [] }); return map.get(key); };
    for (const a of liveAppointments()) {
      if (!a.startAt) continue;
      ensure(dayKey(a.startAt)).appts.push(a);
    }
    for (const ev of events) {
      if (!ev.startsAt) continue;
      ensure(dayKey(ev.startsAt)).events.push(ev);
    }
    return map;
  }

  function renderHome() {
    const byDay = homeEntriesByDay();
    const monthKeys = [...new Set([
      ...liveAppointments().map((a) => monthKey(a.startAt)).filter(Boolean),
      ...events.map((e) => monthKey(e.startsAt)).filter(Boolean),
    ])];
    const nowMonth = monthKey(new Date().toISOString());
    if (!monthKeys.includes(nowMonth)) monthKeys.push(nowMonth);
    monthKeys.sort();
    if (!monthKeys.includes(homeMonth)) homeMonth = nowMonth;

    detailEl.innerHTML = `
      <div class="availability-manager hub">
        <div class="detail-head">
          <span class="pill">Hub</span>
          <h2>Everything Booked</h2>
          <p class="contact">All tattoo, consult, and studio appointments plus events in one calendar. Click a day, then an entry to open it in its tab.</p>
        </div>
        <div class="hub-head">
          <div class="calendar-tools" style="grid-template-columns:38px minmax(0,220px) 38px;">
            <button class="button icon-button" id="homePrevMonth" type="button" aria-label="Previous month">&lt;</button>
            <select id="homeMonthSelect" aria-label="Month"></select>
            <button class="button icon-button" id="homeNextMonth" type="button" aria-label="Next month">&gt;</button>
          </div>
          <div class="hub-legend">

    select._customSync?.();
    renderHomeCalendar(byDay);
    renderHomeDay(byDay);

  function renderHomeCalendar(byDay) {
    const cal = document.getElementById("homeCalendar");
    if (!cal || !homeMonth) return;
    const [year, month] = homeMonth.split("-").map(Number);
    const firstDay = new Date(year, month - 1, 1);
    const daysInMonth = new Date(year, month, 0).getDate();
    const todayKey = dayKey(new Date());
    const cells = [];
    for (let b = 0; b < firstDay.getDay(); b += 1) cells.push('<button class="day-button blank" type="button" tabindex="-1" aria-hidden="true"></button>');
    for (let d = 1; d <= daysInMonth; d += 1) {
      const key = `${homeMonth}-${String(d).padStart(2, "0")}`;
      const entry = byDay.get(key);
      const visualItems = homeDayVisualItems(entry);
      const fillColors = homeDayFillColors(visualItems);
      const cls = homeDayClass(entry, visualItems.length);
      const sel = key === selectedHomeDay ? " selected" : "";
      const today = key === todayKey ? " today" : "";
      const dayLabel = new Date(year, month - 1, d, 12).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" });
      const label = homeDayCountLabel(dayLabel, entry);
      cells.push(`<button class="day-button ${cls}${today}${sel}" type="button" data-home-day="${escapeHtml(key)}" title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}"${homeDayStyle(fillColors, visualItems.length)}>${homeDayFillHtml(fillColors, visualItems.length)}<span class="day-number">${d}</span></button>`);
    }
    cal.innerHTML = `<div class="calendar-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="calendar-grid">${cells.join("")}</div>`;
  }

  function renderHomeDay(byDay) {
    const panel = document.getElementById("homeDayList");
    const label = document.getElementById("homeDayLabel");
    const countEl = document.getElementById("homeDayCount");
    if (!panel) return;
    byDay = byDay || homeEntriesByDay();
    if (!selectedHomeDay) {
      if (label) label.textContent = "Select a day";
      if (countEl) countEl.textContent = "";
      panel.innerHTML = '<p class="empty" style="font-family:var(--sans);font-size:11px;">Pick a day to see its bookings and events.</p>';
      return;
    }
    const entry = byDay.get(selectedHomeDay) || { appts: [], events: [] };
    if (label) label.textContent = new Date(selectedHomeDay + "T12:00:00").toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    const total = entry.appts.length + entry.events.length;
    if (countEl) countEl.textContent = `${total} item${total !== 1 ? "s" : ""}`;
    if (!total) { panel.innerHTML = '<p class="empty" style="font-family:var(--sans);font-size:11px;">Nothing booked this day.</p>'; return; }
    const apptCards = [...entry.appts].sort((a, b) => new Date(a.startAt) - new Date(b.startAt)).map((a) => {
      const time = a.startAt ? new Date(a.startAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
      const kind = homeAppointmentKind(a);
      const kindLabel = kind === "art" ? "Art Studio" : "Tattoo";
      return `
        <button class="hub-entry kind-appt kind-${escapeHtml(kind)}" type="button" data-home-appointment="${escapeHtml(a.id || "")}" data-appt-submission="${escapeHtml(a.submissionId || "")}">
          <span class="he-top"><span class="he-kind">${escapeHtml(kindLabel)}</span><span class="appt-time">${escapeHtml(time)}</span></span>
          <span class="name">${escapeHtml(a.clientName || "Unnamed")}</span>
          <span class="appt-meta">${escapeHtml(titleize(a.bookingTypeId || "session"))} · ${escapeHtml(a.status || "")}</span>
        </button>`;
    }).join("");
    const evCards = entry.events.map((ev) => `
        <button class="hub-entry kind-event" type="button" data-home-event="${escapeHtml(ev.slug)}">
          <span class="he-top"><span class="he-kind">Event</span><span class="appt-time">${escapeHtml(ev.startsAt ? new Date(ev.startsAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "")}</span></span>
          <span class="name">${escapeHtml(ev.title)}</span>
          <span class="appt-meta">${ev.paidSeats || 0}/${ev.capacity || 0} seats · ${rsvpsForEvent(ev).length} RSVPs</span>
        </button>`).join("");
    panel.innerHTML = apptCards + evCards;
  }

  function renderList() {
    const tabTypes = currentTabTypes();
    let visible = submissions.filter((s) => tabTypes.includes(s.type));
    if (statusValue) visible = visible.filter((s) => s.status === statusValue);
    if (typeValue) visible = visible.filter((s) => s.type === typeValue);

    if (!visible.length) {
      listEl.innerHTML = '<p class="empty" style="padding:16px;">No submissions found.</p>';
      return;
    }

    listEl.innerHTML = visible.map((submission) => `
      <button class="submission ${submission.id === activeId ? "active" : ""}" type="button" data-id="${submission.id}">
        <span class="submission-top">
          <span class="name">${escapeHtml(submission.contactName || "Unnamed")}</span>
          <span class="pill">${escapeHtml(submission.status)}</span>
        </span>
        <span class="meta">${escapeHtml(titleize(submission.type))} / ${escapeHtml(submission.contactEmail || "")}${submission.tattooStage ? ` / ${escapeHtml(titleize(submission.tattooStage))}` : ""}</span>
        <span style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
          <span class="date">${escapeHtml(formatDate(submission.createdAt))}</span>
          ${nextActionBadge(submission)}
        </span>
      </button>

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;",
    }[char]));
  }

  function payloadValue(submission, key) {
    const value = submission.payload?.[key];
    if (Array.isArray(value)) return value.join(", ");
    if (value && typeof value === "object") return JSON.stringify(value);
    return value || "";
  }

  function latestAppointmentFor(submissionId) {
    return appointments
      .filter((appointment) => appointment.submissionId === submissionId)
      .sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime())[0] || null;
  }

  function historicPrerequisiteAppointmentFor(submissionId) {
    return appointments
      .filter((appointment) => appointment.submissionId === submissionId)
      .filter((appointment) => appointment.purpose === "prerequisite_consultation")
      .filter((appointment) => ["confirmed", "completed"].includes(appointment.status))
      .sort((a, b) => new Date(b.startAt || b.createdAt).getTime() - new Date(a.startAt || a.createdAt).getTime())[0] || null;
  }

  function appointmentIsPending(appointment) {
    return ["pending_deposit", "deposit_pending", "replacement_pending", "expiry_attention"].includes(appointment?.status || "");
  }

  function appointmentIsConfirmed(appointment) {
    return appointment?.status === "confirmed";
  }

  function appointmentCalendarUrl(appointment) {
    if (!appointment?.id) return "";
    return absoluteUrl(`/api/booking/calendar?appointment=${encodeURIComponent(appointment.id)}`);
  }

  function renderPaymentSummary(submission) {
    const appointment = latestAppointmentFor(submission.id);
    if (!appointment) return "";
    const currency = appointment.currency || "USD";
    const depositCents = Number(appointment.depositCents || 0);
    const tipCents = Number(appointment.tipCents || 0);
    const totalCents = Number(appointment.totalDueCents || depositCents + tipCents);
    const meeting = appointment.meeting || null;
    const isVirtual = appointment.bookingTypeId === "consult_virtual";
    const isPublicBooking = submission.type === "consultation" || ["consult_in_person", "consult_virtual", "build_in_person"].includes(appointment.bookingTypeId);
    const holdExpiresAt = appointment.holdExpiresAt || appointment.hold_expires_at || "";
    const completedAt = appointment.completedAt || appointment.completed_at || "";
    const replacementFor = appointment.replacementForAppointmentId || appointment.replacement_for_appointment_id || "";
    const replacedBy = appointment.replacedByAppointmentId || appointment.replaced_by_appointment_id || "";
    const canCompleteConsultation = appointment.status === "confirmed"
      && ["prerequisite_consultation", "standalone_consultation"].includes(appointment.purpose || "")
      && !completedAt
      && new Date(appointment.startAt).getTime() <= Date.now();
    const calendarHref = appointmentIsConfirmed(appointment) ? appointmentCalendarUrl(appointment) : "";
    const meetingLines = meeting?.joinUrl
      ? `Zoom: ready
<a class="button" href="${escapeHtml(meeting.joinUrl)}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;margin-top:8px;min-height:32px;padding:0 10px;font-size:10px;">Open Zoom Link</a>
Raw Zoom URL: ${escapeHtml(meeting.joinUrl)}
Zoom password: ${escapeHtml(meeting.password || "none")}`
      : isVirtual
        ? `Zoom: not created
${["archived", "cancelled"].includes(appointment.status) ? "" : `<button class="button" type="button" data-create-meeting="${escapeHtml(appointment.id)}" style="margin-top:8px;min-height:32px;padding:0 10px;font-size:10px;">Create Zoom Meeting</button>`}`
        : "";
    return `
      <div class="field" style="margin-top:16px;">
        <label>Appointment Payment</label>

${isPublicBooking ? "Source: Public calendar booking\n" : ""}Status: ${escapeHtml(titleize(appointment.status))}
Session: ${escapeHtml(titleize(appointment.bookingTypeId || "session"))}
Purpose: ${escapeHtml(titleize(appointment.purpose || "unspecified"))}
When: ${escapeHtml(formatDate(appointment.startAt))}
Ends: ${escapeHtml(formatDate(appointment.endAt))}
${holdExpiresAt ? `Checkout hold expires: ${escapeHtml(formatDate(holdExpiresAt))}\n` : ""}${appointment.status === "expiry_attention" ? "Hold reconciliation: needs Studio attention; capacity remains blocked\n" : ""}${completedAt ? `Completed: ${escapeHtml(formatDate(completedAt))}\n` : ""}Reschedules used: ${escapeHtml(String(appointment.rescheduleCount ?? appointment.reschedule_count ?? 0))} / 1
${replacementFor ? `Replacement for: ${escapeHtml(replacementFor)}\n` : ""}${replacedBy ? `Replaced by: ${escapeHtml(replacedBy)}\n` : ""}
${appointmentIsConfirmed(appointment) && !isVirtual ? `Location: ${escapeHtml(STUDIO_ADDRESS)}\n` : ""}
Reservation/deposit: ${escapeHtml(money(depositCents, currency))}
Optional tip: ${escapeHtml(money(tipCents, currency))}
Total paid today: ${escapeHtml(money(totalCents, currency))}
Square order: ${escapeHtml(appointment.squareOrderId || "pending")}
${meetingLines}
        </div>
        <div class="booking-actions" style="margin-top:10px;">
          ${calendarHref ? `<a class="button" href="${escapeHtml(calendarHref)}" target="_blank" rel="noopener noreferrer">Add to Calendar</a>` : ""}
          ${calendarHref ? `<button class="button" type="button" data-copy-calendar="${escapeHtml(calendarHref)}">Copy Calendar Link</button>` : ""}
          ${appointmentIsPending(appointment) ? `<button class="button danger-button" type="button" data-release-pending="${escapeHtml(appointment.id)}">Release Pending Checkout</button>` : ""}
          ${canCompleteConsultation ? `<button class="button" type="button" data-complete-appointment="${escapeHtml(appointment.id)}">Mark Consultation Complete</button>` : ""}

  function previewUrl() {
    const path = window.location.protocol === "file:"
      ? "../../booking/index.html"
      : "/booking/";
    const url = new URL(path, window.location.href);
    url.searchParams.set("preview", "1");
    url.searchParams.set("source", "admin");

  function clientPreviewContext(submission, payload, sessionPlan = null) {
    const clientName = submission.contactName || payloadValue(submission, "name") || "Preview Client";
    return {
      createdAt: Date.now(),
      client: {
        name: clientName,
        email: submission.contactEmail || "",
        phone: submission.contactPhone || "",
      },
      submission: {
        id: submission.id || "preview",
        type: submission.type || "tattoo_inquiry",
        status: submission.status || "",
        sourcePath: submission.sourcePath || "",
      },
      settings: payload.settings || null,
      sessionPlan,

    };

  function absoluteUrl(pathOrUrl) {
    if (!pathOrUrl) return "";
    try {
      return new URL(pathOrUrl, window.location.origin).toString();
    } catch {
      return pathOrUrl;
    }
  }

  function textReminderCopy(submission) {
    const name = submission.contactName || payloadValue(submission, "name") || "there";
    if (submission.type === "event_rsvp") {
      const eventTitle = payloadValue(submission, "event_title") || "the event";
      if (submission.status === "booked") {
        return `Hi ${name}, this is the six.well construct. Your spot for ${eventTitle} is confirmed and paid. See you there — reply here if anything changes.`;
      }
      return `Hi ${name}, this is the six.well construct. We saw your RSVP for ${eventTitle}. Your seat is held once Square payment clears — reply here if you need a hand.`;
    }
    const bookingUrl = absoluteUrl(submission.bookingUrl || document.getElementById("bookingUrl")?.value || "");
    const appointment = latestAppointmentFor(submission.id);
    const isStudio = submission.type === "studio_booking" || isStudioAppointment(appointment);
    if (isStudio) {
      if (appointment && appointment.status === "confirmed") {
        return `Hi ${name}, this is the six.well construct. Your studio booking is confirmed. Keep an eye on your email for arrival details, and reply here if anything changes.`;
      }
      return `Hi ${name}, this is the six.well construct. We received your studio booking request and will follow up with next steps. Thank you.`;
    }
    if (appointment && appointment.status === "confirmed") {
      return `Hi ${name}, this is art.pill TATTOO HOUSE. Your appointment is confirmed. Keep an eye on your email for studio follow-up before the session.`;
    }
    if (bookingUrl && submission.status === "approved") {
      if (requiresInPersonConsult(submission)) {
        return `Hi ${name}, this is art.pill TATTOO HOUSE. Your project needs an in-person consultation before tattoo booking. You can choose a consultation time and place the deposit here: ${bookingUrl}`;
      }
      return `Hi ${name}, this is art.pill TATTOO HOUSE. Your project has been approved for booking. Review your session estimate, choose your pacing where available, and place the deposit here: ${bookingUrl}`;
    }
    if (bookingUrl && submission.status === "booked") {
      return `Hi ${name}, this is art.pill TATTOO HOUSE. Your appointment is confirmed. Keep an eye on your email for studio follow-up before the session.`;
    }
    return `Hi ${name}, this is art.pill TATTOO HOUSE. We received your inquiry and will review the project details before sending booking access. Thank you.`;
  }

        ${canResendConfirmation ? `<button class="button" type="button" data-resend-template="appointment_confirmed" data-appointment-id="${escapeHtml(appointment.id)}">Resend Confirmation Email</button>` : ""}

  async function renderTattooSessionPlanEditor(submissionId) {
    const mount = document.getElementById("tattooSessionPlanEditor");
    if (!mount) return;
    mount.innerHTML = `<p class="contact">Loading session plan…</p>`;
    try {
      const payload = await api(`/api/admin/booking/session-plans/${encodeURIComponent(submissionId)}`);
      mount.innerHTML = sessionPlanEditorHtml(payload.sessionPlan || {});
      enhanceControls(mount);
    } catch (error) {
      mount.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
    }
  }

  async function saveTattooSessionPlan(submissionId) {
    const form = document.getElementById("tattooSessionPlanForm");
    if (!form) return null;
    const values = Object.fromEntries(new FormData(form));
    const payload = await api(`/api/admin/booking/session-plans/${encodeURIComponent(submissionId)}`, {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(values),
    });
    const mount = document.getElementById("tattooSessionPlanEditor");
    if (mount) {
      mount.innerHTML = sessionPlanEditorHtml(payload.sessionPlan || {});
      enhanceControls(mount);
    }
    return payload.sessionPlan;
  }

  function defaultTokenPurpose(submission) {
    const stage = submission.tattooStage || submission.tattoo_stage || "";
    return (["consultation_required", "consultation_scheduled"].includes(stage)
      || (requiresInPersonConsult(submission) && !["consultation_complete", "ready_to_book", "tattoo_scheduled", "closed"].includes(stage)))
      ? "consultation"
      : "tattoo";
  }

  function defaultAllowedBookingTypes(submission, purpose = defaultTokenPurpose(submission)) {
    return purpose === "consultation"
      ? ["consult_in_person"]
      : ["tattoo_quarter", "tattoo_half", "tattoo_full"];
  }

  function sortedTypeList(values) {
    return [...values].filter(Boolean).sort().join("|");
  }

  function renderBookingTokenControls(submission) {
    const purpose = defaultTokenPurpose(submission);
    const defaults = defaultAllowedBookingTypes(submission, purpose);
    return `
      <div class="field" style="margin-top:10px;" id="tokenOptions" data-default-token-types="${escapeHtml(sortedTypeList(defaults))}" data-default-token-purpose="${escapeHtml(purpose)}">

            <input id="tokenExpiresAt" type="datetime-local">
            <div class="contact">Blank uses the server default: 30 days.</div>
          </div>

  function bookingTokenRequestBody(submissionId) {
    const selected = [...document.querySelectorAll("[data-token-type]:checked")].map((input) => input.value);
    if (!selected.length) {
      throw new Error("Choose at least one session type for this booking link.");
    }
    const defaultKey = document.getElementById("tokenOptions")?.dataset.defaultTokenTypes || "";
    const purpose = document.getElementById("tokenPurpose")?.value || "tattoo";
    const compatibleTypes = purpose === "consultation"
      ? new Set(["consult_in_person"])
      : new Set(["tattoo_quarter", "tattoo_half", "tattoo_full"]);
    if (selected.some((type) => !compatibleTypes.has(type))) {
      throw new Error(`The selected session types are not compatible with the ${purpose} link purpose.`);
    }
    const body = {
      submissionId,
      purpose,
      revokeExisting: document.getElementById("tokenRevokeExisting")?.checked !== false,
    };
    if (sortedTypeList(selected) !== defaultKey) {
      body.allowedBookingTypes = selected;
    }
    const expiresAt = localDateTimeToIso(document.getElementById("tokenExpiresAt")?.value || "");
    if (expiresAt) body.expiresAt = expiresAt;
    return body;
  }

  function renderDetail(submission) {
    const isProtected = ["booked", "paid", "cancelled"].includes(submission.status);

  function localDateTimeToIso(value) {
    if (!value) return "";
    const date = new Date(value);
    return date.toString() === "Invalid Date" ? "" : date.toISOString();

  function formatDateTimeLocal(value) {
    if (!value) return "";
    const date = new Date(value);
    return date.toLocaleString([], { dateStyle:"medium", timeStyle:"short" });
  }

  function formatDateTimeInput(value) {
    if (!value) return "";
    const date = new Date(value);
    if (date.toString() === "Invalid Date") return "";
    const offset = date.getTimezoneOffset() * 60000;
    return new Date(date.getTime() - offset).toISOString().slice(0, 16);
  }

  function monthKey(value) {
    if (!value) return "";
    const date = new Date(value);
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
  }

  function monthLabel(key) {
    if (!key) return "";
    const [year, month] = key.split("-").map(Number);
    return new Date(year, month - 1, 1).toLocaleString([], { month:"long", year:"numeric" });
  }

  function dayKey(value) {
    if (!value) return "";
    const date = new Date(value);
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
  }

  function dayStatsFromAppointments() {
    const stats = new Map();
    for (const a of scopedAppointments()) {
      if (!a.startAt) continue;
      const key = dayKey(a.startAt);
      const hours = a.endAt ? Math.max(0, (new Date(a.endAt) - new Date(a.startAt)) / 3600000) : 0;
      const entry = stats.get(key) || { hours: 0, count: 0 };
      entry.hours += hours;
      entry.count += 1;
      stats.set(key, entry);
    }
    return stats;
  }

  function dayClass(entry) {
    if (!entry) return "";
    if (entry.hours > 5) return "booked-dark";
    if (entry.hours > 2) return "booked-medium";
    if (entry.hours > 0) return "booked-bright";
    return "";
  }

  function renderBookedCalendar(monthKeyValue, dayStats) {
    const calendar = document.getElementById("bookedCalendar");
    if (!calendar || !monthKeyValue) return;
    const [year, month] = monthKeyValue.split("-").map(Number);
    const firstDay = new Date(year, month - 1, 1);
    const daysInMonth = new Date(year, month, 0).getDate();
    const cells = [];
    for (let blank = 0; blank < firstDay.getDay(); blank += 1) {
      cells.push('<button class="day-button blank" type="button" tabindex="-1" aria-hidden="true"></button>');
    }
    for (let day = 1; day <= daysInMonth; day += 1) {
      const key = `${monthKeyValue}-${String(day).padStart(2, "0")}`;
      const entry = dayStats.get(key);
      const count = entry?.count || 0;
      const hours = entry?.hours || 0;
      const label = `${count === 1 ? "1 appointment" : `${count} appointments`}${count ? ` · ${hours.toFixed(1)}h booked` : ""}`;
      const isSelected = key === selectedCalendarDay;
      cells.push(`
        <button class="day-button ${dayClass(entry)}${isSelected ? " selected" : ""}" type="button" data-day="${escapeHtml(key)}" aria-label="${escapeHtml(`${key}: ${label}`)}" title="${escapeHtml(label)}">
          ${day}
        </button>
      `);
    }
    calendar.innerHTML = `
      <div class="calendar-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="calendar-grid">${cells.join("")}</div>
    `;
  }

  function renderDayAppointments(dayFilter) {
    const panel = document.getElementById("apptDayList");

    const countEl = document.getElementById("apptDayCount");
    if (!panel) return;

    const scoped = scopedAppointments();
    const filtered = dayFilter
      ? scoped.filter((a) => dayKey(a.startAt) === dayFilter)
      : [...scoped].sort((a, b) => new Date(a.startAt) - new Date(b.startAt));

    if (label) {
      label.textContent = dayFilter
        ? new Date(dayFilter + "T12:00:00").toLocaleDateString([], { weekday:"long", month:"long", day:"numeric" })
        : "All Appointments";
    }
    if (countEl) countEl.textContent = `${filtered.length} appointment${filtered.length !== 1 ? "s" : ""}`;

    if (!filtered.length) {
      panel.innerHTML = `<p class="empty" style="font-family:var(--sans);font-size:11px;">${dayFilter ? "No appointments on this day." : "No appointments found."}</p>`;
      return;
    }

    panel.innerHTML = filtered.map((a) => {
      const start = a.startAt ? new Date(a.startAt).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }) : "";
      const end = a.endAt ? new Date(a.endAt).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }) : "";
      const dateStr = a.startAt ? new Date(a.startAt).toLocaleDateString([], { month:"short", day:"numeric" }) : "";
      const deposit = a.depositCents ? money(a.depositCents, a.currency || "USD") : "";
      const meetingLabel = a.meeting?.joinUrl ? "Zoom ready" : a.bookingTypeId === "consult_virtual" ? "Zoom missing" : "";
      const related = appointmentRelatedSubmission(a);
      const manageButton = isStudioAppointment(a)
        ? `<button class="button" type="button" data-manage-studio-appointment="${escapeHtml(a.id)}">Manage Booking</button>`
        : related ? `<button class="button" type="button" data-open-submission="${escapeHtml(related.id)}">Open Submission</button>` : "";
      return `
        <div class="appt-item">
          <div class="appt-item-top">
            <span class="appt-name">${escapeHtml(a.clientName || "Unnamed")}${meetingLabel ? ` / ${escapeHtml(meetingLabel)}` : ""}</span>
            <span class="appt-time">${escapeHtml(dayFilter ? `${start} – ${end}` : `${dateStr} ${start}`)}</span>
          </div>
          <span class="appt-meta">${escapeHtml(titleize(a.bookingTypeId || "session"))}${deposit ? ` · ${deposit} deposit` : ""}${a.status ? ` · ${a.status}` : ""}</span>
          ${manageButton ? `<div class="booking-actions" style="margin-top:6px;">${manageButton}</div>` : ""}
        </div>
      `;
    }).join("");
  }

  function priceInputValue(cents) {
    return ((Number(cents) || 0) / 100).toFixed(2);
  }

  function priceFieldLabel(type) {
    return FULL_PAYMENT_BOOKING_TYPE_IDS.includes(type?.id) ? "Reservation Fee" : "Deposit";
  }

  function scopedBookingTypes() {
    const ids = new Set((AVAILABILITY_CONFIGS[activeTab]?.bookingTypeIds || []));
    return bookingTypes
      .filter((type) => ids.has(type.id))
      .sort((a, b) => (Number(a.sortOrder || 0) - Number(b.sortOrder || 0)) || String(a.label || "").localeCompare(String(b.label || "")));
  }

  function availabilityScope() {
    return activeTab === "studio" ? "studio" : "tattoo";
  }

  function availabilityApi(path) {
    const url = new URL(path, window.location.origin);
    url.searchParams.set("scope", availabilityScope());
    return `${url.pathname}${url.search}`;
  }

  function availabilityConfig() {
    return AVAILABILITY_CONFIGS[activeTab] || AVAILABILITY_CONFIGS.tattoo;
  }

  function scopedSessionTypeOptions(options = {}) {
    const config = availabilityConfig();
    const includeBlank = options.includeBlank !== false && config.allowUnscopedExceptions !== false;
    return (config.sessionTypeOptions || []).filter(([value]) => value || includeBlank);
  }

  function renderSessionTypeOptions(selectedValue = "", options = {}) {
    const normalized = selectedValue || "";
    return scopedSessionTypeOptions(options).map(([value, label]) =>
      `<option value="${escapeHtml(value)}"${value === normalized ? " selected" : ""}>${escapeHtml(label)}</option>`
    ).join("");
  }

  function sessionTypeLabel(value) {
    const found = (availabilityConfig().sessionTypeOptions || []).find(([id]) => id === value);
    if (found) return found[1];
    return value ? titleize(value) : "Any tattoo session";
  }

  function readinessDetailLines(check) {
    const details = check.details || {};
    if (check.id === "square_checkout" || check.id === "studio_square_checkout") {
      return [
        `Environment: ${details.environment || "sandbox"}`,
        `Access token: ${details.hasAccessToken ? "present" : "missing"}`,

    if (check.id === "square_webhook_signing" || check.id === "studio_square_webhook_signing") {
      return [
        `Signature key: ${details.hasSignatureKey ? "present" : "missing"}`,
        `Webhook URL: ${details.notificationUrl || "not resolved"}`,

    if (check.id === "zoom_credentials") {
      return [
        `Account ID: ${details.hasAccountId ? "present" : "missing"}`,
        `Client ID: ${details.hasClientId ? "present" : "missing"}`,
        `Client secret: ${details.hasClientSecret ? "present" : "missing"}`,

        `Meeting table: ${details.appointmentMeetingsTable ? "ready" : "missing migration"}`,

        `Horizon: ${settings.bookingHorizonDays || 0} days`,

        `Interval: ${settings.slotIntervalMinutes || 0} minutes`,

  async function loadSubmissions() {
    if (!token) {
      tokenModal.classList.remove("hidden");
      setStatus("Locked");
      return;
    }

    setStatus("Loading");
    const payload = await api(`/api/admin/submissions?limit=100`);
    const appointmentPayload = await api("/api/admin/booking/appointments");
    submissions = payload.submissions || [];
    appointments = appointmentPayload.appointments || [];
    try {
      const eventsPayload = await api("/api/admin/events");
      events = eventsPayload.events || [];
    } catch {
      events = [];
    }
    const previewApplied = applyHomeCalendarPreviewData();
    setStatus(`${submissions.length} loaded${previewApplied ? " + preview" : ""}`);

    const generateOpenMic = event.target.closest("[data-generate-open-mic-slot]");

        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ templateKey, submissionId, appointmentId, notificationId }),

        headers: { "content-type": "application/json" },

      });

        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ refund }),

      await loadAvailabilityPreview();

    }

    if (event.target.id === "previewBookingBtn" && activeId) {
      const submission = submissions.find((item) => item.id === activeId);

      setStatus("Building preview");
      const [payload, planPayload] = await Promise.all([
        api("/api/admin/booking/availability-preview"),
        TATTOO_PROJECT_TYPES.has(submission.type) ? api(`/api/admin/booking/session-plans/${encodeURIComponent(activeId)}`) : Promise.resolve({ sessionPlan:null }),
      ]);
      localStorage.setItem(bookingPreviewKey, JSON.stringify(clientPreviewContext(submission, payload, planPayload.sessionPlan || null)));
      window.open(previewUrl().toString(), "_blank", "noopener,noreferrer");
      setStatus("Real-data preview opened");
      return;
    }

    if (event.target.id === "generateBookingBtn" && activeId) {
      const submission = submissions.find((item) => item.id === activeId);
      const currentSelectStatus = document.getElementById("detailStatus")?.value;
      if (submission?.status !== "approved" && currentSelectStatus !== "approved") {
        setStatus("Setting status to approved first");
        document.getElementById("detailStatus").value = "approved";
      }
      if (submission?.status !== "approved") {
        setStatus("Saving as approved");
        const saved = await api(`/api/admin/submissions/${encodeURIComponent(activeId)}`, {
          method: "PATCH",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            status: "approved",
            bookingUrl: document.getElementById("bookingUrl")?.value || submission?.bookingUrl || "",
            internalNotes: document.getElementById("internalNotes")?.value || submission?.internalNotes || "",
          }),
        });
        const index = submissions.findIndex((s) => s.id === activeId);
        if (index >= 0) submissions[index] = saved.submission;
      }
      setStatus("Generating link");
      let tokenBody;
      try {
        tokenBody = bookingTokenRequestBody(activeId);
      } catch (error) {
        setStatus(error.message);
        return;
      }
      const payload = await api("/api/admin/booking/tokens", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(tokenBody),
      });
      const tokenPath = payload.token.path || payload.token.bookingUrl || "";
      document.getElementById("bookingUrl").value = tokenPath;
      const textAssist = document.getElementById("textAssist");
      if (textAssist) {
        textAssist.value = textReminderCopy({
          ...(submissions.find((s) => s.id === activeId) || submission),
          bookingUrl: tokenPath,
          status: "approved",
        });
      }
      await navigator.clipboard?.writeText(payload.token.bookingUrl || tokenPath).catch(() => {});
      await loadAndRender();
      const delivery = payload.delivery || payload.notificationDelivery || payload.notification || null;
      setStatus(delivery && !delivery.ok
        ? `Booking link generated and copied; email failed${delivery.error ? ` (${delivery.error})` : ""}`
        : delivery?.skipped
          ? "Booking link generated and copied; email was already delivered"
          : delivery?.ok
            ? "Booking link emailed and copied"
            : "Booking link generated and copied; verify delivery in Notifications");
      return;
    }

    if (event.target.id === "refreshTextAssistBtn" && activeId) {
      const submission = submissions.find((item) => item.id === activeId);
      const textAssist = document.getElementById("textAssist");
      if (submission && textAssist) {
        textAssist.value = textReminderCopy({
          ...submission,
          bookingUrl: document.getElementById("bookingUrl")?.value || submission.bookingUrl,
          status: document.getElementById("detailStatus")?.value || submission.status,

    if (event.target.id === "copyTextAssistBtn") {
