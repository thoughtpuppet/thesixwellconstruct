<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Studio Booking Confirmation - the six.well construct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="/css/transitions.css">
<style>
  :root {
    --bg:#0e0e0e; --accent:#FCB867; --signal:#6E0404;
    --ring:#6D3D15; --ring-soft:rgba(109,61,21,0.4); --ring-faint:rgba(109,61,21,0.18);
    --text:#FCB867; --muted:rgba(252,184,103,0.64); --dim:rgba(252,184,103,0.38);
    --sans:Inter,Arial,sans-serif; --serif:Georgia,"Times New Roman",Times,serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--serif); overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  .grain { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.035; mix-blend-mode:overlay; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  header { position:sticky; top:0; z-index:10; min-height:72px; display:flex; justify-content:flex-end; padding:24px 40px; }
  main { position:relative; z-index:2; max-width:980px; margin:0 auto; padding:72px 40px 80px; }
  .badge { display:inline-flex; align-items:center; gap:8px; border:5px solid var(--ring-soft); color:var(--ring); padding:5px 12px; margin-bottom:34px; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  .badge.pending { color:var(--signal); }
  .badge-dot { width:5px; height:5px; border-radius:50%; background:currentColor; }
  .label { font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--dim); }
  h1 { max-width:720px; margin:16px 0 28px; font-family:var(--sans); font-size:clamp(42px,7vw,82px); line-height:0.9; letter-spacing:0; color:var(--accent); }
  .lead { max-width:620px; margin:0 0 44px; color:var(--muted); font-size:16px; line-height:1.8; }
  .note { max-width:620px; margin:0 0 44px; color:var(--muted); font-size:14px; line-height:1.7; padding:18px 20px; border:5px solid var(--ring-faint); }
  .detail-block { max-width:620px; border-top:5px solid var(--ring-soft); margin:36px 0; }
  .detail-row { display:grid; grid-template-columns:180px 1fr; gap:18px; border-bottom:5px solid var(--ring-faint); padding:16px 0; color:var(--muted); line-height:1.55; }
  .detail-key { color:var(--dim); font-family:var(--sans); font-size:10px; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; }
  .cta-row { display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .cta-primary { display:inline-flex; align-items:center; min-height:48px; border:5px solid var(--ring-soft); padding:0 24px; color:#FFE7CA; font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; }
  .cta-primary:hover { border-color:var(--accent); color:var(--accent); }
  .cta-ghost { color:var(--dim); font-family:var(--sans); font-size:10px; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; }
  .manage-block { max-width:620px; margin:36px 0 0; padding-top:36px; border-top:5px solid var(--ring-soft); }
  .manage-block p { color:var(--muted); font-size:14px; line-height:1.7; margin:0 0 14px; }
  .manage-actions { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .manage-email-field { display:grid; gap:7px; min-width:min(100%,280px); }
  .manage-email-label { color:var(--dim); font-family:var(--sans); font-size:10px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; }
  .manage-input { width:100%; background:transparent; border:5px solid var(--ring-soft); color:var(--text); font-family:var(--sans); font-size:16px; padding:10px 14px; min-width:220px; }
  .manage-input::placeholder { color:var(--dim); }
  .manage-error { color:var(--signal); font-size:12px; margin:0; }
  .btn-link { background:none; border:5px solid var(--ring-soft); color:#FFE7CA; font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; padding:0 24px; min-height:48px; cursor:pointer; }
  .btn-link:hover { border-color:var(--accent); color:var(--accent); }
  :where(.cta-primary,.cta-ghost,.btn-link,.manage-input):focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  @media (max-width:680px) {
    header { padding:18px 24px; min-height:60px; }
    main { padding:48px 24px 64px; }
    .detail-row { grid-template-columns:1fr; gap:4px; }
    .manage-email-field { width:100%; }
  }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:0.01ms !important; }
    .grain { display:none; }
  }
</style>
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/site-typography.css">
<link rel="stylesheet" href="/css/tattoos.css">
</head>
<body class="tattoo-flow" data-venture="about">
<script>
(function(){
  var o = document.createElement("div");
  o.id = "construct-fade";
  o.style.cssText = "position:fixed;inset:0;background:#0e0e0e;z-index:9999;opacity:1;pointer-events:auto;transition:opacity 500ms cubic-bezier(0.45,0,0.55,1);";
  document.body.appendChild(o);
  function fadeOut(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ o.style.opacity = "0"; o.style.pointerEvents = "none"; }); }); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fadeOut); else fadeOut();
})();
</script>
<div class="grain"></div>
<header></header>
<main>
  <div id="badge" class="badge"><span class="badge-dot"></span><span id="badgeText">Checking Reservation</span></div>
  <h1 id="title">Reading the booking record.</h1>
  <p id="lead" class="lead" role="status" aria-live="polite">Give this a moment. The system is checking the booking and Square deposit state.</p>
  <div id="details" class="detail-block" aria-live="polite"></div>
  <p class="note">The amount above is your deposit — it holds your date. Any remaining balance is settled with the studio directly.</p>
  <div class="cta-row">
    <a class="cta-primary" href="/booking/studio/">Book Another Time</a>
    <a class="cta-ghost" href="/home/">Return to construct</a>
  </div>
  <div id="manageBlock" class="manage-block" style="display:none;" aria-live="polite"></div>
</main>
<script>
(function(){
  const appointmentId = new URLSearchParams(window.location.search).get("appointment") || "";
  const badge = document.getElementById("badge");
  const badgeText = document.getElementById("badgeText");
  const title = document.getElementById("title");
  const lead = document.getElementById("lead");
  const details = document.getElementById("details");

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;",
    }[char]));
  }

  function formatDate(value) {
    if (!value) return "";
    return new Date(value).toLocaleString("en-US", { timeZone:"America/New_York", weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZoneName:"short" });
  }

  function money(cents, currency) {
    return new Intl.NumberFormat("en-US", { style:"currency", currency:currency || "USD", maximumFractionDigits:cents % 100 === 0 ? 0 : 2 }).format(cents / 100);
  }

  function renderRow(key, value, raw) {
    return `<div class="detail-row"><span class="detail-key">${escapeHtml(key)}</span><span>${raw ? value : escapeHtml(value)}</span></div>`;
  }

  function calendarRow(appointment, paid, isCancelled) {
    if (!paid || isCancelled || !appointment?.id) return "";
    const isDemo = appointment.id === "demo";
    const url = isDemo ? "#" : `/api/booking/calendar?appointment=${encodeURIComponent(appointment.id)}`;
    return renderRow("Calendar", `<a href="${escapeHtml(url)}"${isDemo ? ' onclick="return false;" title="Disabled in preview"' : ""} style="color:var(--accent);text-decoration:underline;">Add to Calendar</a>`, true);
  }

  const manage = document.getElementById("manageBlock");
  const DEFAULT_SUPPORT_EMAIL = "saisolehman@artpilltattoohouse.com";
  const STUDIO_ADDRESS = "364 Nelson Street SW, Atlanta, GA 30313";
  const previewMode = new URLSearchParams(window.location.search).get("preview") === "1";

  function rebookUrl() {
    return "/booking/studio/?rebook=1";
  }

  function renderManageBlock(appointment, payload, paid) {
    const supportEmail = payload.supportEmail || DEFAULT_SUPPORT_EMAIL;
    const supportLine = `Email <a href="mailto:${escapeHtml(supportEmail)}" style="color:var(--accent);text-decoration:underline;">${escapeHtml(supportEmail)}</a> with your booking details and we'll help you out.`;
    const isPast = new Date(appointment.startAt).getTime() <= Date.now();
    const isCancelled = appointment.status === "cancelled" || appointment.status === "archived";

    manage.style.display = "";

    if (isCancelled) {
      manage.innerHTML = `
        <p class="label" style="margin-bottom:12px;">Need to make changes?</p>
        <p>This studio booking has been cancelled. ${supportLine}</p>
        <a class="cta-primary" href="${rebookUrl()}">Pick a New Time</a>
      `;
      return;
    }

    if (!paid || isPast) {
      manage.innerHTML = `
        <p class="label" style="margin-bottom:12px;">Need to make changes?</p>
        <p>${supportLine}</p>
      `;
      return;
    }

    const hours = payload.hoursUntilStart;
    const alreadyRescheduled = Number(appointment.rescheduleCount || 0) >= 1;
    const policyText = (typeof hours === "number" && hours < 48)
      ? "This booking is less than 48 hours away. A reschedule keeps the original booking in place until a new same-type deposit is paid."
      : "This booking is at least 48 hours away. One same-type reschedule can move the existing payment to the new time.";

    manage.innerHTML = `
      <p class="label" style="margin-bottom:12px;">Need to make changes?</p>
      <p>${supportLine}</p>
      <p>${policyText}</p>
      <div class="manage-actions">
        <div class="manage-email-field">
          <label class="manage-email-label" for="manageEmail">Confirm booking email</label>
          <input type="email" id="manageEmail" class="manage-input" autocomplete="email" inputmode="email" placeholder="you@example.com">
        </div>
        <button type="button" id="cancelBtn" class="btn-link">Cancel Booking</button>
        ${alreadyRescheduled ? "" : `<a id="rescheduleLink" class="btn-link" href="/booking/reschedule/?appointment=${encodeURIComponent(appointment.id)}">Reschedule</a>`}
      </div>
      ${alreadyRescheduled ? `<p class="manage-error">This booking has already used its one online reschedule. Contact the Studio for help with any further change.</p>` : ""}
      <p id="manageError" class="manage-error" role="alert" aria-live="assertive" style="display:none;"></p>
    `;

    document.getElementById("cancelBtn").addEventListener("click", () => doCancel(appointment, payload));
  }

  async function doCancel(appointment, payload) {
    const emailInput = document.getElementById("manageEmail");
    const errorEl = document.getElementById("manageError");
    const email = (emailInput.value || "").trim();
    errorEl.style.display = "none";
    if (!email) {
      errorEl.textContent = "Enter the email used for this booking to confirm.";
      errorEl.style.display = "";
      emailInput.focus();
      return;
    }
    if (!window.confirm("Cancel this studio booking? This is separate from rescheduling and cannot be undone.")) return;

    if (previewMode) {
      badge.classList.add("pending");
      badgeText.textContent = "Booking Cancelled";
      title.textContent = "This studio booking has been cancelled.";
      lead.textContent = "Your time has been released. Email us if you have any questions.";
      renderManageBlock({ ...appointment, status: "cancelled" }, payload, false);
      return;
    }

    try {
      const response = await fetch("/api/booking/cancel", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ appointmentId: appointment.id, email }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "Unable to cancel this booking.");
      badge.classList.add("pending");
      badgeText.textContent = "Booking Cancelled";
      title.textContent = "This studio booking has been cancelled.";
      lead.textContent = "Your time has been released. Email us if you have any questions.";
      renderManageBlock(result.appointment, payload, false);
    } catch (error) {
      errorEl.textContent = error.message;
      errorEl.style.display = "";
    }
  }

  function previewPayload(state, params) {
    const hoursParam = Number(params.get("hours"));
    const hoursUntilStart = Number.isFinite(hoursParam) && hoursParam !== 0 ? hoursParam : 26;
    const start = new Date(Date.now() + hoursUntilStart * 60 * 60 * 1000);
    const end = new Date(start.getTime() + 60 * 60 * 1000);
    return {
      appointment: {
        id: "demo",
        bookingTypeId: "studio_visit",
        bookingTypeLabel: "Open Studio Visit",
        clientName: "Jordan Rivera",
        startAt: start.toISOString(),
        endAt: end.toISOString(),
        depositCents: 1000,
        tipCents: 0,
        totalDueCents: 1000,
        currency: "USD",
        status: state === "cancelled" ? "cancelled" : (state === "pending" ? "pending_deposit" : "confirmed"),
        meeting: null,
      },
      depositStatus: state === "pending" ? "pending" : "paid",
      supportEmail: DEFAULT_SUPPORT_EMAIL,
      hoursUntilStart,
    };
  }

  async function load() {
    const params = new URLSearchParams(window.location.search);
    let payload;
    if (params.get("preview") === "1") {
      if (params.get("state") === "error") throw new Error("Appointment not found.");
      payload = previewPayload(params.get("state") || "paid", params);
    } else {
      if (!appointmentId) throw new Error("Appointment reference is missing.");
      const response = await fetch(`/api/booking/confirm?appointment=${encodeURIComponent(appointmentId)}`);
      payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || "Unable to confirm this booking.");
    }
    const appointment = payload.appointment;
    const isCancelled = appointment.status === "cancelled" || appointment.status === "archived";
    const paid = payload.depositStatus === "paid" || appointment.status === "confirmed";
    badge.classList.toggle("pending", !paid || isCancelled);
    if (isCancelled) {
      badgeText.textContent = "Booking Cancelled";
      title.textContent = "This studio booking has been cancelled.";
      lead.textContent = "Your time has been released. Email us if you have any questions.";
    } else {
      badgeText.textContent = paid ? "Studio Booking Confirmed" : "Deposit Pending";
      title.textContent = paid ? "Your time is held." : "Your booking is waiting on payment confirmation.";
      lead.textContent = paid
        ? "Your deposit has been received and your studio time is held. Keep an eye on your email for any studio follow-up."
        : "Square has not returned a paid order yet. If you just paid, refresh this page in a moment. The studio can also see this pending booking.";
    }
    details.innerHTML = [
      renderRow("Booked By", appointment.clientName),
      renderRow("Booking", appointment.bookingTypeLabel || ""),
      renderRow("When", `${formatDate(appointment.startAt)} - ${formatDate(appointment.endAt)}`),
      paid && !isCancelled ? renderRow("Location", STUDIO_ADDRESS) : "",
      renderRow("Deposit", `${money(appointment.depositCents, appointment.currency)} / ${paid ? "received" : "pending"}`),
      calendarRow(appointment, paid, isCancelled),
      renderRow("Status", appointment.status.replace(/_/g, " ")),
    ].filter(Boolean).join("");

    renderManageBlock(appointment, payload, paid);
  }

  load().catch((error) => {
    badge.classList.add("pending");
    badgeText.textContent = "Confirmation Issue";
    title.textContent = "This booking could not be confirmed.";
    lead.textContent = error.message;
  });
})();
</script>
<script src="/js/transition.js"></script>
<script src="/js/construct-corner.js"></script>
<script src="/js/construct-nav.js"></script>
</body>
</html>
