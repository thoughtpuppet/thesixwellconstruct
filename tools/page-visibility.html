<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>page visibility - the six.well construct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=block">
<link rel="stylesheet" href="/studio/construct-manager.css?v=20260821-studio-visibility">
<style>
  :root {
    --bg:#0e0e0e;--panel:#141414;--text:#FFE7CA;--muted:rgba(255,231,202,.62);
    --dim:rgba(255,231,202,.36);--accent:#FCB867;--signal:#6E0404;
    --ring:rgba(252,184,103,.36);--ring-faint:rgba(252,184,103,.18);
    --sans:Inter,Arial,sans-serif;--serif:Georgia,"Times New Roman",Times,serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:48px clamp(18px,4vw,56px);overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--serif)}
  main{width:min(100%,1240px);margin:0 auto;min-width:0}.tool-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,360px);gap:24px;align-items:end;margin-bottom:28px;padding-bottom:28px;border-bottom:5px solid var(--ring-faint)}
  h1{margin:0;color:var(--accent);font:900 clamp(40px,8vw,112px)/.88 var(--sans);text-transform:uppercase}.tool-head p{margin:0 0 8px;color:var(--muted);font:800 11px/1.55 var(--sans);letter-spacing:.16em;text-align:right;text-transform:uppercase}
  button,.button,select,input{min-height:42px;border:5px solid var(--ring-faint);background:var(--bg);color:var(--text);font-family:var(--sans)}button,.button{display:inline-flex;align-items:center;justify-content:center;padding:0 14px;cursor:pointer;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}button:hover,button:focus-visible,.button:hover,.button:focus-visible{outline:none;border-color:var(--accent);color:var(--accent)}button:disabled,.button:disabled{cursor:not-allowed;opacity:.46}.danger-button{border-color:rgba(110,4,4,.82)!important;color:#ffb6ad!important}select,input{padding:0 10px}
  .access{display:grid;gap:12px;max-width:520px;padding:18px;border:5px solid var(--ring-faint);background:var(--panel)}.access h2{margin:0;font:900 15px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase}.access p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.access form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.access[hidden]{display:none}
  @media(max-width:720px){body{padding:28px 14px}.tool-head{display:block}.tool-head p{margin-top:18px;text-align:left}.access form{grid-template-columns:1fr}.access button{width:100%}}
</style>
</head>
<body>
<main>
  <header class="tool-head">
    <h1>page visibility</h1>
    <p>Studio-backed controls for hiding or restoring deployed public pages immediately.</p>
  </header>
  <section class="access" id="accessPanel">
    <h2>Admin access</h2>
    <p>Use the same Studio admin token. It is stored only in this browser's local storage.</p>
    <form id="accessForm">
      <input id="tokenInput" type="password" autocomplete="current-password" placeholder="Admin token" required>
      <button type="submit">Unlock controls</button>
    </form>
  </section>
  <div id="pageVisibilityRoot"></div>
</main>
<script type="module">
  import { mountPageVisibility } from "/studio/page-visibility-manager.js?v=20260821-studio-visibility";

  const tokenKey = "swc_submissions_admin_token";
  const accessPanel = document.querySelector("#accessPanel");
  const accessForm = document.querySelector("#accessForm");
  const tokenInput = document.querySelector("#tokenInput");
  const root = document.querySelector("#pageVisibilityRoot");
  let token = localStorage.getItem(tokenKey) || "";

  async function api(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers: { authorization: `Bearer ${token}`, ...(options.headers || {}) },
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || `Request failed with ${response.status}.`);
    return payload;
  }

  async function openControls() {
    if (!token) {
      accessPanel.hidden = false;
      root.innerHTML = "";
      return;
    }
    accessPanel.hidden = true;
    await mountPageVisibility(root, api, (message) => { document.title = `${message} - page visibility`; });
    if (root.querySelector('[data-kind="error"]')) accessPanel.hidden = false;
  }

  accessForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    token = tokenInput.value.trim();
    localStorage.setItem(tokenKey, token);
    await openControls();
  });

  openControls();
</script>
</body>
</html>
