<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Flash detail - Art.Pill Tattoo House</title>
  <link rel="canonical" id="canonicalLink" href="/tattoos/flash/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=block" rel="stylesheet">
  <link rel="stylesheet" href="/css/transitions.css">
  <style>
    :root{--bg:#0e0e0e;--signal:#6E0404;--accent:#FCB867;--ornament:var(--signal);--display:var(--signal);--focus:var(--accent);--text:#FFE7CA;--muted:rgba(255,231,202,.68);--dim:rgba(255,231,202,.4);--line:rgba(110,4,4,.42);--sans:Inter,Arial,sans-serif;--serif:Georgia,"Times New Roman",serif;}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--serif)}a{color:inherit;text-decoration:none}button,input{font:inherit}
    .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.035;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
    header{position:sticky;top:0;z-index:10;min-height:72px;padding:24px 40px;display:flex;justify-content:flex-end}.back-link{font-family:var(--sans);font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--focus)}
    main{position:relative;z-index:2;width:min(1180px,calc(100% - 80px));margin:0 auto;padding:72px 0 90px}.state{min-height:50vh;display:grid;align-content:center;gap:16px;color:var(--muted)}.state h1{margin:0;font-family:var(--sans);font-size:clamp(40px,7vw,82px);line-height:.92;color:var(--display)}
    .detail{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,.82fr);gap:64px;align-items:start}.media-column{position:sticky;top:96px;min-width:0}.media{margin:0;border:5px solid var(--line);background:rgba(110,4,4,.06);min-height:360px;display:grid;place-items:center}.media img{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain}.media-caption{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.media-gallery{display:flex;gap:12px;margin-top:12px;padding:0 0 8px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x proximity}.media-thumb{flex:0 0 94px;width:94px;height:94px;padding:0;border:5px solid var(--line);background:#090909;cursor:pointer;scroll-snap-align:start}.media-thumb[aria-pressed="true"]{border-color:var(--focus)}.media-thumb img{display:block;width:100%;height:100%;object-fit:cover}.copy{padding-top:12px}.kicker,.meta-label{font-family:var(--sans);font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--focus)}h1{margin:14px 0 22px;font-family:var(--sans);font-size:clamp(52px,7vw,104px);line-height:.86;letter-spacing:-.045em;color:var(--display)}.description{margin:0 0 30px;max-width:380px;padding-bottom:16px;color:var(--muted);font-family:var(--serif);font-size:12px;font-weight:400;letter-spacing:.22em;line-height:1.6;text-align:left;text-transform:uppercase}.meta{margin:0 0 28px;border-top:5px solid var(--line)}.meta-row{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid rgba(110,4,4,.28)}.meta-value{color:var(--muted);line-height:1.5}.availability{margin:0 0 24px;padding:18px;border-left:5px solid var(--ornament);background:rgba(110,4,4,.1);color:var(--muted);line-height:1.65}.availability strong{display:block;margin-bottom:5px;font-family:var(--sans);color:var(--focus)}
    .acknowledgement{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start;margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.6}.acknowledgement input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ornament)}.claim-link{min-height:52px;padding:0 24px;display:inline-flex;align-items:center;justify-content:center;border:5px solid var(--ornament);background:var(--ornament);font-family:var(--sans);font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--text)}.claim-link[aria-disabled="true"]{opacity:.42;pointer-events:none}.claim-link:hover{background:var(--display);border-color:var(--display)}:where(a,button,input):focus-visible{outline:2px solid var(--focus);outline-offset:4px}
    .sheet-designs{margin:0 0 28px}.sheet-designs h2{margin:0 0 8px;font-family:var(--sans);font-size:18px;line-height:1;text-transform:uppercase;color:var(--focus)}.sheet-designs>p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.6}.sheet-design-list{display:grid;gap:12px}.sheet-design-row{display:grid;grid-template-columns:22px 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px;border:5px solid var(--line);color:var(--muted)}.sheet-design-row:has(input:checked){border-color:var(--focus);color:var(--text)}.sheet-design-row input{width:20px;height:20px;margin:0;accent-color:var(--ornament)}.sheet-design-code{font-family:var(--sans);font-weight:900;color:var(--focus)}.sheet-design-state{font-family:var(--sans);font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}.sheet-design-row.is-unavailable{opacity:.58}
    footer{position:relative;z-index:2;width:min(1180px,calc(100% - 80px));margin:0 auto;padding:40px 0 56px;border-top:5px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:var(--dim);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
    [hidden]{display:none!important}
    @media(max-width:820px){header{padding:18px 24px;min-height:60px}main,footer{width:min(100% - 40px,1180px)}main{padding-top:42px}.detail{grid-template-columns:1fr;gap:36px}.media-column{position:static}.media{min-height:260px}.meta-row{grid-template-columns:1fr;gap:5px}}
    @media(max-width:640px){.acknowledgement,.claim-link{font-size:16px}.claim-link{width:100%}.sheet-design-row{grid-template-columns:22px 30px minmax(0,1fr)}.sheet-design-state{grid-column:3}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
  </style>
  <link rel="stylesheet" href="/css/site-typography.css">
<link rel="stylesheet" href="/css/tattoos.css">
</head>
<body class="tattoo-flow" data-venture="tattooing">
  <div class="grain"></div>
  <header><a class="back-link" href="/tattoos/flash/">&larr; Flash catalog</a></header>
  <main>
    <section class="state" id="loadingState" role="status" aria-live="polite"><p class="kicker">Flash record</p><h1>Loading design.</h1></section>
    <section class="detail" id="detail" hidden>
      <div class="media-column">
        <figure class="media"><img id="flashImage" src="" alt=""></figure>
        <p class="media-caption" id="flashMediaCaption" hidden></p>
        <div class="media-gallery" id="flashMediaGallery" role="group" aria-label="Flash design gallery" hidden></div>
      </div>
      <div class="copy">
        <p class="kicker" id="flashKicker">Art.Pill flash</p>
        <h1 id="flashTitle"></h1>
        <p class="description" id="flashDescription"></p>
        <div class="meta" id="flashMeta"></div>
        <section class="sheet-designs" id="sheetDesigns" aria-labelledby="sheetDesignHeading" hidden>
          <h2 id="sheetDesignHeading">Choose sheet designs</h2>
          <p>Select one or several available designs. Placement and optional scale are entered for each on the next page.</p>
          <div class="sheet-design-list" id="sheetDesignList"></div>
        </section>
        <p class="availability" id="availability" role="status"></p>
        <div id="claimControls" hidden>
          <label class="acknowledgement"><input id="claimAcknowledgement" type="checkbox"><span>I understand that a claim begins studio review. The design is not reserved or booked until the studio confirms availability and sends the next step.</span></label>
          <a class="claim-link" id="claimLink" href="/tattoos/flash/claim/" aria-disabled="true">Continue to claim</a>
        </div>
      </div>
    </section>
  </main>
  <footer><a href="/tattoos/flash/">Back to flash</a><a href="/home/">the six.well construct</a></footer>
  <script>
  (() => {
    const loading = document.getElementById('loadingState');
    const detail = document.getElementById('detail');
    const canonical = document.getElementById('canonicalLink');
    const claimControls = document.getElementById('claimControls');
    const claimLink = document.getElementById('claimLink');
    const acknowledgement = document.getElementById('claimAcknowledgement');
    const mediaGallery = document.getElementById('flashMediaGallery');
    const mediaCaption = document.getElementById('flashMediaCaption');
    const sheetDesigns = document.getElementById('sheetDesigns');
    const sheetDesignList = document.getElementById('sheetDesignList');
    let currentRecord = null;
    const selectedSheetDesigns = new Set();

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const normalizePath = (value) => {
      try { return new URL(String(value || ''), location.origin).pathname.replace(/\/+$/, '') || '/'; }
      catch { return String(value || '').replace(/\/+$/, ''); }
    };
    const titleCase = (value) => String(value || '').replace(/[_-]+/g,' ').replace(/\b\w/g,(letter)=>letter.toUpperCase());
    const routeParts = location.pathname.split('/').filter(Boolean);
    const routeReference = decodeURIComponent(routeParts[2] === 'detail' ? new URLSearchParams(location.search).get('slug') || '' : routeParts[2] || '');

    function styleLabels(record = {}) {
      const values = Array.isArray(record.styles) && record.styles.length
        ? record.styles
        : [record.primaryStyle || record.primary_style];
      const supplied = Array.isArray(record.styleLabels)
        ? record.styleLabels
        : (Array.isArray(record.style_labels) ? record.style_labels : []);
      const labels = [];
      values.forEach((rawValue, index) => {
        const value = String(rawValue || '').trim();
        const primaryValue = record.primaryStyle || record.primary_style;
        const primaryLabel = record.primaryStyleLabel || record.primary_style_label;
        const label = String(supplied[index] || (value === primaryValue ? primaryLabel : '') || titleCase(value)).trim();
        if (!value || value.toLowerCase() === 'unclassified' || label.toLowerCase() === 'unclassified' || labels.includes(label)) return;
        labels.push(label);
      });
      if (!values.some(Boolean)) supplied.forEach((rawLabel) => {
        const label = String(rawLabel || '').trim();
        if (label && label.toLowerCase() !== 'unclassified' && !labels.includes(label)) labels.push(label);
      });
      return labels;
    }

    function staticRecord(item) {
      return {
        id:item.id,slug:item.slug||item.id,title:item.title,description:item.description,state:String(item.status||'').toLowerCase()==='available'?'available':'retired',claimable:item.claimable?1:0,
        series_id:item.series,size_bucket:item.sizeBucket,price_label:item.price,item_type:String(item.type||'').toLowerCase(),sheet_code:item.sheetCode,design_code:item.designCode,
        styles:Array.isArray(item.styles)?item.styles:[],styleLabels:Array.isArray(item.styleLabels)?item.styleLabels:[],primaryStyle:item.primaryStyle,primaryStyleLabel:item.primaryStyleLabel,
        session_category:item.sessionCategory,split_policy:item.splitPolicy,session_plan_note:item.sessionPlanNote,legacy_path:`/tattoos/flash/${item.id}/`,media:item.image?[{url:item.image,alt:item.title}]:[]
      };
    }

    function resolve(records) {
      const path = normalizePath(location.pathname);
      const reference = routeReference.toLowerCase();
      return records.find((record) =>
        String(record.id || '').toLowerCase() === reference ||
        String(record.slug || '').toLowerCase() === reference ||
        normalizePath(record.legacy_path) === path
      );
    }

    function row(label, value) {
      if (!value) return '';
      return `<div class="meta-row"><span class="meta-label">${escapeHtml(label)}</span><span class="meta-value">${escapeHtml(value)}</span></div>`;
    }

    function sessionLabel(record) {
      const plan = record.artistSessionPlan || {};
      const category = String(plan.category || record.session_category || 'artist_review').replace(/_/g,' ');
      const minimum = plan.estimatedSessionsMin ?? record.estimated_sessions_min;
      const maximum = plan.estimatedSessionsMax ?? record.estimated_sessions_max;
      const note = plan.note || record.session_plan_note;
      const estimate = [minimum && `${minimum}${maximum && maximum !== minimum ? `-${maximum}` : ''} sessions`, note].filter(Boolean).join(' - ');
      return [titleCase(category), estimate].filter(Boolean).join(' - ');
    }

    function renderMedia(record) {
      const media = (Array.isArray(record.media) ? record.media : []).filter((item) => item && item.url);
      const image = document.getElementById('flashImage');
      const figure = image.closest('figure');
      mediaGallery.replaceChildren();
      mediaGallery.hidden = media.length <= 1;
      mediaCaption.hidden = true;
      mediaCaption.textContent = '';
      if (!media.length) {
        image.removeAttribute('src');
        image.alt = '';
        figure.hidden = true;
        return;
      }
      figure.hidden = false;
      const selectMedia = (index, focus = false) => {
        const selected = media[index] || media[0];
        image.src = selected.url;
        image.alt = selected.alt || record.title || 'Art.Pill flash design';
        mediaCaption.textContent = selected.caption || '';
        mediaCaption.hidden = !selected.caption;
        [...mediaGallery.children].forEach((button, buttonIndex) => button.setAttribute('aria-pressed', String(buttonIndex === index)));
        const active = mediaGallery.children[index];
        if (active) {
          active.scrollIntoView({ block:'nearest', inline:'nearest' });
          if (focus) active.focus();
        }
      };
      media.forEach((item, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'media-thumb';
        button.setAttribute('aria-label', `View image ${index + 1} of ${media.length}${item.caption ? `: ${item.caption}` : ''}`);
        button.setAttribute('aria-pressed', String(index === 0));
        const thumb = document.createElement('img');
        thumb.src = item.url;
        thumb.alt = '';
        thumb.loading = 'lazy';
        button.appendChild(thumb);
        button.addEventListener('click', () => selectMedia(index));
        button.addEventListener('keydown', (event) => {
          if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
          event.preventDefault();
          const next = event.key === 'Home' ? 0 : event.key === 'End' ? media.length - 1 : (index + (event.key === 'ArrowLeft' ? -1 : 1) + media.length) % media.length;
          selectMedia(next, true);
        });
        mediaGallery.appendChild(button);
      });
      selectMedia(0);
    }

    function syncClaimLink() {
      const managed = Boolean(currentRecord && (currentRecord.sheetDesigns || currentRecord.sheet_designs || []).length);
      const selectable = !managed || selectedSheetDesigns.size > 0;
      const enabled = acknowledgement.checked && selectable;
      claimLink.setAttribute('aria-disabled', String(!enabled));
      claimLink.tabIndex = enabled ? 0 : -1;
      if (!currentRecord) return;
      const url = new URL('/tattoos/flash/claim/', location.origin);
      url.searchParams.set('design', currentRecord.id);
      selectedSheetDesigns.forEach((id) => url.searchParams.append('sheetDesign', id));
      claimLink.href = `${url.pathname}${url.search}`;
    }

    function renderSheetDesigns(record) {
      const designs = record.sheetDesigns || record.sheet_designs || [];
      selectedSheetDesigns.clear();
      sheetDesignList.replaceChildren();
      sheetDesigns.hidden = !designs.length;
      designs.forEach((design) => {
        const available = design.claimableNow === true || design.claimable_now === true;
        const label = document.createElement('label');
        label.className = `sheet-design-row${available ? '' : ' is-unavailable'}`;
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = design.id;
        input.disabled = !available;
        input.setAttribute('aria-label', `${design.code}: ${design.label}`);
        input.addEventListener('change', () => {
          if (input.checked) selectedSheetDesigns.add(design.id);
          else selectedSheetDesigns.delete(design.id);
          syncClaimLink();
        });
        label.append(
          input,
          Object.assign(document.createElement('span'), { className:'sheet-design-code', textContent:design.code }),
          Object.assign(document.createElement('span'), { textContent:design.label }),
          Object.assign(document.createElement('span'), { className:'sheet-design-state', textContent:available ? 'Available' : titleCase(design.state) })
        );
        sheetDesignList.appendChild(label);
      });
    }

    function render(record, authoritative = false) {
      currentRecord = record;
      let canonicalPath = `/tattoos/flash/${encodeURIComponent(record.slug || record.id)}/`;
      try {
        const managedCanonical = new URL(record.canonicalRoute || record.canonical_route || '', location.origin);
        if (managedCanonical.origin === location.origin && managedCanonical.pathname.startsWith('/tattoos/flash/')) canonicalPath = managedCanonical.pathname;
      } catch {}
      canonical.href = new URL(canonicalPath, location.origin).href;
      if (normalizePath(location.pathname) !== normalizePath(canonicalPath)) history.replaceState(history.state, '', canonicalPath);
      document.title = `${record.title || 'Flash'} - Art.Pill Tattoo House`;
      renderMedia(record);
      document.getElementById('flashKicker').textContent = record.series_id ? `${titleCase(record.series_id)} series` : 'Art.Pill flash';
      document.getElementById('flashTitle').textContent = record.title || 'Untitled flash';
      document.getElementById('flashDescription').textContent = record.description || 'A managed Art.Pill flash record.';
      renderSheetDesigns(record);
      document.getElementById('flashMeta').innerHTML = [
        row('Code', record.design_code || record.sheet_code || record.id),
        row('Size', record.size_bucket),
        row('Pricing', record.pricingNote || record.pricing_note || record.price_label),
        row('Format', titleCase(record.item_type)),
        row('Styles', styleLabels(record).join(' · ')),
        row('Session plan', sessionLabel(record))
      ].join('');
      const managedClaimable = typeof record.claimableNow === 'boolean'
        ? record.claimableNow
        : (typeof record.claimable_now === 'boolean' ? record.claimable_now : null);
      const claimabilityReady = authoritative && managedClaimable !== null;
      const available = claimabilityReady && managedClaimable === true;
      const availability = document.getElementById('availability');
      if (!claimabilityReady) availability.innerHTML = '<strong>Availability temporarily unavailable</strong>This preview is read-only because current managed claimability could not be confirmed. Return to the catalog or contact the Studio before taking a next step.';
      else if (available) availability.innerHTML = '<strong>Available for claim</strong>Complete the acknowledgement below to continue into studio review.';
      else if (String(record.state).toLowerCase() === 'reserved') availability.innerHTML = '<strong>Reserved</strong>This design is currently held and cannot accept another claim.';
      else availability.innerHTML = '<strong>Past work / unavailable</strong>This record remains visible as part of the flash archive, but it cannot be claimed.';
      claimControls.hidden = !available;
      syncClaimLink();
      loading.hidden = true;
      detail.hidden = false;
    }

    acknowledgement.addEventListener('change', () => {
      syncClaimLink();
    });
    claimLink.tabIndex = -1;

    (async () => {
      if (!routeReference) throw new Error('not found');
      const response = await fetch(`/api/flash/${encodeURIComponent(routeReference)}`,{headers:{accept:'application/json'},cache:'no-store'});
      const payload = await response.json().catch(()=>({}));
      if (!response.ok || !payload.record) throw new Error(payload.error || 'Managed flash record unavailable');
      render(payload.record, true);
    })().catch(async () => {
      try {
        const response = await fetch('/assets/flash/flash-catalog.json',{cache:'no-store'});
        const fallback = response.ok ? await response.json() : {items:[]};
        const record = resolve((fallback.items || []).map(staticRecord));
        if (!record) throw new Error('not found');
        render(record, false);
      } catch {
        loading.setAttribute('role','alert');
        loading.innerHTML = '<p class="kicker">Flash record</p><h1>This design is not available.</h1><p>It may be unpublished, archived, or the address may be incorrect. <a href="/tattoos/flash/" style="color:var(--focus);text-decoration:underline">Return to the flash catalog.</a></p>';
      }
    });
  })();
  </script>
  <script src="/js/transition.js"></script>
  <script src="/js/construct-corner.js"></script>
  <script src="/js/construct-nav.js"></script>
</body>
</html>
