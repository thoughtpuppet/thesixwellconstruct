<style>
  :root {
    --bg:         #0e0e0e;
    --bg-raised:  #111111;

    --accent:     #FCB867;
    --venture-color: var(--color-tattooing);
    --venture-accent: var(--color-tattooing);

    --ring:       #6D3D15;
    --ring-soft:  rgba(109,61,21,0.4);
    --ring-faint: rgba(109,61,21,0.18);

    --text:       var(--color-body, #FBD19D);
    --text-mute:  var(--color-text-muted, rgba(251,209,157,0.66));
    --text-dim:   var(--color-text-dim, rgba(251,209,157,0.38));
    --text-ghost: var(--color-text-ghost, rgba(251,209,157,0.16));

    --sans:  'Inter',Arial,sans-serif;
    --serif: Georgia,'Times New Roman',Times,serif;

    --s1:4px; --s2:8px; --s3:12px; --s4:16px;
    --s5:24px; --s6:40px; --s7:64px; --s8:96px;

    --t-fast: 0.18s cubic-bezier(0.2,0,0.2,1);
    --t-med:  0.35s cubic-bezier(0.2,0,0.2,1);
    --t-slow: 0.5s  cubic-bezier(0.22,1,0.36,1);

  }

  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body {
    background:var(--bg); color:var(--text);
    font-family:var(--serif);
    min-height:100vh; overflow-x:clip;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  a { color:inherit; text-decoration:none; }
  button { background:none; border:none; color:inherit; font:inherit; cursor:pointer; }

  .grain {
    position:fixed; inset:0; z-index:1; pointer-events:none;
    opacity:0.035; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ── Header ───────────────────────────────────────────────── */
  header.top {
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:flex-end;
    padding:var(--s5) var(--s6);
  }
.nav-inquire {
    font-family:var(--sans); font-weight:700; font-size:11px;
    letter-spacing:0.18em; text-transform:uppercase;
    color:var(--venture-color); border:5px solid rgba(110,4,4,0.4);
    padding:8px 16px;
    transition:background var(--t-fast), border-color var(--t-fast);
  }
  .nav-inquire:hover { background:rgba(110,4,4,0.06); border-color:var(--venture-color); }

  /* ── Main ─────────────────────────────────────────────────── */
  main {
    position:relative; z-index:2;
    max-width:1440px; margin:0 auto;
    padding:var(--s8) var(--s6) var(--s7);
  }

  /* ── Intro ────────────────────────────────────────────────── */
  .intro {
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:var(--s6); margin-bottom:var(--s8);
  }
  .intro-left {
    display:flex; flex-direction:column; align-items:flex-start;
  }
  .intro-desc {
    transition:opacity 0.2s ease;
  }

  /* ── Filters ──────────────────────────────────────────────── */
  nav.filters { margin-bottom:var(--s6); }
  .filter-row {
    display:flex; align-items:center;
    gap:var(--s5); flex-wrap:wrap;
    padding-bottom:var(--s4);
  }
  .filter-row + .filter-row { padding-top:var(--s2); padding-bottom:var(--s5); }

  .chip {
    position:relative;
    font-family:var(--sans); font-weight:500;
    font-size:13px; letter-spacing:0.04em;
    text-transform:lowercase; color:var(--text-mute);
    padding:var(--s2) 0;
    transition:color var(--t-fast);
  }
  .chip:hover { color:var(--text); }
  .chip.active { color:var(--text); }
  .chip.active .chip-label::after {
    content:"";
    position:absolute; left:0; bottom:-1px;
    width:100%; height:2px;
    background:var(--venture-color);
  }
  .chip.active::before {
    content:"";
    position:absolute; left:-10px; top:50%;
    width:4px; height:4px; border-radius:50%;
    background:var(--venture-color);
    transform:translateY(-50%);
  }
  .chip-label { position:relative; }
  .chip-count {
    font-family:var(--serif); font-size:10px;
    color:var(--text-dim); margin-left:2px;
    vertical-align:super;
  }

  /* ── Section heading ──────────────────────────────────────── */
  .medium-heading {
    font-family:var(--serif);
    font-size:10px; letter-spacing:0.35em;
    text-transform:uppercase; color:var(--text-dim);
    margin-bottom:var(--s5);
  }

  .catalog-state { border:5px solid var(--ring-faint); padding:var(--s6); color:var(--text-mute); font-family:var(--sans); font-size:12px; line-height:1.7; }
  .catalog-state a { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }

  /* ── Overlay ──────────────────────────────────────────────── */
  #work-overlay {
    position:fixed; inset:0; z-index:200;
    background:rgba(14,14,14,0.97);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; visibility:hidden;
    transition:opacity var(--t-slow), visibility 0s linear .5s;
  }
  #work-overlay.open { opacity:1; pointer-events:all; visibility:visible; transition-delay:0s; }

  .overlay-close {
    position:fixed; top:var(--s6); right:var(--s6);
    font-family:var(--serif); font-size:20px;
    color:var(--text-mute); z-index:201;
    padding:var(--s2);
    transition:color var(--t-fast);
  }
  .overlay-close:hover { color:var(--text); }

  .overlay-inner {
    display:grid;
    grid-template-columns:1fr 360px;
    gap:var(--s7);
    width:88vw; max-width:1100px;
    max-height:90vh;
    align-items:center;
  }
  .overlay-image-wrap {
    height:78vh; max-height:680px;
    display:flex; align-items:center; justify-content:center;
  }
  .overlay-image-wrap img {
    max-width:100%; max-height:100%;
    object-fit:contain; display:block;
    transform:scale(0.97); opacity:0;
    transition:
      transform var(--t-slow) 0.1s,
      opacity   var(--t-slow) 0.1s;
  }
  #work-overlay.open .overlay-image-wrap img {
    transform:scale(1); opacity:1;
  }
  .overlay-details {
    transform:translateX(10px); opacity:0;
    transition:
      transform var(--t-slow) 0.2s,
      opacity   var(--t-slow) 0.2s;
  }
  #work-overlay.open .overlay-details {
    transform:translateX(0); opacity:1;
  }
  .overlay-rule {
    width:24px; height:2px;
    background:var(--venture-color);
    margin-bottom:var(--s5);
  }
  .overlay-title {
    font-family:var(--sans); font-weight:900;
    font-size:clamp(28px,4vw,48px);
    letter-spacing:-0.03em; line-height:0.92;
    color:var(--text);
    margin-bottom:var(--s4);
  }
  .overlay-subtitle {
    font-family:var(--serif);
    font-size:13px; font-style:italic;
    color:var(--text-mute); letter-spacing:0.04em;
    margin-bottom:var(--s5);
  }
  .overlay-tags {
    display:flex; flex-wrap:wrap; gap:var(--s2);
    margin-bottom:var(--s5);
  }
  .overlay-tag {
    font-family:var(--serif);
    font-size:10px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--venture-color);
    border:5px solid rgba(110,4,4,0.3);
    padding:var(--s1) var(--s3);
  }
  .overlay-fragment {
    font-family:var(--serif);
    font-size:14px; line-height:1.65; font-style:italic;
    color:var(--color-text-muted, rgba(251,209,157,0.66));
    border-left:5px solid rgba(110,4,4,0.35);
    padding-left:var(--s4);
    margin-bottom:var(--s6);
  }
  .overlay-inquire-link {
    display:inline-flex; align-items:center; gap:var(--s2);
    font-family:var(--serif);
    font-size:11px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--venture-color);
    opacity:0.75;
    transition:opacity var(--t-fast);
  }
  .overlay-inquire-link::after { content:'→'; }
  .overlay-inquire-link:hover { opacity:1; }

  /* ── Footer ───────────────────────────────────────────────── */
  footer.bottom {
    position:relative; z-index:2;
    padding:var(--s7) var(--s6);
    border-top:5px solid var(--ring-faint);
    display:flex; justify-content:space-between; align-items:center;
    margin-top:var(--s8);
  }
  footer.bottom p, footer.bottom a {
    font-family:var(--serif); font-size:10px;
    letter-spacing:0.22em; color:var(--text-dim); text-transform:uppercase;
  }
  footer.bottom a { color:var(--text-mute); transition:color var(--t-fast); }
  footer.bottom a:hover { color:var(--accent); }

  /* ── Responsive ───────────────────────────────────────────── */
  @media (max-width:900px) {
    main { padding:var(--s7) var(--s5); }
    header.top { padding:var(--s4) var(--s5); }
    .overlay-inner {
      grid-template-columns:1fr;
      overflow-y:auto;
      gap:var(--s5);
      padding:var(--s7) var(--s5) var(--s6);
      align-items:flex-start;
    }
    .overlay-image-wrap {
      height:55vw; min-height:200px; max-height:340px;
    }
  }
  @media (max-width:640px) {
    .intro { flex-direction:column; align-items:flex-start; gap:var(--s4); }
    .intro-desc { text-align:left; max-width:380px; }
  }
  @media (max-width:700px) {
    header.top { padding:var(--s3) var(--s4); min-height:60px; }
  }
</style>

  <script>
  (() => {
    if (window.PortfolioDetailExperience) {
      window.PortfolioDetailExperience.start();
      return;
    }
    const STYLE_LABELS = {
      symbolic: 'symbolic',
      surreal: 'surreal',
      mythic: 'mythic',
      'special-project': 'special projects',
    };
    const COLLECTION_LABELS = {};
    const optionLabel = (kind, value) => {
      if (kind === 'style' && String(value || '').trim().toLowerCase() === 'unclassified') return '';
      return kind === 'style' ? (STYLE_LABELS[value] || value) : (COLLECTION_LABELS[value] || value);
    };
    const DEFAULT_ALT = 'Tattoo portfolio work by Saiel Dauhn Solehman';
    const grid = document.getElementById('gridTattoo');
    const typeRow = document.getElementById('typeRow');
    const collectionRow = document.getElementById('modeRow');
    const introDesc = document.getElementById('introDesc');
    const overlay = document.getElementById('work-overlay');
    const overlayImg = document.getElementById('overlayImg');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySubtitle');
    const overlayTags = document.getElementById('overlayTags');
    const overlayFrag = document.getElementById('overlayFragment');
    const closeBtn = document.getElementById('overlayCloseBtn');
    let items = [];
    let failedIds = new Set();
    let activeStyle = '';
    let activeCollection = '';
    let returnFocus = null;

    function chip(label, count, active, onClick) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `chip${active ? ' active' : ''}`;
      button.setAttribute('aria-pressed', String(active));
      button.innerHTML = `<span class="chip-label">${escapeText(label)}</span><span class="chip-count">${count}</span>`;
      button.addEventListener('click', onClick);
      return button;
    }

    function escapeText(value) {
      const span = document.createElement('span');
      span.textContent = String(value || '');
      return span.innerHTML;
    }

    function itemStyleEntries(item) {
      const values = Array.isArray(item?.styles) && item.styles.length ? item.styles : [item?.primaryStyle];
      const supplied = Array.isArray(item?.styleLabels) ? item.styleLabels : [];
      const seen = new Set();
      const entries = values.map((rawValue, index) => {
        const value = String(rawValue || '').trim();
        const label = String(supplied[index] || (value === item?.primaryStyle ? item?.primaryStyleLabel : '') || optionLabel('style', value) || value).trim();
        return { value, label };
      }).filter(({ value, label }) => {
        const key = value.toLowerCase();
        if (!value || key === 'unclassified' || label.toLowerCase() === 'unclassified' || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      if (!entries.length && !values.some(Boolean)) {
        supplied.forEach((rawLabel) => {
          const label = String(rawLabel || '').trim();
          const key = label.toLowerCase();
          if (label && key !== 'unclassified' && !seen.has(key)) { seen.add(key); entries.push({ value: label, label }); }
        });
      }
      return entries;
    }

    function itemStyleValues(item) { return itemStyleEntries(item).map((entry) => entry.value); }
    function itemStyleLabels(item) { return itemStyleEntries(item).map((entry) => entry.label); }
    function itemHasStyle(item, style) { return !style || itemStyleValues(item).includes(style); }

    function renderedItems() {
      return items.filter((item) => !failedIds.has(item.id));
    }

    function visibleItems() {
      return renderedItems().filter((item) =>
        itemHasStyle(item, activeStyle) &&
        (!activeCollection || item.collection === activeCollection)
      );
    }

    function renderFilters() {
      const available = renderedItems();
      const styleEntries = available.flatMap(itemStyleEntries);
      styleEntries.forEach(({ value, label }) => { if (!STYLE_LABELS[value]) STYLE_LABELS[value] = label; });
      const styles = [...new Set(styleEntries.map((entry) => entry.value))];
      const collections = [...new Set(available.map((item) => item.collection).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b));
      if (activeStyle && !styles.includes(activeStyle)) activeStyle = '';
      if (activeCollection && !collections.includes(activeCollection)) activeCollection = '';
      typeRow.replaceChildren();
      typeRow.appendChild(chip('all', available.length, !activeStyle && !activeCollection, () => {
        activeStyle = ''; activeCollection = ''; render();
      }));
      styles.forEach((style) => {
        const count = available.filter((item) => itemHasStyle(item, style)).length;
        typeRow.appendChild(chip(optionLabel('style', style), count, activeStyle === style, () => {
          activeStyle = activeStyle === style ? '' : style;
          render();
        }));
      });
      collectionRow.replaceChildren();
      collections.forEach((collection) => {
        const count = available.filter((item) => item.collection === collection && itemHasStyle(item, activeStyle)).length;
        if (!count) return;
        collectionRow.appendChild(chip(optionLabel('collection', collection), count, activeCollection === collection, () => {
          activeCollection = activeCollection === collection ? '' : collection;
          render();
        }));
      });
    }

    function itemInfo(item) {
      return [item.year, item.placement].filter(Boolean).join(' / ');
    }

    function openOverlay(item, trigger, historyMode = 'push') {
      returnFocus = trigger;
      overlayImg.src = item.imageUrl;
      overlayImg.alt = item.altText || DEFAULT_ALT;
      overlayTitle.textContent = item.title || 'Tattoo work';
      overlaySub.textContent = itemInfo(item);
      overlaySub.style.display = itemInfo(item) ? '' : 'none';
      overlayTags.replaceChildren();
      [...itemStyleLabels(item), optionLabel('collection', item.collection)].filter(Boolean).forEach((label) => {
        const tag = document.createElement('span');
        tag.className = 'overlay-tag';
        tag.textContent = label;
        overlayTags.appendChild(tag);
      });
      overlayFrag.textContent = item.caption || '';
      overlayFrag.style.display = item.caption ? '' : 'none';
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      if (historyMode === 'push') {
        const url = new URL(location.href);
        url.searchParams.set('work', item.id);
        history.pushState({ portfolioWork: item.id }, '', url);
      }
      closeBtn.focus();
    }

    function closeOverlay(historyMode = 'back') {
      if (!overlay.classList.contains('open')) return;
      overlay.classList.remove('open');
      document.body.style.overflow = '';
      overlayImg.src = '';
      returnFocus?.focus();
      returnFocus = null;
      if (historyMode === 'back' && new URL(location.href).searchParams.has('work')) history.back();
    }

    function renderCards() {
      const visible = visibleItems();
      grid.replaceChildren();
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'catalog-state';
        empty.textContent = renderedItems().length ? 'No work is available in this filter.' : 'Portfolio images are temporarily unavailable.';
        grid.appendChild(empty);
        return;
      }
      visible.forEach((item) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'work-card';
        card.setAttribute('aria-label', `View ${item.title || 'tattoo portfolio work'}`);
        const image = document.createElement('img');
        image.src = item.imageUrl;
        image.alt = item.altText || DEFAULT_ALT;
        image.loading = 'lazy';
        image.addEventListener('error', () => {
          if (failedIds.has(item.id)) return;
          failedIds.add(item.id);
          render();
        });
        const badge = document.createElement('span');
        badge.className = 'work-badge';
        badge.textContent = 'art.pill';
        const meta = document.createElement('span');
        meta.className = 'work-meta';
        const title = document.createElement('span');
        title.className = 'work-title';
        title.textContent = item.title || 'Tattoo work';
        meta.appendChild(title);
        const info = itemInfo(item);
        if (info) {
          const details = document.createElement('span');
          details.className = 'work-info';
          details.textContent = info;
          meta.appendChild(details);
        }
        card.append(image, badge, meta);
        card.addEventListener('click', () => openOverlay(item, card));
        grid.appendChild(card);
      });
    }

    function render() {
      renderFilters();
      renderCards();
      const selection = activeCollection ? optionLabel('collection', activeCollection) : (activeStyle ? optionLabel('style', activeStyle) : '');
      introDesc.textContent = selection ? `${selection} / tattoo work by Saiel Dauhn Solehman` : 'tattoo work by Saiel Dauhn Solehman';
    }

    closeBtn.addEventListener('click', () => closeOverlay());
    overlay.addEventListener('click', (event) => { if (event.target === overlay) closeOverlay(); });
    document.addEventListener('keydown', (event) => {
      if (!overlay.classList.contains('open')) return;
      if (event.key === 'Escape') closeOverlay();
      if (event.key === 'Tab') {
        const focusable = [...overlay.querySelectorAll('button,a[href]')];
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });
    window.addEventListener('popstate', () => {
      const requested = new URL(location.href).searchParams.get('work');
      const item = items.find((candidate) => candidate.id === requested);
      if (item) openOverlay(item, null, 'none');
      else closeOverlay('none');
    });

    fetch('/api/portfolio', { headers: { accept: 'application/json' } })
      .then(async (response) => {
        if (!response.ok) throw new Error();
        const payload = await response.json();
        (payload.options?.styles || []).forEach((option) => { STYLE_LABELS[option.value] = option.label; });
        (payload.options?.collections || []).forEach((option) => { COLLECTION_LABELS[option.value] = option.label; });
        items = Array.isArray(payload.items) ? payload.items : [];
        render();
        const requested = new URL(location.href).searchParams.get('work');
        const item = items.find((candidate) => candidate.id === requested);
        if (item) openOverlay(item, null, 'none');
      })
      .catch(() => {
        typeRow.replaceChildren();
        collectionRow.replaceChildren();
        grid.innerHTML = '<div class="catalog-state" role="alert">The portfolio is temporarily unavailable. <a href="/tattoos/inquire/">Send an inquiry</a> and we will share current work directly.</div>';
      });
  })();
  </script>

  <script>
  (() => {
    const styleRow = document.getElementById('typeRow');
    const collectionRow = document.getElementById('modeRow');
    if (!styleRow || !collectionRow) return;

    function numericCount(button) {
      const value = Number(button?.querySelector('.chip-count')?.textContent || '');
      return Number.isFinite(value) ? value : -1;
    }

    function hideRedundantUnclassified() {
      const allButton = [...styleRow.querySelectorAll('.chip')].find((button) =>
        button.querySelector('.chip-label')?.textContent.trim().toLowerCase() === 'all'
      );
      const unclassified = [styleRow, collectionRow]
        .flatMap((row) => [...row.querySelectorAll('.chip')])
        .find((button) => button.querySelector('.chip-label')?.textContent.trim().toLowerCase() === 'unclassified');
      if (!unclassified) return;
      const redundant = numericCount(allButton) >= 0 && numericCount(unclassified) === numericCount(allButton);
      unclassified.hidden = redundant;
      unclassified.setAttribute('aria-hidden', String(redundant));
      const hostRow = unclassified.closest('.filter-row');
      if (hostRow) hostRow.hidden = redundant && [...hostRow.querySelectorAll('.chip')].every((button) => button.hidden);
    }

    const observer = new MutationObserver(hideRedundantUnclassified);
    observer.observe(styleRow, { childList:true, subtree:true });
    observer.observe(collectionRow, { childList:true, subtree:true });
    hideRedundantUnclassified();
  })();
  </script>
