<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Inquiry Received - Art.Pill Tattoo House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/transitions.css">
<style>
  :root {
    --bg:#0e0e0e; --accent:#FCB867; --signal:#8F231D; --ring:#6D3D15;
    --ring-soft:rgba(109,61,21,0.4); --ring-faint:rgba(109,61,21,0.18);
    --text:#FFE7CA; --text-mute:rgba(255,231,202,0.62); --text-dim:rgba(255,231,202,0.38);
    --sans:'Inter','Helvetica Neue',Arial,sans-serif; --serif:Georgia,'Times New Roman',Times,serif;
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--bg); color:var(--text); font-family:var(--serif); min-height:100vh; -webkit-font-smoothing:antialiased; }
  body { display:grid; place-items:center; padding:32px; }
  main { width:min(100%,720px); border:5px solid var(--ring-soft); padding:44px 38px; }
  .label { font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--signal); margin-bottom:18px; }
  h1 { font-family:var(--sans); font-weight:900; font-size:clamp(34px,7vw,74px); line-height:0.9; letter-spacing:-0.05em; color:var(--accent); text-transform:uppercase; margin-bottom:28px; }
  p { font-size:15px; line-height:1.75; color:var(--text-mute); margin-bottom:18px; }
  a { display:inline-flex; min-height:50px; align-items:center; justify-content:center; border:5px solid var(--ring-soft); background:transparent; color:var(--text-mute); padding:0 24px; font-family:var(--sans); font-weight:700; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; text-decoration:none; margin-top:12px; }
  a:hover { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body data-venture="tattooing">
  <main>
    <p class="label">Art.Pill Tattoo House</p>
    <h1>Inquiry Received.</h1>
    <p>Your submission was captured for review. This is not a booking confirmation.</p>
    <p>If the project is approved, you will receive a private Acuity booking link and next steps.</p>
    <a href="/tattoos/">Return to Art.Pill</a>
  </main>
  <script src="/js/transition.js"></script>
  <script src="/js/construct-corner.js"></script>
</body>
</html>
