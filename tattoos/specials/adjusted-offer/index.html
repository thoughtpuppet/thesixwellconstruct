<body class="tattoo-flow" data-venture="tattooing" data-landing-family="tattoo-service">
  <header class="adjusted-offer-header"><span data-copy-id="live-tattoos-specials-adjusted-offer-span-1">Private client response</span></header>
  <main class="adjusted-offer-main">
    <section class="landing-hero site-hero site-hero--landing adjusted-offer-hero">
      <div><h1 class="hero-title" data-copy-id="live-tattoos-specials-adjusted-offer-h1-1">ADJUSTED OFFER.</h1></div>
      <p class="hero-descriptor" data-copy-id="live-tattoos-specials-adjusted-offer-p-1">Review the Studio's adjusted tattoo rate and choose whether you would like to continue.</p>
    </section>

    <section class="adjusted-offer-card" id="offerCard" aria-live="polite">
      <p class="adjusted-offer-kicker" id="offerKicker" data-copy-id="live-tattoos-specials-adjusted-offer-p-2">Private offer</p>
      <h2 id="offerTitle" data-copy-id="live-tattoos-specials-adjusted-offer-h2-1">Loading your adjusted offer.</h2>
      <p class="adjusted-offer-copy" id="offerCopy" data-copy-id="live-tattoos-specials-adjusted-offer-p-3">Checking this private response link.</p>
      <div id="offerDetails" hidden>
        <p class="adjusted-offer-price" id="offerPrice"></p>
        <p class="adjusted-offer-note" id="offerNote" hidden></p>
        <p class="adjusted-offer-deadline" id="offerDeadline"></p>
        <div class="adjusted-offer-actions" id="offerActions">
          <button type="button" id="acceptOffer" data-copy-id="live-tattoos-specials-adjusted-offer-button-1">Accept Adjusted Rate</button>
          <button type="button" class="adjusted-offer-decline" id="declineOffer" data-copy-id="live-tattoos-specials-adjusted-offer-button-2">Decline</button>
        </div>
      </div>
      <p class="adjusted-offer-status" id="offerStatus" role="status"></p>
    </section>
  </main>
  <footer class="adjusted-offer-footer"><p data-copy-id="live-tattoos-specials-adjusted-offer-p-8">© art.pill Tattoo House · the six.well construct</p></footer>
