<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Adjusted Offer · art.pill Tattoo House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/transitions.css">
  <link rel="stylesheet" href="/css/landing-family.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <link rel="stylesheet" href="/css/site-typography.css">
  <link rel="stylesheet" href="/css/hero.css">
  <link rel="stylesheet" href="/css/tattoo-adjusted-offer.css">
</head>
<body class="tattoo-flow" data-venture="tattooing" data-landing-family="tattoo-service">
  <header class="adjusted-offer-header"><span>Private client response</span></header>
  <main class="adjusted-offer-main">
    <section class="landing-hero site-hero site-hero--landing adjusted-offer-hero">
      <div><h1 class="hero-title">ADJUSTED OFFER.</h1></div>
      <p class="hero-descriptor">Review the Studio's adjusted tattoo rate and choose whether you would like to continue.</p>
    </section>

    <section class="adjusted-offer-card" id="offerCard" aria-live="polite">
      <p class="adjusted-offer-kicker" id="offerKicker">Private offer</p>
      <h2 id="offerTitle">Loading your adjusted offer.</h2>
      <p class="adjusted-offer-copy" id="offerCopy">Checking this private response link.</p>
      <div id="offerDetails" hidden>
        <p class="adjusted-offer-price" id="offerPrice"></p>
        <p class="adjusted-offer-note" id="offerNote" hidden></p>
        <p class="adjusted-offer-deadline" id="offerDeadline"></p>
        <div class="adjusted-offer-actions" id="offerActions">
          <button type="button" id="acceptOffer">Accept Adjusted Rate</button>
          <button type="button" class="adjusted-offer-decline" id="declineOffer">Decline</button>
        </div>
      </div>
      <p class="adjusted-offer-status" id="offerStatus" role="status"></p>
    </section>
  </main>
  <footer class="adjusted-offer-footer"><p>© art.pill Tattoo House · the six.well construct</p></footer>
  <script src="/js/tattoo-adjusted-offer.js"></script>
  <script src="/js/transition.js"></script>
  <script src="/js/construct-corner.js"></script>
  <script src="/js/construct-nav.js"></script>
</body>
</html>
