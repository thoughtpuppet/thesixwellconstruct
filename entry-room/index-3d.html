<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120c07">
<title>entry room 3d - the six.well construct</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0806;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
  }

  #entry-root {
    --art-w: 3840;
    --art-h: 2160;
    --core-left: 25.78125%;
    --core-top: 0%;
    --core-width: 74.21875%;
    --core-height: 100%;
    position: fixed;
    inset: 0;
    background: #0b0806;
  }

  @media (max-aspect-ratio: 3/4) {
    #entry-root {
      --art-w: 2160;
      --art-h: 3840;
      --core-left: 0%;
      --core-top: 35.4166667%;
      --core-width: 100%;
      --core-height: 42.6302083%;
    }
  }

  #art-stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: max(100vw, calc(100vh * var(--art-w) / var(--art-h)));
    height: max(100vh, calc(100vw * var(--art-h) / var(--art-w)));
    transform: translate(-50%, -50%);
    overflow: hidden;
  }

  #room-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #room-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    pointer-events: none;
  }

  #entry-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    z-index: 2;
  }

  #frame-stage {
    position: absolute;
    left: var(--core-left);
    top: var(--core-top);
    width: var(--core-width);
    height: var(--core-height);
    z-index: 3;
    pointer-events: none;
  }

  body.is-calibrating #frame-stage::after {
    content: "SOCKET / IMAGE ANCHOR FRAME";
    position: absolute;
    inset: 0;
    z-index: 3;
    border: 1px solid rgba(0, 229, 255, 0.72);
    box-shadow:
      inset 0 0 0 1px rgba(0, 0, 0, 0.35),
      0 0 24px rgba(0, 229, 255, 0.14);
    pointer-events: none;
    color: rgba(0, 229, 255, 0.86);
    font: 700 9px/1 Arial, sans-serif;
    letter-spacing: 0.14em;
    text-indent: 8px;
    padding-top: 7px;
    white-space: nowrap;
  }

  #entry-root.is-dragging #entry-canvas { cursor: grabbing; }

  #entry-overlays {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
  }

  #wrong-shape-flash {
    font-family: Arial, sans-serif;
    font-weight: 700;
    line-height: 1;
    text-transform: uppercase;
    user-select: none;
  }

  #wrong-shape-flash {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(235, 12, 0, 0);
    font-size: clamp(220px, 42vw, 760px);
    letter-spacing: -0.06em;
    opacity: 0;
    transform: scale(0.82);
    text-shadow:
      0 0 26px rgba(235, 12, 0, 0.22),
      0 0 80px rgba(235, 12, 0, 0.14);
  }

  #wrong-shape-flash.is-flashing {
    animation: wrong-shape-flash 420ms ease-out;
  }

  @keyframes wrong-shape-flash {
    0% {
      opacity: 0;
      transform: scale(0.72);
      color: rgba(235, 12, 0, 0);
    }
    18% {
      opacity: 1;
      transform: scale(1.02);
      color: rgba(235, 12, 0, 0.94);
    }
    100% {
      opacity: 0;
      transform: scale(1.14);
      color: rgba(235, 12, 0, 0);
    }
  }

  #entry-status {
    position: fixed;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  #calibration-console {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    z-index: 5;
    width: min(420px, calc(100vw - 28px));
    max-height: calc(100vh - 28px);
    display: none;
    padding: 12px;
    overflow: auto;
    color: rgba(255, 232, 200, 0.9);
    background: rgba(12, 7, 4, 0.78);
    border: 1px solid rgba(255, 199, 135, 0.22);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    backdrop-filter: blur(8px);
    font: 11px/1.45 Consolas, "Courier New", monospace;
    pointer-events: auto;
  }

  body.is-calibrating #calibration-console {
    display: block;
  }

  #calibration-console .calibration-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  #calibration-console h2 {
    margin: 0;
    font: 700 10px/1.2 Arial, sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255, 226, 190, 0.74);
  }

  #calibration-console.is-collapsed {
    width: auto;
    max-height: none;
    padding: 8px 10px;
  }

  #calibration-console.is-collapsed .calibration-head {
    margin-bottom: 0;
  }

  #calibration-console.is-collapsed #cal-body {
    display: none;
  }

  #cal-toggle {
    flex: 0 0 auto;
  }

  #calibration-console .calibration-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  #calibration-console button {
    appearance: none;
    border: 1px solid rgba(255, 199, 135, 0.24);
    border-radius: 0;
    padding: 5px 8px;
    color: rgba(255, 232, 200, 0.88);
    background: rgba(255, 199, 135, 0.08);
    font: 700 9px/1 Arial, sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
  }

  #calibration-console button:hover {
    background: rgba(255, 199, 135, 0.16);
  }

  #calibration-console .calibration-controls {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px 10px;
    margin: 0 0 10px;
    padding: 9px 0;
    border-top: 1px solid rgba(255, 199, 135, 0.18);
    border-bottom: 1px solid rgba(255, 199, 135, 0.18);
  }

  #calibration-console .calibration-controls h3,
  #calibration-console .calibration-controls .control-wide {
    grid-column: 1 / -1;
  }

  #calibration-console .calibration-controls h3 {
    margin: 2px 0 0;
    color: rgba(0, 229, 255, 0.78);
    font: 700 9px/1 Arial, sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  #calibration-console .calibration-controls label {
    display: grid;
    grid-template-columns: 1fr 72px;
    align-items: center;
    gap: 6px;
  }

  #calibration-console .calibration-controls input,
  #calibration-console .calibration-controls output {
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    height: 24px;
    padding: 2px 4px;
    color: rgba(255, 232, 200, 0.92);
    background: rgba(255, 199, 135, 0.08);
    border: 1px solid rgba(255, 199, 135, 0.24);
    font: 10px/1 Consolas, monospace;
  }

  #calibration-console .calibration-controls output {
    display: block;
    min-height: 24px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  #calibration-console .calibration-controls input[type="color"] {
    padding: 2px;
    cursor: pointer;
  }

  @media (max-width: 700px) {
    #calibration-console {
      top: auto;
      right: auto;
      bottom: max(46px, env(safe-area-inset-bottom));
      left: max(8px, env(safe-area-inset-left));
      width: min(268px, calc(100vw - 16px));
      max-height: 96px;
      padding: 8px;
      overflow: hidden;
      opacity: 0.72;
      font-size: 9px;
      backdrop-filter: blur(4px);
    }

    #calibration-console:focus-within {
      width: calc(100vw - 16px);
      max-height: 45vh;
      overflow: auto;
      opacity: 0.94;
    }

    #calibration-console h2 {
      margin-bottom: 5px;
      font-size: 8px;
    }

    #calibration-console .calibration-actions {
      gap: 4px;
      margin-bottom: 6px;
    }

    #calibration-console button {
      padding: 4px 6px;
      font-size: 8px;
    }
  }
</style>
</head>
<body>
<main id="entry-root" aria-label="3D interactive entry room">
  <div id="art-stage">
    <picture id="room-bg" aria-hidden="true">
      <source media="(max-aspect-ratio: 3/4)" srcset="../assets/entry-room/frame_01-entry-room-mobile-extended.png">
      <img src="../assets/entry-room/frame_01-entry-room-desktop-extended.png" alt="">
    </picture>
    <canvas id="entry-canvas" tabindex="0"></canvas>
    <div id="frame-stage" aria-hidden="true"></div>
  </div>
  <div id="entry-overlays" aria-hidden="true">
    <div id="wrong-shape-flash">X</div>
  </div>
  <div id="entry-status" aria-live="polite" aria-atomic="true"></div>
</main>
<script type="module" src="./3d/entry-room-3d.js"></script>
</body>
</html>
