<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120c07">
<title>entry room - the six.well construct</title>
<link rel="stylesheet" href="/css/transitions.css">
<link rel="stylesheet" href="./entry-room.css">
</head>
<body class="entry-room-page">
<main class="entry-shell" aria-label="Interactive entry room prototype">
  <img class="room-background" src="../assets/entry-room/frame_01-generated-clean-void.png" alt="" aria-hidden="true">
  <div class="socket-field" aria-hidden="true">
    <span class="entry-socket" data-socket="1"></span>
    <span class="entry-socket" data-socket="2"></span>
    <span class="entry-socket" data-socket="3"></span>
    <span class="entry-socket" data-socket="4"></span>
    <span class="entry-socket" data-socket="5"></span>
    <span class="entry-socket" data-socket="6"></span>
  </div>
  <div class="orb-field" aria-hidden="true">
    <span class="entry-orb" data-orb="1"></span>
    <span class="entry-orb" data-orb="2"></span>
    <span class="entry-orb" data-orb="3"></span>
    <span class="entry-orb" data-orb="4"></span>
    <span class="entry-orb" data-orb="5"></span>
    <span class="entry-orb" data-orb="6"></span>
  </div>
</main>
<script src="/js/transition.js"></script>
<script src="./orb-ambient.js"></script>
<script src="./orb-drag.js"></script>
</body>
</html>
