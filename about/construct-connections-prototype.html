<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>construct connections prototype - the six.well construct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=block">
<style>
  :root {
    --bg: #0e0e0e;
    --body: var(--color-body, #FBD19D);
    --body-muted: var(--color-text-muted, rgba(251, 209, 157, 0.66));
    --body-dim: var(--color-text-dim, rgba(251, 209, 157, 0.38));
    --accent: #FCB867;
    --amber-soft: rgba(252, 184, 103, 0.18);
    --amber-faint: rgba(252, 184, 103, 0.105);
    --ring: #6D3D15;
    --sans: 'Inter', Arial, sans-serif;
    --serif: Georgia, 'Times New Roman', Times, serif;
    --ease: cubic-bezier(0.2, 0, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    min-height: 100%;
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--body);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a { color: inherit; text-decoration: none; }
  button { border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }

  .prototype {
    width: min(100%, 1180px);
    margin: 0 auto;
    padding: clamp(28px, 5vw, 54px) clamp(16px, 4vw, 42px) 56px;
  }

  .stage {
    position: relative;
    min-height: min(760px, calc(100vh - 64px));
    display: grid;
    grid-template-rows: auto minmax(420px, 1fr) auto;
    gap: 18px;
    background: transparent;
    overflow: visible;
  }

  /* Background layers — faint eyes wall (404-style) + floating amber particles (home-style) */
  .stage-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #particleBg {
    z-index: 0;
  }

  .stage-head,
  .diagram-wrap,
  .details {
    position: relative;
    z-index: 2;
  }

  .stage-head {
    padding: clamp(28px, 4vw, 42px) 24px 0;
    text-align: center;
  }

  .wordmark {
    color: var(--accent);
    font-family: var(--sans);
    font-size: clamp(28px, 4.2vw, 38px);
    font-weight: 900;
    letter-spacing: 0;
    line-height: 0.95;
  }

  .state-label {
    display: block;
    min-height: 20px;
    margin-top: 18px;
    color: rgba(252, 184, 103, 0.55);
    font-family: var(--serif);
    font-size: 11px;
    letter-spacing: 0.2em;
    line-height: 1.4;
    text-transform: uppercase;
  }

  .diagram-wrap {
    position: relative;
    width: 100%;
    min-height: 420px;
    padding: 0 clamp(4px, 2vw, 20px);
  }

  .diagram {
    display: block;
    width: 100%;
    height: min(61vw, 610px);
    min-height: 420px;
    overflow: visible;
  }

  .spoke {
    stroke: rgba(252, 184, 103, 0.24);
    stroke-width: 5;
    vector-effect: non-scaling-stroke;
  }

  .center-ring {
    fill: none;
    stroke: #6D3D15;
    stroke-width: 16;
    vector-effect: non-scaling-stroke;
  }

  .center-dot {
    fill: var(--accent);
    opacity: 0.95;
    transform-box: fill-box;
    transform-origin: center;
  }

  .connection-line {
    fill: none;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
    stroke-dasharray: var(--line-length);
    stroke-dashoffset: var(--line-length);
    animation: lineDraw 780ms var(--ease) forwards;
  }

  .connection-line {
    stroke-width: 5;
    opacity: 0.94;
    transition: opacity 300ms var(--ease);
  }

  .connection-line.is-leaving {
    opacity: 0;
  }

  .connection-line.is-dashed {
    stroke-dasharray: 12 12;
    animation: dashDraw 780ms var(--ease) forwards;
  }

  @keyframes lineDraw {
    to { stroke-dashoffset: 0; }
  }

  @keyframes dashDraw {
    from { stroke-dashoffset: var(--line-length); }
    to { stroke-dashoffset: 0; }
  }

  .node-hit {
    outline: none;
    transform-box: fill-box;
    transform-origin: center;
  }

  .node-core {
    fill: var(--node-color);
    opacity: 0.98;
    transform-box: fill-box;
    transform-origin: center;
    transition: r 320ms var(--ease), opacity 300ms var(--ease);
  }

  .node-halo {
    fill: none;
    stroke: var(--node-color);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 0 9;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transition: opacity 260ms var(--ease), r 320ms var(--ease);
  }

  .node-label {
    fill: var(--node-color);
    font-family: var(--sans);
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0;
    text-anchor: middle;
    text-transform: uppercase;
    transition: opacity 300ms var(--ease), fill 300ms var(--ease), transform 300ms var(--ease);
    user-select: none;
  }

  .node-count {
    fill: rgba(252, 184, 103, 0.6);
    font-family: var(--serif);
    font-size: 12px;
    letter-spacing: 0;
    text-anchor: middle;
    opacity: 0;
    transition: opacity 300ms var(--ease);
    user-select: none;
  }

  .node-hit:focus-visible .node-halo {
    opacity: 0.46;
  }

  .diagram.has-active .node-hit {
    opacity: 0.28;
    transition: opacity 560ms var(--ease);
  }

  .diagram.has-active .node-hit.is-active,
  .diagram.has-active .node-hit.is-connected,
  .diagram.has-active .node-hit.is-connected-pending {
    opacity: 1;
  }

  .node-hit.is-active .node-core {
    r: 43;
    fill: url(var(--sphere-gradient));
  }

  .node-hit.is-active .node-halo {
    r: 58;
    opacity: 0.62;
    animation: haloOrbit 5200ms linear infinite;
  }

  .node-hit.is-active .node-count {
    opacity: 1;
  }

  .node-hit.is-connected .node-core {
    r: 35;
    fill: url(var(--sphere-gradient));
  }

  .node-hit.is-active .node-label,
  .node-hit.is-connected .node-label {
    opacity: 1;
  }

  @keyframes haloOrbit {
    to { transform: rotate(360deg); }
  }

  .details {
    display: grid;
    grid-template-columns: minmax(0, 0.9fr) minmax(280px, 1.1fr);
    gap: clamp(22px, 4vw, 42px);
    align-items: start;
    padding: 0 clamp(20px, 5vw, 64px) clamp(26px, 4vw, 42px);
  }

  .selected-copy {
    min-height: 118px;
    border-top: 1px solid rgba(252, 184, 103, 0.14);
    padding-top: 18px;
  }

  /* soft content swap — details fade out, repopulate, fade back in */
  .selected-copy,
  .connection-list,
  .state-label {
    transition: opacity 360ms var(--ease), transform 360ms var(--ease);
  }

  .selected-copy.is-fading,
  .connection-list.is-fading,
  .state-label.is-fading {
    opacity: 0;
    transform: translateY(7px);
  }

  .selected-kicker,
  .connection-kicker {
    display: block;
    margin-bottom: 10px;
    color: rgba(252, 184, 103, 0.48);
    font-family: var(--serif);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  .selected-title {
    color: var(--accent);
    font-family: var(--sans);
    font-size: clamp(24px, 3.4vw, 38px);
    font-weight: 900;
    letter-spacing: 0;
    line-height: 1;
    text-transform: uppercase;
  }

  .selected-body {
    max-width: 430px;
    margin-top: 12px;
    color: var(--body-muted);
    font-size: 13px;
    line-height: 1.65;
  }

  .material-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    max-width: 460px;
    margin-top: 15px;
  }

  .material-chip {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 4px 8px;
    border: 1px solid rgba(252, 184, 103, 0.18);
    border-radius: 999px;
    color: var(--color-text-muted, rgba(251, 209, 157, 0.66));
    background: rgba(252, 184, 103, 0.055);
    font-family: var(--serif);
    font-size: 10px;
    letter-spacing: 0.12em;
    line-height: 1.2;
    text-transform: uppercase;
  }

  .connection-list {
    min-height: 118px;
    border-top: 1px solid rgba(252, 184, 103, 0.14);
    padding-top: 18px;
  }

  .connection-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .connection-card {
    display: block;
    min-height: 116px;
    padding: 13px 14px;
    border: 0;
    border-radius: 6px;
    background: #10100f;
    color: var(--color-body, #FBD19D);
    transition: transform 180ms var(--ease);
    /* cards cascade in, paced with the connection lines drawing above */
    animation: cardIn 520ms var(--ease) backwards;
    animation-delay: var(--card-delay, 0ms);
  }

  @keyframes cardIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
  }

  .connection-card:hover,
  .connection-card:focus-visible {
    transform: translateY(-2px);
    outline: none;
  }

  .connection-name {
    display: block;
    color: var(--link-color);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0;
    line-height: 1.2;
    text-transform: uppercase;
  }

  .connection-desc {
    display: block;
    margin-top: 9px;
    color: var(--color-text-muted, rgba(251, 209, 157, 0.66));
    font-size: 12px;
    line-height: 1.45;
  }

  .connection-materials {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 12px;
  }

  .connection-materials .material-chip {
    min-height: 20px;
    padding: 3px 6px;
    border-color: color-mix(in srgb, var(--link-color) 42%, transparent);
    background: #0e0e0e;
    color: color-mix(in srgb, var(--link-color) 82%, var(--color-body, #FBD19D));
    font-size: 9px;
    letter-spacing: 0.1em;
  }

  .empty-note {
    color: rgba(252, 184, 103, 0.46);
    font-family: var(--serif);
    font-size: 12px;
    letter-spacing: 0.18em;
    line-height: 1.6;
    text-transform: uppercase;
  }

  @media (max-width: 820px) {
    .stage {
      grid-template-rows: auto auto auto;
    }

    .diagram {
      height: 620px;
      min-width: 720px;
    }

    .diagram-wrap {
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .details {
      grid-template-columns: 1fr;
    }

    .connection-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      scroll-behavior: auto !important;
      transition-duration: 1ms !important;
    }
  }
</style>

<body>
<main class="prototype">
  <section class="stage" aria-labelledby="prototype-title">
    <canvas class="stage-bg" id="particleBg" aria-hidden="true"></canvas>
    <header class="stage-head">
      <h1 class="wordmark" id="prototype-title">the six.well construct</h1>
      <span class="state-label" id="stateLabel">click a medium - its connections illuminate</span>
    </header>

    <div class="diagram-wrap" aria-label="interactive construct connection diagram">
      <svg class="diagram" id="diagram" viewBox="0 0 1000 640" role="img" aria-labelledby="diagramTitle diagramDesc">
        <title id="diagramTitle">The six.well construct medium connections</title>
        <desc id="diagramDesc">Nine clickable mediums orbit the center construct. Selecting one animates its connection lines and reveals descriptions below.</desc>
        <defs id="gradientDefs"></defs>
        <g id="spokesLayer"></g>
        <g id="connectionLayer"></g>
        <g id="centerLayer" aria-hidden="true">
          <circle class="center-ring" cx="500" cy="322" r="48"></circle>
          <circle class="center-dot" cx="482" cy="294" r="7.5"></circle>
          <circle class="center-dot" cx="518" cy="294" r="7.5"></circle>
          <circle class="center-dot" cx="482" cy="322" r="7.5"></circle>
          <circle class="center-dot" cx="518" cy="322" r="7.5"></circle>
          <circle class="center-dot" cx="482" cy="350" r="7.5"></circle>
          <circle class="center-dot" cx="518" cy="350" r="7.5"></circle>
        </g>
        <g id="nodeLayer"></g>
      </svg>
    </div>

    <footer class="details" aria-live="polite">
      <section class="selected-copy">
        <span class="selected-kicker">selected medium</span>
        <h2 class="selected-title" id="selectedTitle">At rest</h2>

        <div class="material-strip" id="selectedMaterials" aria-label="selected medium materials"></div>

      <section class="connection-list">
        <span class="connection-kicker">connections</span>

        </div>
      </section>
    </footer>
  </section>
</main>

<script>
  /* Stage background — faint eyes wall (from /404.html) + amber particle field (from home page) */
  (function() {
    const stage = document.querySelector('.stage');
    const dustCanvas = document.getElementById('particleBg');
    const pctx = dustCanvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let W = 0, H = 0;

    /* ---------- particle field ---------- */
    const PARTICLE_COLOR = '#FCB867';
    const MAX_P = 120;
    const SPAWN_INT = 180;
    const PARTICLE_SPEED = 1.4;
    const particles = [];

    function particleCenter() {
      return { x: W / 2, y: H * 0.45 };
    }

    function spawnP(pre) {
      const ro = 60;
      const close = Math.random() < 0.4;
      const minD = close ? 8 : 80;
      const maxD = close ? 90 : Math.max(240, Math.min(W, H) * 0.55);
      const p = {
        angle: Math.random() * Math.PI * 2,
        dist: ro,
        targetDist: ro + minD + Math.random() * (maxD - minD),
        orbitSpeed: (Math.random() * 0.000035 + 0.00001) * (Math.random() < 0.5 ? 1 : -1),
        driftSpeed: 0.003 + Math.random() * 0.007,
        size: Math.max(0.6, 2 + Math.random() * 3.8),
        maxAlpha: 0.12 + Math.random() * 0.3,
        floatAmpX: 2 + Math.random() * 4,
        floatAmpY: 2 + Math.random() * 4,
        floatPX: 12000 + Math.random() * 10000,
        floatPY: 14000 + Math.random() * 10000,
        floatOX: Math.random() * Math.PI * 2,
        floatOY: Math.random() * Math.PI * 2,
        fadeInDur: 800 + Math.random() * 600,
        fadeOutDur: 1400 + Math.random() * 1000,
        age: 0, totalLife: null, reached: false
      };
      if (pre) {
        const fr = Math.random();
        p.dist = ro + fr * (p.targetDist - ro);
        p.age = fr * (p.fadeInDur + 3000);
        if (p.dist >= p.targetDist) { p.reached = true; p.totalLife = p.age + 4000 + Math.random() * 8000; }
      }
      particles.push(p);
    }

    let spawnTimer = 0;
    let seeded = false;
    function updateParticles(dt, t) {
      if (!seeded && W > 0) {
        for (let i = 0; i < MAX_P; i++) spawnP(true);
        seeded = true;
      }
      spawnTimer += dt;
      if (spawnTimer >= SPAWN_INT && particles.length < MAX_P) { spawnP(false); spawnTimer = 0; }
      const c = particleCenter();
      pctx.clearRect(0, 0, W, H);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.age += dt;
        p.angle += p.orbitSpeed * dt;
        if (!p.reached) {
          p.dist += p.driftSpeed * dt;
          if (p.dist >= p.targetDist) { p.dist = p.targetDist; p.reached = true; p.totalLife = p.age + 4000 + Math.random() * 8000; }
        }
        if (p.reached && p.age >= p.totalLife) { particles.splice(i, 1); continue; }
        let alpha;
        if (!p.reached) { alpha = Math.min(p.age / p.fadeInDur, 1) * p.maxAlpha; }
        else { const tl = p.totalLife - p.age; alpha = tl < p.fadeOutDur ? (tl / p.fadeOutDur) * p.maxAlpha : p.maxAlpha; }
        const fx = p.floatAmpX * Math.sin((t / p.floatPX) * Math.PI * 2 + p.floatOX);
        const fy = p.floatAmpY * Math.sin((t / p.floatPY) * Math.PI * 2 + p.floatOY);
        pctx.globalAlpha = alpha;
        pctx.beginPath();
        pctx.arc(c.x + Math.cos(p.angle) * p.dist + fx, c.y + Math.sin(p.angle) * p.dist + fy, p.size, 0, Math.PI * 2);
        pctx.fillStyle = PARTICLE_COLOR;
        pctx.fill();
      }
      pctx.globalAlpha = 1;
    }

    /* ---------- shared loop ---------- */
    function resize() {
      W = stage.clientWidth;
      H = stage.clientHeight;
      dustCanvas.width = W; dustCanvas.height = H;
      if (reduceMotion) { updateParticles(16, 0); }
    }

    let lastTime = 0;
    function loop(ts) {
      const dt = Math.min(ts - lastTime, 50);
      lastTime = ts;
      updateParticles(dt * PARTICLE_SPEED, ts);
      requestAnimationFrame(loop);
    }

    resize();
    window.addEventListener('resize', resize);
    /* the stage grows when connection cards populate — re-fit the canvases instead of letting CSS stretch them */
    new ResizeObserver(() => {
      if (stage.clientWidth !== W || stage.clientHeight !== H) resize();
    }).observe(stage);
    if (!reduceMotion) {
      requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
    }
  })();

  (function() {
    const center = { x: 500, y: 322 };
    const lineDuration = 780;
    const connectionStagger = 155;
    const lineLead = 180;      // beat between the click and the first line drawing
    const detailFade = 320;    // details fade-out time before content swaps

    const nodes = [
      { key: 'tattooing', label: 'Tattooing', color: '#6E0404', activeColor: '#6E0404', url: '/tattoos/', angle: -90, status: 'active engine', role: 'art.pill Tattoo House', note: 'The economic spine and body-contact node: symbolic tattoos, ritual service, client trust, and the first public proof that the construct can survive.', materials: ['mythic flash', 'booking flow', 'healed marks', 'aftercare', 'design terminal'] },
      { key: 'art', label: 'Art', color: '#0071EB', url: '/art/', angle: -50, status: 'active root', role: 'ThoughtPuppet / fine art', note: 'The visual root system: paintings, studies, symbol maps, and subconscious research that can feed tattoos, clothing, films, and future exhibitions.', materials: ['paintings', 'studies', 'symbol maps', 'visual essays', 'image vocabulary'] },
      { key: 'merch', label: 'Merch', color: '#F08F15', url: '/merch/', angle: -10, status: 'active artifact node', role: 'Six.Well Clothing', note: 'The artifact economy: garments, editions, drops, and physical proof of participation in the world rather than generic logo merch.', materials: ['edition numbers', 'garments', 'mailers', 'product pages', 'drop records'] },
      { key: 'about', label: 'About', color: '#FCB867', url: '/about/', angle: 30, status: 'public map', role: 'website / orientation layer', note: 'The map and doorway: it tells visitors what this is, who made it, what is available now, and which rooms can be entered later.', materials: ['doors', 'founder page', 'node atlas', 'positioning', 'access points'] },
      { key: 'events', label: 'Events', color: '#005D25', url: '/events/', angle: 70, status: 'incubating gatherer', role: 'Cult.ATL / Solehman New Year', note: 'The gathering engine: performance rooms, annual ritual, community contact, event relics, and public evidence that the construct is alive.', materials: ['showcase', 'performance night', 'tickets', 'recaps', 'event relics'] },
      { key: 'music', label: 'Music', color: '#A22F8D', url: '/music/', angle: 110, status: 'incubating atmosphere', role: '&Friends / performance audio', note: 'The sound and conversation layer: interviews, performance traces, scores, and audio that make the system social, atmospheric, and repeatable.', materials: ['guest talks', 'scores', 'raw audio', 'clips', 'transcripts'] },
      { key: 'writings', label: 'Writings', color: '#FFE7CA', url: '/writings/', angle: 150, status: 'thread to launch', role: 'Underside Letters / Mindful Darkness', note: 'The voice and thread: letters, essays, notes, release context, and the human cadence that lets people follow the construct over time.', materials: ['letters', 'essays', 'studio notes', 'release notes', 'field fragments'] },
      { key: 'archive', label: 'Archive', color: '#6D3D15', url: '/archive/', angle: 190, status: 'memory system', role: 'vault / public archive', note: 'The memory layer: records, traces, process, images, proofs, and the source material that keeps artifacts from disappearing into the feed.', materials: ['vault records', 'photos', 'certificates', 'process scans', 'timeline'] },
      { key: 'film', label: 'Film', color: '#328C84', url: '/film/', angle: 230, status: 'narrative engine', role: 'Sloth99', note: 'The documentation and narrative arm: films, campaign footage, studio life, interviews, event recaps, and visible evidence of the world being made.', materials: ['short films', 'BTS footage', 'campaigns', 'reels', 'lore videos'] }
    ];

    /*
      Connection map informed by The Six.Well Construct dossier. It favors the
      current public nine-medium site structure while translating the document's
      node atlas into visible movement between doors, artifacts, memory, and
      community.
    */
    const connections = {
      tattooing: [
        { target: 'art', title: 'Tattooing -> Art', description: 'Flash, tattoo legend symbols, and client-ready drawings can grow out of the same visual vocabulary as paintings and studies.', materials: ['flash', 'symbol sets', 'visual systems'] },
        { target: 'merch', title: 'Tattooing -> Merch', description: 'Aftercare, studio objects, printed studies, and mythic flash collections become artifacts that fund the next layer.', materials: ['aftercare', 'prints', 'studio goods'] },
        { target: 'archive', title: 'Tattooing -> Archive', description: 'Healed work, design notes, appointment traces, deposits, and process images become proof that the world touches bodies.', materials: ['healed photos', 'booking traces', 'design notes'] },
        { target: 'film', title: 'Tattooing -> Film', description: 'Sloth99 can document tattoo sessions, studio life, client education, and the making of symbolic body work.', materials: ['BTS footage', 'education clips', 'session records'] }
      ],
      art: [
        { target: 'tattooing', title: 'Art -> Tattooing', description: 'Paintings and symbol maps become source material for original flash, premium concepts, and tattoo legend systems.', materials: ['studies', 'flash seeds', 'symbol maps'] },
        { target: 'merch', title: 'Art -> Merch', description: 'Finished images, studies, and visual systems become prints, garments, editions, and collector objects.', materials: ['prints', 'editions', 'object graphics'] },
        { target: 'film', title: 'Art -> Film', description: 'The visual root system gives Sloth99 imagery, atmosphere, campaign language, and documentary subject matter.', materials: ['painting footage', 'campaign images', 'visual essays'] },

        { target: 'merch', title: 'Archive -> Merch', description: 'Ephemera, past marks, studies, and release records can become future editions or wearable archive objects.', materials: ['ephemera', 'edition history', 'source scans'] },

      ],
      film: [
        { target: 'tattooing', title: 'Film -> Tattooing', description: 'Documentation makes premium tattoo work legible through process, education, studio atmosphere, and trust.', materials: ['session clips', 'education', 'studio life'] },

      ]
    };

    const diagram = document.getElementById('diagram');
    const gradientDefs = document.getElementById('gradientDefs');
    const spokesLayer = document.getElementById('spokesLayer');
    const connectionLayer = document.getElementById('connectionLayer');
    const nodeLayer = document.getElementById('nodeLayer');
    const selectedTitle = document.getElementById('selectedTitle');
    const selectedBody = document.getElementById('selectedBody');
    const selectedMaterials = document.getElementById('selectedMaterials');
    const stateLabel = document.getElementById('stateLabel');
    const connectionGrid = document.getElementById('connectionGrid');
    const selectedCopy = document.querySelector('.selected-copy');
    const connectionList = document.querySelector('.connection-list');
    const fadeGroup = [selectedCopy, connectionList, stateLabel];

    let activeKey = null;
    let timers = [];
    let activeConnections = [];
    let rafId = null;
    let connectionGradientSeq = 0;
    const pointer = { active: false, x: center.x, y: center.y };

    function polarPoint(angle, radiusX, radiusY) {
      const radians = angle * Math.PI / 180;
      return {
        x: center.x + Math.cos(radians) * radiusX,
        y: center.y + Math.sin(radians) * radiusY
      };
    }

    function lighten(hex, amount) {
      const normalized = hex.replace('#', '');
      const number = parseInt(normalized, 16);
      const r = Math.min(255, Math.round(((number >> 16) & 255) + (255 * amount)));
      const g = Math.min(255, Math.round(((number >> 8) & 255) + (255 * amount)));
      const b = Math.min(255, Math.round((number & 255) + (255 * amount)));
      return '#' + [r, g, b].map(value => value.toString(16).padStart(2, '0')).join('');
    }

    function darken(hex, amount) {
      const normalized = hex.replace('#', '');
      const number = parseInt(normalized, 16);
      const r = Math.max(0, Math.round(((number >> 16) & 255) * (1 - amount)));
      const g = Math.max(0, Math.round(((number >> 8) & 255) * (1 - amount)));
      const b = Math.max(0, Math.round((number & 255) * (1 - amount)));
      return '#' + [r, g, b].map(value => value.toString(16).padStart(2, '0')).join('');
    }

    function nodeByKey(key) {
      return nodes.find(node => node.key === key);
    }

    function clearTimers() {
      timers.forEach(timer => clearTimeout(timer));
      timers = [];
    }

    /* fade the details out, swap their content, then fade back in */
    function softSwap(apply) {
      fadeGroup.forEach(el => el.classList.add('is-fading'));
      const timer = setTimeout(() => {
        apply();
        requestAnimationFrame(() => {
          fadeGroup.forEach(el => el.classList.remove('is-fading'));
        });
      }, detailFade);
      timers.push(timer);
    }

    function clearSelection() {
      activeKey = null;
      clearTimers();
      activeConnections = [];
      gradientDefs.querySelectorAll('.connection-gradient').forEach(gradient => gradient.remove());
      diagram.classList.remove('has-active');
      connectionLayer.replaceChildren();
      nodeLayer.querySelectorAll('.node-hit').forEach(group => {
        group.classList.remove('is-active', 'is-connected', 'is-connected-pending');
      });
      softSwap(() => {
        selectedTitle.textContent = 'At rest';
        selectedTitle.style.color = 'var(--accent)';
        selectedBody.textContent = 'All nine mediums sit as flat solid circles. Only the faint amber spokes remain visible until a node is selected.';
        selectedMaterials.replaceChildren();
        stateLabel.textContent = 'click a medium - its connections illuminate';
        connectionGrid.innerHTML = '<p class="empty-note">Choose a node to reveal its linked rooms, routes, and descriptions.</p>';
      });
    }

    function renderMaterialChips(container, items) {
      container.replaceChildren();
      items.forEach(item => {
        const chip = document.createElement('span');
        chip.className = 'material-chip';
        chip.textContent = item;
        container.appendChild(chip);
      });
    }

    function drawConnection(source, target, color, index) {
      const sourcePoint = livePoint(source);
      const targetPoint = livePoint(target);
      const delay = index * connectionStagger;
      const path = `M ${sourcePoint.x} ${sourcePoint.y} L ${targetPoint.x} ${targetPoint.y}`;
      const length = Math.hypot(targetPoint.x - sourcePoint.x, targetPoint.y - sourcePoint.y);
      const blendStart = length < 190 ? 42 : length < 260 ? 46 : 50;
      const blendEnd = length < 190 ? 88 : length < 260 ? 90 : 92;
      const gradientId = `connection-gradient-${connectionGradientSeq++}`;
      const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
      gradient.id = gradientId;
      gradient.classList.add('connection-gradient');
      gradient.setAttribute('gradientUnits', 'userSpaceOnUse');
      gradient.setAttribute('x1', sourcePoint.x);
      gradient.setAttribute('y1', sourcePoint.y);
      gradient.setAttribute('x2', targetPoint.x);
      gradient.setAttribute('y2', targetPoint.y);

      const startStop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      startStop.setAttribute('offset', '0%');
      startStop.setAttribute('stop-color', source.activeColor || source.color);

      const holdStop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      holdStop.setAttribute('offset', `${blendStart}%`);
      holdStop.setAttribute('stop-color', source.activeColor || source.color);

      const targetStartStop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      targetStartStop.setAttribute('offset', `${blendEnd}%`);
      targetStartStop.setAttribute('stop-color', target.activeColor || target.color);

      const endStop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
      endStop.setAttribute('offset', '100%');
      endStop.setAttribute('stop-color', target.activeColor || target.color);

      gradient.append(startStop, holdStop, targetStartStop, endStop);
      gradientDefs.appendChild(gradient);

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      line.setAttribute('d', path);
      line.setAttribute('class', 'connection-line');
      line.setAttribute('stroke', `url(#${gradientId})`);
      line.style.setProperty('--line-length', length);
      line.style.animationDelay = `${lineLead + delay}ms`;
      connectionLayer.appendChild(line);
      activeConnections.push({ line, gradient, source, target });

      const timer = setTimeout(() => {
        const targetGroup = nodeLayer.querySelector(`[data-node="${target.key}"]`);
        if (targetGroup && activeKey === source.key) {
          targetGroup.classList.remove('is-connected-pending');
          targetGroup.classList.add('is-connected');
        }
      }, lineLead + delay + lineDuration - 80);
      timers.push(timer);
    }

    function renderDetails(source, entries) {
      softSwap(() => {
      selectedTitle.textContent = source.label;
      selectedTitle.style.color = source.activeColor || source.color;
      selectedBody.textContent = `${source.role} - ${source.status}. ${source.note}`;
      renderMaterialChips(selectedMaterials, source.materials || []);
      stateLabel.textContent = `${source.label.toLowerCase()} - ${entries.length} connections`;
      connectionGrid.replaceChildren();

      entries.forEach((entry, index) => {
        const target = nodeByKey(entry.target);
        const card = document.createElement('a');
        card.className = 'connection-card';
        card.href = target.url;
        card.style.setProperty('--link-color', target.color);
        card.style.setProperty('--card-delay', `${120 + index * 110}ms`);

        const name = document.createElement('span');
        name.className = 'connection-name';
        name.textContent = entry.title;

        const desc = document.createElement('span');
        desc.className = 'connection-desc';
        desc.textContent = entry.description;

        const materials = document.createElement('span');
        materials.className = 'connection-materials';
        (entry.materials || []).forEach(item => {
          const chip = document.createElement('span');
          chip.className = 'material-chip';
          chip.textContent = item;
          materials.appendChild(chip);
        });

        card.append(name, desc, materials);
        connectionGrid.appendChild(card);
      });
      });
    }

    function activateNode(key) {
      if (activeKey === key) {
        clearSelection();
        return;
      }

      activeKey = key;
      clearTimers();
      activeConnections = [];
      gradientDefs.querySelectorAll('.connection-gradient').forEach(gradient => gradient.remove());
      connectionLayer.replaceChildren();
      diagram.classList.add('has-active');
      nodeLayer.querySelectorAll('.node-hit').forEach(group => {
        group.classList.toggle('is-active', group.dataset.node === key);
        group.classList.remove('is-connected', 'is-connected-pending');
      });

      const source = nodeByKey(key);
      const entries = connections[key] || [];
      entries.forEach(entry => {
        const targetGroup = nodeLayer.querySelector(`[data-node="${entry.target}"]`);
        if (targetGroup) targetGroup.classList.add('is-connected-pending');
      });
      renderDetails(source, entries);
      entries.forEach((entry, index) => drawConnection(source, nodeByKey(entry.target), source.activeColor || source.color, index));
    }

    function buildGradients() {
      nodes.forEach((node, index) => {
        const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'radialGradient');
        gradient.id = `sphere-${node.key}`;
        gradient.setAttribute('cx', '34%');
        gradient.setAttribute('cy', '28%');
        gradient.setAttribute('r', '72%');

        const stops = [
          ['0%', lighten(node.activeColor || node.color, 0.22)],
          ['44%', node.activeColor || node.color],
          ['100%', darken(node.activeColor || node.color, 0.38)]
        ];

        stops.forEach(([offset, color]) => {
          const stop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
          stop.setAttribute('offset', offset);
          stop.setAttribute('stop-color', color);
          gradient.appendChild(stop);
        });

        gradientDefs.appendChild(gradient);
      });
    }

    function buildDiagram() {
      buildGradients();

      nodes.forEach((node, index) => {
        node.point = polarPoint(node.angle, 258, 258);

        const spoke = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        spoke.setAttribute('class', 'spoke');
        spoke.setAttribute('x1', center.x);
        spoke.setAttribute('y1', center.y);
        spokesLayer.appendChild(spoke);

        const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        group.setAttribute('class', 'node-hit');
        group.setAttribute('data-node', node.key);
        group.setAttribute('tabindex', '0');
        group.setAttribute('role', 'button');
        group.setAttribute('aria-label', `Show ${node.label} connections`);
        group.style.setProperty('--node-color', node.color);
        group.style.setProperty('--sphere-gradient', `#sphere-${node.key}`);
        node.index = index;
        node.offset = { x: 0, y: 0 };
        node.phase = index * 0.2;
        node.spoke = spoke;
        node.group = group;
        updateSpoke(node);

        const halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        halo.setAttribute('class', 'node-halo');
        halo.setAttribute('cx', node.point.x);
        halo.setAttribute('cy', node.point.y);
        halo.setAttribute('r', 46);

        const core = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        core.setAttribute('class', 'node-core');
        core.setAttribute('cx', node.point.x);
        core.setAttribute('cy', node.point.y);
        core.setAttribute('r', 32);

        const labelOffset = node.point.y < center.y ? -52 : 60;
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('class', 'node-label');
        label.setAttribute('x', node.point.x);
        label.setAttribute('y', node.point.y + labelOffset);
        label.textContent = node.label;

        const count = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        count.setAttribute('class', 'node-count');
        count.setAttribute('x', node.point.x);
        count.setAttribute('y', node.point.y + (node.point.y < center.y ? 78 : -70));
        count.textContent = `${(connections[node.key] || []).length} connections`;

        group.append(halo, core, label, count);
        group.addEventListener('click', () => activateNode(node.key));
        group.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            activateNode(node.key);
          }
        });

        nodeLayer.appendChild(group);
      });
    }

    function livePoint(node) {
      return {
        x: node.point.x + (node.offset ? node.offset.x : 0),
        y: node.point.y + (node.offset ? node.offset.y : 0)
      };
    }

    function nodeCoreRadius(node) {
      if (!node.group) return 32;
      if (node.group.classList.contains('is-active')) return 43;
      if (node.group.classList.contains('is-connected')) return 35;
      return 32;
    }

    function spokeEndPoint(node) {
      const point = livePoint(node);
      const dx = point.x - center.x;
      const dy = point.y - center.y;
      const distance = Math.hypot(dx, dy) || 1;
      const radius = nodeCoreRadius(node);
      return {
        x: point.x - (dx / distance) * radius,
        y: point.y - (dy / distance) * radius
      };
    }

    function updateSpoke(node) {
      const end = spokeEndPoint(node);
      node.spoke.setAttribute('x2', end.x.toFixed(2));
      node.spoke.setAttribute('y2', end.y.toFixed(2));
    }

    function motionTarget(node, seconds) {
      const phase = seconds * 0.64 + node.phase;
      const bob = Math.sin(phase);
      const sway = Math.sin(phase * 0.72 + 0.9);
      let x = sway * 6;
      let y = -7 + bob * 8;

      if (pointer.active) {
        const baseX = node.point.x + x;
        const baseY = node.point.y + y;
        const dx = pointer.x - baseX;
        const dy = pointer.y - baseY;
        const dist = Math.hypot(dx, dy);
        const radius = 210;
        if (dist > 0 && dist < radius) {
          const pull = (1 - dist / radius) * 9;
          x += (dx / dist) * pull;
          y += (dy / dist) * pull;
        }
      }

      return { x, y };
    }

    function updateMotion(timestamp) {
      const seconds = timestamp / 1000;
      nodes.forEach(node => {
        const target = motionTarget(node, seconds);
        node.offset.x += (target.x - node.offset.x) * 0.055;
        node.offset.y += (target.y - node.offset.y) * 0.055;
        node.group.setAttribute('transform', `translate(${node.offset.x.toFixed(2)} ${node.offset.y.toFixed(2)})`);
        updateSpoke(node);
      });

      activeConnections.forEach(connection => {
        const sourcePoint = livePoint(connection.source);
        const targetPoint = livePoint(connection.target);
        connection.line.setAttribute('d', `M ${sourcePoint.x.toFixed(2)} ${sourcePoint.y.toFixed(2)} L ${targetPoint.x.toFixed(2)} ${targetPoint.y.toFixed(2)}`);
        connection.gradient.setAttribute('x1', sourcePoint.x.toFixed(2));
        connection.gradient.setAttribute('y1', sourcePoint.y.toFixed(2));
        connection.gradient.setAttribute('x2', targetPoint.x.toFixed(2));
        connection.gradient.setAttribute('y2', targetPoint.y.toFixed(2));
      });

      rafId = requestAnimationFrame(updateMotion);
    }

    function updatePointer(event) {
      const rect = diagram.getBoundingClientRect();
      const scaleX = 1000 / rect.width;
      const scaleY = 640 / rect.height;
      pointer.active = true;
      pointer.x = (event.clientX - rect.left) * scaleX;
      pointer.y = (event.clientY - rect.top) * scaleY;
    }

    diagram.addEventListener('pointermove', updatePointer);
    diagram.addEventListener('pointerenter', updatePointer);
    diagram.addEventListener('pointerleave', () => {
      pointer.active = false;
      pointer.x = center.x;
      pointer.y = center.y;
    });

    buildDiagram();
    rafId = requestAnimationFrame(updateMotion);
  })();
</script>
