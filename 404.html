<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Not found - the six.well construct</title>
<style>
  :root {
    --bg:#0e0e0e;
    --text:#FFE7CA;
    --muted:rgba(255,231,202,0.62);
    --accent:#FCB867;
    --sans:Inter,"Helvetica Neue",Arial,sans-serif;
    --serif:Georgia,"Times New Roman",Times,serif;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:var(--bg);
    color:var(--text);
    font-family:var(--serif);
    padding:32px;
    overflow:hidden;
  }
  #bg {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    filter:brightness(0.20) saturate(2);
  }
  main {
    width:min(100%,720px);
    position:relative;
    z-index:1;
  }
  p {
    margin:0 0 18px;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
  }
  h1 {
    margin:0 0 20px;
    font-family:var(--sans);
    font-size:clamp(52px,12vw,132px);
    line-height:0.88;
    letter-spacing:0;
    text-transform:uppercase;
    color:var(--accent);
  }
  a {
    color:var(--accent);
    font-family:var(--sans);
    font-size:12px;
    font-weight:800;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <h1>Turn back.</h1>
  <p>Come back later.</p>
  <a href="/">Return home</a>
</main>
<script>
(function () {
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');

  // Tile dimensions & eye draw size
  const TW = 175, TH = 155;
  const EYE = 115;
  const OX = (TW - EYE) / 2;
  const OY = (TH - EYE) / 2;

  const GLOBAL_DOWN = 0.28;
  const BASE_SPEED  = 0.40;
  const POOL        = 20;
  const MAX_COLS    = 18;

  // Blink timing
  const BLINK_CLOSE  = 90;   // ms to close
  const BLINK_CLOSED = 80;   // ms held shut
  const BLINK_OPEN   = 90;   // ms to reopen

  // Per-row scroll state
  const rowOffset = new Array(POOL);
  const rowSpeed  = new Array(POOL);
  for (let r = 0; r < POOL; r++) {
    const dir    = r % 2 === 0 ? 1 : -1;
    rowOffset[r] = Math.random() * TW * 1000;
    rowSpeed[r]  = dir * BASE_SPEED * (0.70 + Math.random() * 0.60);
  }

  // Per-cell blink state [rowId][col]
  const blinks = Array.from({ length: POOL }, () =>
    Array.from({ length: MAX_COLS }, () => ({
      phase: 'open',
      t:     0,
      next:  Math.random() * 2500   // staggered start
    }))
  );

  let W, H;
  let slotY   = 0;
  let baseRow = 0;
  let lastTime = 0;

  const openImg   = new Image();
  const closedImg = new Image();
  let loaded = 0;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  /* ---------- update ---------- */
  function update(dt) {
    const f = dt / 16.667;

    slotY += GLOBAL_DOWN * f;
    while (slotY >= TH) { slotY -= TH; baseRow--; }

    for (let r = 0; r < POOL; r++) {
      rowOffset[r] = (rowOffset[r] + rowSpeed[r] * f + TW * 10000) % (TW * 10000);
    }

    // Update blink states
    for (let r = 0; r < POOL; r++) {
      for (let c = 0; c < MAX_COLS; c++) {
        const b = blinks[r][c];
        if (b.phase === 'open') {
          b.next -= dt;
          if (b.next <= 0) { b.phase = 'closing'; b.t = 0; }
        } else if (b.phase === 'closing') {
          b.t += dt;
          if (b.t >= BLINK_CLOSE) {
            b.phase = 'closed'; b.t = 0;
            // Ripple: nudge nearby cells to blink soon
            const nudge = (nr, nc) => {
              if (nr >= 0 && nr < POOL && nc >= 0 && nc < MAX_COLS) {
                const nb = blinks[nr][nc];
                if (nb.phase === 'open' && nb.next > 300)
                  nb.next = 80 + Math.random() * 300;
              }
            };
            nudge(r, c - 1); nudge(r, c + 1);
            nudge(r - 1, c); nudge(r + 1, c);
          }
        } else if (b.phase === 'closed') {
          b.t += dt;
          if (b.t >= BLINK_CLOSED) { b.phase = 'opening'; b.t = 0; }
        } else {
          b.t += dt;
          if (b.t >= BLINK_OPEN) {
            b.phase = 'open';
            b.next  = 600 + Math.random() * 2000;
          }
        }
      }
    }
  }

  /* ---------- draw ---------- */
  function draw() {
    ctx.clearRect(0, 0, W, H);

    const slots = Math.ceil(H / TH) + 2;
    const cols  = Math.ceil(W / TW) + 3;

    for (let i = 0; i < slots; i++) {
      const logicalRow = baseRow + i;
      const rowId  = ((logicalRow % POOL) + POOL) % POOL;
      const isOdd  = ((logicalRow % 2) + 2) % 2 === 1;
      const stagger = isOdd ? TW / 2 : 0;
      const ox = ((rowOffset[rowId] + stagger) % TW + TW) % TW - TW;
      const y  = i * TH + slotY - TH;

      for (let c = 0; c < cols; c++) {
        const colId = c % MAX_COLS;
        const b = blinks[rowId][colId];

        let openAlpha = 1, closedAlpha = 0;
        if (b.phase === 'closing') {
          const p = b.t / BLINK_CLOSE;
          openAlpha = 1 - p; closedAlpha = p;
        } else if (b.phase === 'closed') {
          openAlpha = 0; closedAlpha = 1;
        } else if (b.phase === 'opening') {
          const p = b.t / BLINK_OPEN;
          openAlpha = p; closedAlpha = 1 - p;
        }

        const x = c * TW + ox + OX;
        if (openAlpha > 0)   { ctx.globalAlpha = openAlpha;   ctx.drawImage(openImg,   x, y + OY, EYE, EYE); }
        if (closedAlpha > 0) { ctx.globalAlpha = closedAlpha; ctx.drawImage(closedImg, x, y + OY, EYE, EYE); }
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- loop ---------- */
  function loop(ts) {
    const dt = Math.min(ts - lastTime, 50);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function onLoad() {
    if (++loaded < 2) return;
    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
  }

  openImg.onload   = onLoad;
  closedImg.onload = onLoad;
  openImg.src   = 'assets/eyes/openeye.png';
  closedImg.src = 'assets/eyes/closedeye.png';
})();
</script>
</body>
</html>
