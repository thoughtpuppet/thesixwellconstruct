<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Not found - the six.well construct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=block">
<style>
  :root {
    --bg:#0e0e0e;
    --text:var(--color-body, #FBD19D);
    --muted:var(--color-text-muted, rgba(251,209,157,0.66));
    --accent:#FCB867;
    --sans:Inter,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",Times,serif;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:var(--bg);
    color:var(--text);
    font-family:var(--serif);
    padding:32px;
    overflow:hidden;
  }
  #bg {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }
  main {
    width:100%;
    position:relative;
    z-index:1;
  }
  p {
    margin:0 0 18px;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    font-family:var(--serif);
    text-transform:uppercase;
    letter-spacing:0.35em;
  }
  h1 {
    margin:0 0 20px;
  }
  a {
    display:inline-block;
    background:#7B1A1A;
    color:var(--accent);
    font-family:var(--sans);
    font-size:12px;
    font-weight:800;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
    padding:10px 14px;
    border-radius:6px;
  }
</style>
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/site-typography.css">
<link rel="stylesheet" href="/css/hero.css">
</head>
<body>
<canvas id="bg"></canvas>
<main class="site-hero site-hero--supporting">
  <h1 class="hero-title">Nope.</h1>
  <p class="hero-descriptor">Come back later.</p>
  <a href="/home/">Return home</a>
</main>
<script src="/js/construct-ambient-field.js"></script>
<script>
  window.ConstructAmbientField.mount({
    root: document.documentElement,
    eyesCanvas: document.getElementById('bg'),
    eyeFilter: 'brightness(0.20) saturate(2)',
    particleCount: 0
  });
</script>
</body>
</html>
