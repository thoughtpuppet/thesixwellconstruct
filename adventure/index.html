<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e0e0e">
<meta name="color-scheme" content="dark">
<title>Explore - the six.well construct</title>
<link rel="canonical" href="https://thesixwellconstruct.com/adventure/">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/transitions.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=block">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/site-typography.css">
<link rel="stylesheet" href="/css/explore.css">
</head>
<body data-live-text-editor="off" data-construct-wayfinding="off">
<main class="explore-room entrance-fade" data-explore-room data-explore-renderer="fallback" data-explore-state="idle">
  <h1 class="explore-sr-only">Explore</h1>

  <div class="explore-atmosphere" aria-hidden="true">
    <canvas class="explore-atmosphere__layer explore-atmosphere__eyes" data-explore-eyes></canvas>
    <canvas class="explore-atmosphere__layer explore-atmosphere__particles" data-explore-particles></canvas>
  </div>

  <div class="explore-scene" data-explore-scene aria-hidden="true">
    <canvas class="explore-scene__canvas" data-explore-scene-canvas></canvas>
  </div>

  <div class="explore-actions" data-explore-actions role="group" aria-label="Choose how to explore the Construct">
    <button class="explore-action explore-action--primary" type="button" data-explore-scope="all" data-explore-shape="disc" aria-label="Take me anywhere" aria-describedby="explore-description-all">
      <span class="explore-action__label">Take me anywhere</span>
      <span class="explore-action__description" id="explore-description-all">Across the entire domain.</span>
    </button>

    <button class="explore-action explore-action--works" type="button" data-explore-scope="works" data-explore-shape="square" aria-label="Works &amp; objects" aria-describedby="explore-description-works">
      <span class="explore-action__label">Works &amp; objects</span>
      <span class="explore-action__description" id="explore-description-works">Art, objects, events &amp; archives.</span>
    </button>

    <button class="explore-action explore-action--process" type="button" data-explore-scope="process" data-explore-shape="triangle" aria-label="Process &amp; evidence" aria-describedby="explore-description-process">
      <span class="explore-action__label">Process &amp; evidence</span>
      <span class="explore-action__description" id="explore-description-process">Sketches, notes, bts media &amp; voice memos.</span>
    </button>

    <button class="explore-action explore-action--pages" type="button" data-explore-scope="pages" data-explore-shape="hexagon" aria-label="Pages &amp; pathways" aria-describedby="explore-description-pages">
      <span class="explore-action__label">Pages &amp; pathways</span>
      <span class="explore-action__description" id="explore-description-pages">whole pages, guides, portfolios &amp; pathways.</span>
    </button>
  </div>

  <p class="explore-status" data-explore-status aria-live="polite" aria-atomic="true"></p>
</main>
<script src="/js/transition.js"></script>
<script src="/js/construct-corner.js"></script>
<script src="/js/construct-nav.js"></script>
<script src="/js/construct-ambient-field.js"></script>
<script type="module" src="/js/explore-room.js"></script>
<script src="/js/explore.js"></script>
</body>
</html>
