<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Not found - the six.well construct</title>
<style>
  :root {
    --bg:#0e0e0e;
    --text:#FFE7CA;
    --muted:rgba(255,231,202,0.62);
    --accent:#FCB867;
    --sans:Inter,"Helvetica Neue",Arial,sans-serif;
    --serif:Georgia,"Times New Roman",Times,serif;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:var(--bg);
    color:var(--text);
    font-family:var(--serif);
    padding:32px;
  }
  main { width:min(100%,720px); }
  p {
    margin:0 0 18px;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
  }
  h1 {
    margin:0 0 20px;
    font-family:var(--sans);
    font-size:clamp(52px,12vw,132px);
    line-height:0.88;
    letter-spacing:0;
    text-transform:uppercase;
    color:var(--accent);
  }
  a {
    color:var(--accent);
    font-family:var(--sans);
    font-size:12px;
    font-weight:800;
    letter-spacing:0.14em;
    text-transform:uppercase;
    text-decoration:none;
  }
</style>
</head>
<body>
<main>
  <h1>Not found.</h1>
  <p>This page is unavailable.</p>
  <a href="/">Return home</a>
</main>
</body>
</html>
