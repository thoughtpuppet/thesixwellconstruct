<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ticket Confirmation - the six.well construct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/transitions.css">
<style>
  :root {
    --bg:#0e0e0e; --accent:#005D25; --signal:#6E0404;
    --ring:#005D25; --ring-soft:rgba(0,93,37,0.45); --ring-faint:rgba(0,93,37,0.2);
    --text:var(--color-body, #FBD19D); --muted:var(--color-text-muted, rgba(251,209,157,0.66)); --dim:var(--color-text-dim, rgba(251,209,157,0.38));
    --sans:Inter,Arial,sans-serif; --serif:Georgia,"Times New Roman",Times,serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:var(--serif); overflow-x:hidden; }
  a { color:inherit; text-decoration:none; }
  .grain { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.035; mix-blend-mode:overlay; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  header { position:sticky; top:0; z-index:10; min-height:72px; display:flex; justify-content:flex-end; padding:24px 40px; }
  main { position:relative; z-index:2; max-width:980px; margin:0 auto; padding:72px 40px 80px; }
  .badge { display:inline-flex; align-items:center; gap:8px; border:5px solid var(--ring-soft); color:var(--ring); padding:5px 12px; margin-bottom:34px; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; }
  .badge.pending { color:var(--signal); }
  .badge-dot { width:5px; height:5px; border-radius:50%; background:currentColor; }
  h1 { max-width:720px; margin:16px 0 28px; }
  .lead { margin:0 0 44px; }
  .detail-block { max-width:620px; border-top:5px solid var(--ring-soft); margin:36px 0; }
  .detail-row { display:grid; grid-template-columns:180px 1fr; gap:18px; border-bottom:5px solid var(--ring-faint); padding:16px 0; color:var(--muted); line-height:1.55; }
  .detail-key { color:var(--dim); font-family:var(--sans); font-size:10px; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; }
  .cta-row { display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .cta-primary { display:inline-flex; align-items:center; min-height:48px; border:5px solid var(--ring-soft); padding:0 24px; color:var(--color-body, #FBD19D); font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; }
  .cta-primary:hover { border-color:var(--accent); color:var(--accent); }
  .cta-ghost { color:var(--dim); font-family:var(--sans); font-size:10px; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; }
  @media (max-width:680px) {
    header { padding:18px 24px; min-height:60px; }
    main { padding:48px 24px 64px; }
    .detail-row { grid-template-columns:1fr; gap:4px; }
  }
</style>
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/site-typography.css">
<link rel="stylesheet" href="/css/hero.css">
</head>
<body data-venture="events">
<script>
(function(){
  var o = document.createElement("div");
  o.id = "construct-fade";
  o.style.cssText = "position:fixed;inset:0;background:#0e0e0e;z-index:9999;opacity:1;pointer-events:auto;transition:opacity 500ms cubic-bezier(0.45,0,0.55,1);";
  document.body.appendChild(o);
  function fadeOut(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ o.style.opacity = "0"; o.style.pointerEvents = "none"; }); }); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fadeOut); else fadeOut();
})();
</script>
<div class="grain"></div>
<header></header>
<main class="site-hero site-hero--supporting">
  <div id="badge" class="badge"><span class="badge-dot"></span><span id="badgeText">Checking Ticket</span></div>
  <h1 class="hero-title" id="title">Reading your ticket.</h1>
  <p id="lead" class="lead hero-descriptor">Give this a moment. We're confirming your seat and Square payment.</p>
  <div id="details" class="detail-block"></div>
  <div class="cta-row">
    <a class="cta-primary" id="eventBackLink" href="/events/">Back to Events</a>
    <a class="cta-ghost" href="/home/">Return to construct</a>
  </div>
</main>
<script>
(function(){
  const ticketId = new URLSearchParams(window.location.search).get("ticket") || "";
  const badge = document.getElementById("badge");
  const badgeText = document.getElementById("badgeText");
  const title = document.getElementById("title");
  const lead = document.getElementById("lead");
  const details = document.getElementById("details");
  const eventBackLink = document.getElementById("eventBackLink");

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[c];
    });
  }
  function formatDate(value) {
    if (!value) return "";
    try {
      return new Date(value).toLocaleString("en-US", { timeZone:"America/New_York", weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZoneName:"short" });
    } catch (e) { return ""; }
  }
  function renderRow(key, value) {
    return '<div class="detail-row"><span class="detail-key">' + escapeHtml(key) + '</span><span>' + escapeHtml(value) + '</span></div>';
  }

  const params = new URLSearchParams(window.location.search);
  const previewMode = params.get("preview") === "1";
  const ctaRow = document.querySelector(".cta-row");
  let calendarAdded = false;

  // Square's webhook usually lands within seconds; poll a few times before
  // asking the visitor to refresh, so most pending -> paid flips are invisible.
  const POLL_INTERVAL_MS = 2500;
  const MAX_POLLS = 6;
  let polls = 0;

  function addCalendarLink() {
    if (calendarAdded || !ctaRow) return;
    calendarAdded = true;
    const link = document.createElement("a");
    link.className = "cta-primary";
    if (previewMode) {
      link.href = "#";
      link.title = "Disabled in preview";
      link.addEventListener("click", function(e){ e.preventDefault(); });
    } else {
      link.href = "/api/events/tickets/" + encodeURIComponent(ticketId) + "/calendar";
    }
    link.textContent = "Add to calendar";
    ctaRow.insertBefore(link, ctaRow.firstChild);
  }

  function setEventBackLink(slug) {
    if (!eventBackLink || !slug) return;
    eventBackLink.href = "/events/" + encodeURIComponent(slug) + "/";
    eventBackLink.textContent = "Back to event";
  }

  // Dummy ticket for the events preview hub (?preview=1&state=...). Nothing is
  // read from the API; the confirmation flow renders exactly as it would live.
  function previewTicket(state) {
    const start = new Date(Date.now() + 26 * 60 * 60 * 1000);
    const previewEvent = params.get("event") === "cultandshift"
      ? {
          title: "Cult & Shift",
          slug: "cultandshift",
          amountFormatted: "$40.00",
          location: "the six.well construct - location shared after booking",
        }
      : {
          title: "Signal & Symbol",
          slug: "signal-symbol",
          amountFormatted: "$90.00",
          location: "the six.well construct - location shared after booking",
        };
    return {
      id: "demo",
      status: state === "cancelled" ? "cancelled" : (state === "pending" ? "pending" : "paid"),
      seats: 2,
      amountFormatted: previewEvent.amountFormatted,
      eventTitle: previewEvent.title,
      eventSlug: previewEvent.slug,
      eventStartsAt: start.toISOString(),
      eventLocation: previewEvent.location,
      contactName: "Jordan Rivera",
      contactEmail: "jordan@example.com",
    };
  }

  async function load() {
    let ticket;
    if (previewMode) {
      if (params.get("state") === "error") throw new Error("Ticket not found.");
      ticket = previewTicket(params.get("state") || "paid");
    } else {
      if (!ticketId) throw new Error("Ticket reference is missing.");
      const response = await fetch("/api/events/tickets/" + encodeURIComponent(ticketId));
      const payload = await response.json().catch(function(){ return {}; });
      if (!response.ok) throw new Error(payload.error || "Unable to confirm this ticket.");
      ticket = payload.ticket;
    }
    const paid = ticket.status === "paid";
    const cancelled = ticket.status === "cancelled";
    const paymentLabel = paid ? "received" : (cancelled ? "cancelled" : "pending");
    setEventBackLink(ticket.eventSlug);

    badge.classList.toggle("pending", !paid);
    badgeText.textContent = paid ? "Ticket Confirmed" : (cancelled ? "Ticket Cancelled" : "Payment Pending");
    title.textContent = paid ? "You're in." : (cancelled ? "This ticket was cancelled." : "Your ticket is waiting on payment.");
    lead.textContent = paid
      ? "Your seat is confirmed and paid. A confirmation email is on its way — keep an eye out for any direct follow-up before the night."
      : cancelled
        ? "This ticket has been cancelled. If a refund is due, it has been issued to your original payment method."
        : "Square hasn't returned a paid order yet. We're checking automatically — this can take a few seconds.";

    const rows = [
      renderRow("Event", ticket.eventTitle),
      ticket.eventStartsAt ? renderRow("When", formatDate(ticket.eventStartsAt)) : "",
      ticket.eventLocation ? renderRow("Where", ticket.eventLocation) : "",
      renderRow("Name", ticket.contactName),
      renderRow("Seats", ticket.seats),
      renderRow(cancelled ? "Amount" : "Paid", ticket.amountFormatted + " / " + paymentLabel),
      renderRow("Status", ticket.status),
    ];
    details.innerHTML = rows.filter(Boolean).join("");

    if (paid && ticket.eventStartsAt) addCalendarLink();
    return ticket.status;
  }

  function run() {
    load()
      .then(function(status){
        if (previewMode) return;
        if (status === "pending" && polls < MAX_POLLS) {
          polls += 1;
          setTimeout(run, POLL_INTERVAL_MS);
        } else if (status === "pending") {
          lead.textContent = "Square still hasn't returned a paid order. If you just paid, refresh this page in a moment.";
        }
      })
      .catch(function(error){
        badge.classList.add("pending");
        badgeText.textContent = "Confirmation Issue";
        title.textContent = "This ticket could not be confirmed.";
        lead.textContent = error.message;
      });
  }

  run();
})();
</script>
<script src="/js/transition.js"></script>
<script src="/js/construct-corner.js"></script>
<script src="/js/construct-nav.js"></script>
</body>
</html>
